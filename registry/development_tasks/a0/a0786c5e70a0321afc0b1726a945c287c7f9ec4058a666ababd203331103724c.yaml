      5.5 小时只有 4 个重型节点在跑、12 个 worker 空闲；调度模拟 6.96 小时对实测 7.05 小时。待做三步：(1) 对 4 个代表重型节点做函数级计时（身份哈希、回放、git、进程启动占比，空闲对比高负载）；(2)
      在 Full/重负载 pilot 期间采样主机 CPU、磁盘队列、句柄数，由数据决定 K 与启动间隔；(3) 审计 28/11/9/14 个变体测试族的变体维度是否真的改变昂贵的前置步骤，并给出不降低覆盖的共享夹具方案。任何测试结构调整须先经
      owner 评审，另立任务实施；P1/P4/O3 仍属 DEVX-018，O3 身份缓存仍待 owner 决定。
