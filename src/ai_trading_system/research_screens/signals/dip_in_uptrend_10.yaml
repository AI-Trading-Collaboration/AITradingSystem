signal_id: dip_in_uptrend_10
mechanism: >-
  上升趋势里的急跌：慢趋势还向上时出现的短期下跌多半很快收回，跌得越多，之后收益越高。信号值是慢趋势（过去 252 个
  交易日的复利收益）为正时，过去 10 个交易日的复利收益；慢趋势不为正时没有值。这个想法是看了第一、二题验证窗口里
  快跌快回的结果才提出的（研究自动循环第一批假设卡 H06），验证窗口对它不是干净的检验。
expected_sign: -1
target: return
params:
  short: 10
  long: 252
sources: []
markets: all
literature: 无可靠的学术检验；指数层面的短期反转证据混杂（见研究自动循环第一批假设卡 H06）
