# Trial gate of the research loop (TRADING-2565 trial mode; format in
# src/ai_trading_system/research_bench/trial.py). Zone C, like every research/*/prereg.yaml.
#
# The two-stage ruler, approved by Baker with the owner decision below and recorded in
# docs/requirements/TRADING-2565_Research_Bench.md. The ruler probe (TRADING-2565-18) measured it on
# US windows cut at 2010-12-31: on 40-year windows followed by ten-year windows the planted signal L
# passed both stages in 16 of 16 pairs and no near-zero-effect rule passed any; on 30-year windows L
# passed 14 of 21. So stage 1 needs at least 40 years of history: it runs on the US market's
# development window (82 years). The QQQ development window (12 years) is too short for stage 1 and
# only checks the direction; after a question is opened, its validation read checks the direction
# the same way (stage 2). A screened candidate is not opened as a question first: its trial plan
# (T0001.yaml, T0002.yaml, ...) fixes up to max_configs_per_trial configurations, and each runs on
# the development data of both markets below. The plan's primary configuration passes the gate when
# every rule holds on both markets; the other configurations are sensitivity, run, counted and
# reported, and never decide. Only a candidate whose primary configuration passes goes to Baker. A
# trial never reads a validation window. Any change to this file needs a new owner decision.
# The gate before this decision is kept, byte for byte, as
# src/ai_trading_system/research_probes/trial_gate_v1.yaml: the two probes measured that one.
schema_version: research_trial_gate.v1
owner_decision: owner_decision:TRADING-2565:2026-10-17:ruler_40y
max_configs_per_trial: 8            # research loop charter, period 1, section 5: every configuration counts
confidence: 0.95                    # bootstrap interval of every trial run
markets:
  qqq:
    question_type: qqq_direction    # development window qqq_long_history_development, 1999-03-10..2010-12-31
    qqq_series: actual              # the real QQQ from 1999-03-10, as in QQQ-Q2 and QQQ-Q3
    rules:                          # stage 2 (S3): the direction only
      - {metric: ci_high.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: the left tail is not clearly worse (95% interval upper bound above 0)}
      - {metric: comparison.geometric_annual_return, op: ">=", value: -0.010, note: gives up at most 1.0 point a year}
  us_market:
    question_type: us_market_trial  # development window us_market_1929_2010, 1929-01-02..2010-12-31 (Ken French)
    # A configuration that holds the synthetic ten-year Treasury in place of cash runs on this type
    # (window us_market_1962_2010, 49 years: DGS10 starts in 1962), with the same rules
    # (TRADING-2567 P1, owner_decision:TRADING-2567:2026-10-18:portfolio_p1). QQQ needs none: its
    # window starts in 1999.
    reserve_question_types: {treasury_10y: us_market_bond_trial}
    rules:                          # stage 1 (core four at 0.95) on 82 years, at least the 40 the ruler needs
      - {metric: ci_low.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: the interval excludes no left-tail improvement}
      - {metric: comparison.max_drawdown, op: ">=", value: 0.05, note: drawdown at least 5 points shallower}
      - {metric: comparison.geometric_annual_return, op: ">=", value: -0.010, note: gives up at most 1.0 point a year}
      - {metric: cost_25.geometric_annual_return, op: ">=", value: -0.010, note: the cost condition holds at 25 bps}
    # Episodes of the de-risk event table on the US market, by calendar month. They are read in the
    # report and never ruled on.
    event_episodes:
      - {id: crash_1929, start: "1929-10", end: "1929-11"}
      - {id: flash_crash_1962, start: "1962-05", end: "1962-06"}
      - {id: crash_1987, start: "1987-10", end: "1987-10"}
      - {id: ltcm_1998, start: "1998-08", end: "1998-10"}
      - {id: dotcom_bear, start: "2000-03", end: "2002-10"}
      - {id: global_financial_crisis, start: "2007-10", end: "2009-03"}
production_effect: none
broker_action: none
