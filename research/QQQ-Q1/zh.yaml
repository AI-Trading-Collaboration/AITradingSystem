# Chinese wording of QQQ-Q1 for the research progress page (TRADING-2568). Display text only: the
# preregistration (prereg.yaml) and strategy.py decide everything; this file never feeds a run.
schema_version: research_zh.v1
title: 按已实现波动每月调仓，能让回撤更浅、左尾更温和吗？
summary: >-
  Q1a 不加杠杆：目标仓位 = min(1, σ*/σ近)；Q1b 用 2 倍、3 倍杠杆产品：目标仓位 = min(3, 2σ*/σ近)。
  σ近 是 QQQ 最近 21 个交易日日收益的年化标准差（波动越大仓位越低），σ* 是 1986 年到 1999-03-09
  之间同一估计量的中位数（一个固定的数，窗口里的任何收益都改不了它）。每月最后一个交易日调整。
  对照是平均仓位相同的固定仓位。Q1a 看左尾和最大回撤，Q1b 看经历坏年景之后的复利（滚动 3 年的低位）。
verdict: >-
  保留：所有门槛都成立。拒绝：主指标（Q1a 看左尾，Q1b 看滚动 3 年几何年化的低位）或最大回撤的点估计比对照更差（只对这个估计量和调仓方式成立）。其余是证据不足。
strategies:
  q1a:
    name: 波动目标（不加杠杆）
    role: 正式策略 Q1a
    rule:
      - label: 信号
        text: 「已实现波动」σ近：QQQ 最近 21 个交易日日收益的标准差乘 √252（年化）。1999-03-10 之前用纳斯达克 100 价格指数代替
      - label: 目标仓位
        text: min(1, σ*/σ近)。σ* 是 1986 年到 1999-03-09 之间 σ近 的中位数，是固定常数；仓位不会超过 100%，也就是不加杠杆
      - label: 买入（加仓）
        text: 最近更平静（σ近 下降）时目标仓位上升，最高 100%，买入 QQQ
      - label: 卖出（减仓）
        text: 最近波动变大（σ近 上升）时目标仓位下降，卖出 QQQ 换成现金
      - label: 调仓
        text: 每月最后一个交易日收盘后算目标仓位，下一个交易日收盘成交；其余日子不动
      - label: 其他
        text: 成本和成交规则由评估台统一计算
  q1b:
    name: 波动目标（杠杆）
    role: 正式策略 Q1b
    rule:
      - label: 信号
        text: 同 Q1a，「已实现波动」σ近（最近 21 个交易日，年化）
      - label: 目标仓位
        text: min(3, 2σ*/σ近)。仓位最高 3 倍，用 QQQ、2 倍和 3 倍杠杆产品凑出来
      - label: 买入（加仓）
        text: σ近 下降时目标仓位上升，最高 3 倍
      - label: 卖出（减仓）
        text: σ近 上升时目标仓位下降，可以降到低于 100%，多出的部分是现金
      - label: 调仓
        text: 每月最后一个交易日收盘后算目标仓位，下一个交易日收盘成交；其余日子不动
      - label: 其他
        text: 成本和成交规则由评估台统一计算
  q1a_window63:
    name: 波动窗口 63 日（不加杠杆）
    role: 开发期变体：把 σ近 的窗口从 21 日改成 63 日，其余同 Q1a
  q1b_window63:
    name: 波动窗口 63 日（杠杆）
    role: 开发期变体：把 σ近 的窗口从 21 日改成 63 日，其余同 Q1b
  q1a_ewma:
    name: 指数加权波动（不加杠杆）
    role: 开发期变体：σ近 改成指数加权（半衰期 11.2 日，相当于 λ = 0.94），其余同 Q1a
  q1b_ewma:
    name: 指数加权波动（杠杆）
    role: 开发期变体：σ近 改成指数加权（半衰期 11.2 日，相当于 λ = 0.94），其余同 Q1b
  q1a_weekly:
    name: 每周调仓（不加杠杆）
    role: 开发期变体：改成每周最后一个交易日调仓，其余同 Q1a
  q1b_weekly:
    name: 每周调仓（杠杆）
    role: 开发期变体：改成每周最后一个交易日调仓，其余同 Q1b
  q1a_band20:
    name: 偏离 20% 才交易（不加杠杆）
    role: 开发期变体：每个交易日检查，只有当前仓位偏离目标超过目标的 20% 才交易，其余同 Q1a
  q1b_band20:
    name: 偏离 20% 才交易（杠杆）
    role: 开发期变体：每个交易日检查，只有当前仓位偏离目标超过目标的 20% 才交易，其余同 Q1b
