# Trial plan T0004 (TRADING-2565 trial mode; format in src/ai_trading_system/research_bench/trial.py).
#
# Written before any trial of this candidate ran; judged by the gate in prereg.yaml. Every run records
# this file's SHA-256 and the bench refuses a run once the plan differs from the one an earlier run
# used: a configuration thought of after reading results is a new hypothesis and starts again from a
# hypothesis card. The signal is pinned by the SHA-256 of its module and specification. The four
# configurations are the ones T0001 used, unchanged.
#
# from_validation_window is false: card H10 came from the literature and the screen ledger, not from
# any validation read (hypothesis batch 03).
#
# Expected before running (charter section 12): S0013 put the signal's largest rank correlation with
# a screen baseline at 0.878, just under the 0.9 copy rule, and card H10 named rv_21 as the likely
# baseline (inferred; the ledger record was not opened). So this trial largely re-tests volatility
# timing, and the most likely result is the volatility family's: some left-tail effect at too high
# a geometric cost, as q1a.
schema_version: research_trial_plan.v1
trial_id: T0004
candidate:
  signals: [industry_dispersion_21]
  screens: [S0013]                  # candidate in the batch 3 loop screen (signal snapshot sig-7ad8aa00b736)
hypothesis_card: research loop period 1, hypothesis batch 03, card H10 (Stivers 2003; Garcia et al. 2014)
from_validation_window: false
data:
  snapshot_id: qlh-20261013-0b0df53cb1a2   # long-history snapshot for the QQQ market, as T0001 and T0002
  signal_snapshot_id: sig-7ad8aa00b736     # US market, the snapshot S0013 was screened on
# Score "percentile": the signal's expanding percentile, oriented by its specification's expected sign
# and target so that 1 is the end the hypothesis favours. The target is risk with expected sign +1
# (higher industry dispersion, higher later volatility), so the favoured end is low dispersion.
# Mapping "linear" low 0, high 1: exposure = score; "threshold": high at or above cut, low below it.
primary: primary
configs:
  - id: primary
    function: signal_exposure
    params:
      signals:
        - {id: industry_dispersion_21, module_sha256: f173b29ef9b116dc08fb618c2bc4c052fe601a4c203bc9187f0e0f2a5bfd7d29, spec_sha256: efbaf8f95c1e79ddff36b0bf40012137914644bb6272fb1ea925ebf5a24270eb, score: percentile}
      mapping: linear
      low: 0
      high: 1
    rebalance: {schedule: month_end, band: 0.0}
  # Sensitivity, never deciding: in or out at the median, a half floor, and a weekly rebalance.
  - id: threshold
    function: signal_exposure
    params:
      signals:
        - {id: industry_dispersion_21, module_sha256: f173b29ef9b116dc08fb618c2bc4c052fe601a4c203bc9187f0e0f2a5bfd7d29, spec_sha256: efbaf8f95c1e79ddff36b0bf40012137914644bb6272fb1ea925ebf5a24270eb, score: percentile}
      mapping: threshold
      low: 0
      high: 1
      cut: 0.5
    rebalance: {schedule: month_end, band: 0.0}
  - id: floor_half
    function: signal_exposure
    params:
      signals:
        - {id: industry_dispersion_21, module_sha256: f173b29ef9b116dc08fb618c2bc4c052fe601a4c203bc9187f0e0f2a5bfd7d29, spec_sha256: efbaf8f95c1e79ddff36b0bf40012137914644bb6272fb1ea925ebf5a24270eb, score: percentile}
      mapping: linear
      low: 0.5
      high: 1
    rebalance: {schedule: month_end, band: 0.0}
  - id: weekly
    function: signal_exposure
    params:
      signals:
        - {id: industry_dispersion_21, module_sha256: f173b29ef9b116dc08fb618c2bc4c052fe601a4c203bc9187f0e0f2a5bfd7d29, spec_sha256: efbaf8f95c1e79ddff36b0bf40012137914644bb6272fb1ea925ebf5a24270eb, score: percentile}
      mapping: linear
      low: 0
      high: 1
    rebalance: {schedule: week_end, band: 0.0}
production_effect: none
broker_action: none
