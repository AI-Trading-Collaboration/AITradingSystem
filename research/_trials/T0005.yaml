# Trial plan T0005 (TRADING-2565 trial mode; format in src/ai_trading_system/research_bench/trial.py).
#
# Written before any trial of this candidate ran; judged by the gate in prereg.yaml. Every run records
# this file's SHA-256 and the bench refuses a run once the plan differs from the one an earlier run
# used: a configuration thought of after reading results is a new hypothesis and starts again from a
# hypothesis card. The signal is pinned by the SHA-256 of its module and specification. The four
# configurations are the ones T0001 used, unchanged.
#
# from_validation_window is false: card H11 came from the literature, not from any validation read
# (hypothesis batch 03).
#
# Expected before running (charter section 12): card H11's most likely failure is that defensive
# industries lead mostly on the way down, so the signal cuts exposure late, as T0003 did.
schema_version: research_trial_plan.v1
trial_id: T0005
candidate:
  signals: [defensive_lead_63]
  screens: [S0014]                  # candidate in the batch 3 loop screen (signal snapshot sig-7ad8aa00b736)
hypothesis_card: research loop period 1, hypothesis batch 03, card H11 (Hong et al. 2007; Baker and Wurgler 2012)
from_validation_window: false
data:
  snapshot_id: qlh-20261013-0b0df53cb1a2   # long-history snapshot for the QQQ market, as T0001 and T0002
  signal_snapshot_id: sig-7ad8aa00b736     # US market, the snapshot S0014 was screened on
# Score "percentile": the signal's expanding percentile, oriented by its specification's expected sign
# and target so that 1 is the end the hypothesis favours. The target is risk with expected sign +1
# (defensive industries ahead of the market, higher later volatility), so the favoured end is a low
# or negative defensive lead.
# Mapping "linear" low 0, high 1: exposure = score; "threshold": high at or above cut, low below it.
primary: primary
configs:
  - id: primary
    function: signal_exposure
    params:
      signals:
        - {id: defensive_lead_63, module_sha256: 32df4f8d755f442fcdb8d78c85584af6860941207d130349a7b70b315d28069b, spec_sha256: 56cc14b56f3c08de131fccde3c2ffa33936d5f7c17cce6e4e83bf46aabe127d4, score: percentile}
      mapping: linear
      low: 0
      high: 1
    rebalance: {schedule: month_end, band: 0.0}
  # Sensitivity, never deciding: in or out at the median, a half floor, and a weekly rebalance.
  - id: threshold
    function: signal_exposure
    params:
      signals:
        - {id: defensive_lead_63, module_sha256: 32df4f8d755f442fcdb8d78c85584af6860941207d130349a7b70b315d28069b, spec_sha256: 56cc14b56f3c08de131fccde3c2ffa33936d5f7c17cce6e4e83bf46aabe127d4, score: percentile}
      mapping: threshold
      low: 0
      high: 1
      cut: 0.5
    rebalance: {schedule: month_end, band: 0.0}
  - id: floor_half
    function: signal_exposure
    params:
      signals:
        - {id: defensive_lead_63, module_sha256: 32df4f8d755f442fcdb8d78c85584af6860941207d130349a7b70b315d28069b, spec_sha256: 56cc14b56f3c08de131fccde3c2ffa33936d5f7c17cce6e4e83bf46aabe127d4, score: percentile}
      mapping: linear
      low: 0.5
      high: 1
    rebalance: {schedule: month_end, band: 0.0}
  - id: weekly
    function: signal_exposure
    params:
      signals:
        - {id: defensive_lead_63, module_sha256: 32df4f8d755f442fcdb8d78c85584af6860941207d130349a7b70b315d28069b, spec_sha256: 56cc14b56f3c08de131fccde3c2ffa33936d5f7c17cce6e4e83bf46aabe127d4, score: percentile}
      mapping: linear
      low: 0
      high: 1
    rebalance: {schedule: week_end, band: 0.0}
production_effect: none
broker_action: none
