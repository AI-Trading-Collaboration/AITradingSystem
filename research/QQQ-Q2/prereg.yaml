validation:
  # trend4 decides Q2a. ma10 is run in the same read as the reference rule of the same family
  # (Levine and Pedersen 2016: moving average and time-series momentum are one family, so together
  # they are one hypothesis); its result is shown beside trend4 and never changes trend4's verdict.
  # credit_gate decides Q2b. Each against the constant exposure with the same average, rebalanced the same
  # way. Kept when every rule holds; rejected when the point estimate of the left tail
  # (comparison.cvar_5pct_relative_improvement) or of the drawdown (comparison.max_drawdown) is worse than
  # the constant exposure (this construction only); otherwise evidence insufficient. Development results
  # only check the implementation; no parameter changes after reading them except recorded bug fixes.
  # Thresholds are the ones Q1a used, so the two questions read the same way. The de-risk event table
  # (false alarms, protective events, whipsaws per year, exit and re-entry lags on the fixed episodes)
  # is printed with every run and is read, not ruled on.
  strategies: [trend4, ma10, credit_gate]
  rules:
    trend4:
      - {metric: comparison.cvar_5pct_relative_improvement, op: ">=", value: 0.10, note: left tail at least 10% milder}
      - {metric: ci_low.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: the interval excludes no improvement}
      - {metric: comparison.max_drawdown, op: ">=", value: 0.05, note: drawdown at least 5 points shallower}
      - {metric: comparison.geometric_annual_return, op: ">=", value: -0.010, note: gives up at most 1.0 point a year}
      - {metric: cost_25.geometric_annual_return, op: ">=", value: -0.010, note: the cost condition holds at 25 bps}
      - {metric: delay_2.cvar_5pct_relative_improvement, op: ">=", value: 0.10, note: the tail condition holds two days late}
      - {metric: leave_year_min.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: no single year carries the tail result}
      - {metric: leave_year_min.max_drawdown, op: ">", value: 0.0, note: no single year carries the drawdown result}
      - {metric: leave_episode_min.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: no single fixed episode carries the tail result}
      - {metric: leave_episode_min.max_drawdown, op: ">", value: 0.0, note: no single fixed episode carries the drawdown result}
      - {metric: placebo_rank.cvar_5pct_relative_improvement, op: ">=", value: 0.95, note: beats 95% of same-exposure random timings}
    ma10:
      - {metric: comparison.cvar_5pct_relative_improvement, op: ">=", value: 0.10, note: left tail at least 10% milder}
      - {metric: ci_low.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: the interval excludes no improvement}
      - {metric: comparison.max_drawdown, op: ">=", value: 0.05, note: drawdown at least 5 points shallower}
      - {metric: comparison.geometric_annual_return, op: ">=", value: -0.010, note: gives up at most 1.0 point a year}
      - {metric: cost_25.geometric_annual_return, op: ">=", value: -0.010, note: the cost condition holds at 25 bps}
      - {metric: delay_2.cvar_5pct_relative_improvement, op: ">=", value: 0.10, note: the tail condition holds two days late}
      - {metric: leave_year_min.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: no single year carries the tail result}
      - {metric: leave_year_min.max_drawdown, op: ">", value: 0.0, note: no single year carries the drawdown result}
      - {metric: leave_episode_min.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: no single fixed episode carries the tail result}
      - {metric: leave_episode_min.max_drawdown, op: ">", value: 0.0, note: no single fixed episode carries the drawdown result}
      - {metric: placebo_rank.cvar_5pct_relative_improvement, op: ">=", value: 0.95, note: beats 95% of same-exposure random timings}
    credit_gate:
      - {metric: comparison.cvar_5pct_relative_improvement, op: ">=", value: 0.10, note: left tail at least 10% milder}
      - {metric: ci_low.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: the interval excludes no improvement}
      - {metric: comparison.max_drawdown, op: ">=", value: 0.05, note: drawdown at least 5 points shallower}
      - {metric: comparison.geometric_annual_return, op: ">=", value: -0.010, note: gives up at most 1.0 point a year}
      - {metric: cost_25.geometric_annual_return, op: ">=", value: -0.010, note: the cost condition holds at 25 bps}
      - {metric: delay_2.cvar_5pct_relative_improvement, op: ">=", value: 0.10, note: the tail condition holds two days late}
      - {metric: leave_year_min.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: no single year carries the tail result}
      - {metric: leave_year_min.max_drawdown, op: ">", value: 0.0, note: no single year carries the drawdown result}
      - {metric: leave_episode_min.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: no single fixed episode carries the tail result}
      - {metric: leave_episode_min.max_drawdown, op: ">", value: 0.0, note: no single fixed episode carries the drawdown result}
      - {metric: placebo_rank.cvar_5pct_relative_improvement, op: ">=", value: 0.95, note: beats 95% of same-exposure random timings}
  confidence: 0.975                 # two hypotheses (trend family, credit gate): Bonferroni on 95%
sensitivity:                        # development only, each a trial, none decides anything
  - weekly rebalance (trend4_weekly, ma10_weekly, credit_gate_weekly)
  - without the 1-month lookback, 3/6/12 months only (trend3_long)
  - credit gate at the top tenth and the top 30% of history (credit_gate_top10, credit_gate_top30)
  - credit gate cuts exposure to 25% instead of 50% (credit_gate_low25)
prior_expectation:
  effect: >-
    Q2a (and the moving-average reference): exposure comes down in slow declines, so the drawdown
    is shallower and the left tail milder; the price is return given up in fast reversals and an
    exit that comes late. On 2011-2021 (one long rise with short sharp breaks) a small net effect
    is expected, and evidence insufficient is the most likely verdict. Q2b: the credit spread
    predicts forward volatility (the screen: rank IC about 0.5 against forward 21-day volatility, 51 of 51
    markets with the same sign), so a milder left tail at a similar return; its edge over the trailing
    realized volatility is modest (partial rank IC 0.24 on the US market, 0.10 on QQQ).
  fails_when: >-
    Q2a: a V-shaped fall and recovery (2015-08, 2018-12, 2020-02/03): the signals turn after the fall
    and turn back after the rebound; a long smooth rise, where every exit costs return. The development
    window's two slow bear markets (2000-2002, 2008) favour trend rules, so the validation window
    decides. Q2b: the spread widens after equities have fallen (2020-03) and stays wide while they
    recover (2009, 2016, 2020 H2); the screen found a volatility signal, not a return signal, and the
    spread leans on few episodes (2001-03, 2008-09). Both sub-questions differ from the falsified
    scope in research/negative_results.md: the monthly 21-day realized-volatility leverage rule
    (line 23, Q1b) used another risk signal and up to 3x leverage; these rules never exceed 1x.
    From Q1 (Q1a evidence insufficient, Q1b rejected on 2011-2021): de-risking rules carried
    information, but a rule that looked good in the development bear markets did not beat constant
    exposure by enough on the validation window.
  sources:
    - Faber (2007), A Quantitative Approach to Tactical Asset Allocation
    - Moskowitz, Ooi and Pedersen (2012), Time Series Momentum
    - Hurst, Ooi and Pedersen (2017), A Century of Evidence on Trend-Following Investing
    - Levine and Pedersen (2016), Which Trend Is Your Friend?
    - Huang, Li, Wang and Zhou (2020), Time series momentum - is it there?
    - Zakamulin (2016), A Comprehensive Look at the Empirical Performance of Moving Average Trading Strategies
    - Sullivan, Timmermann and White (1999), Data-Snooping, Technical Trading Rule Performance, and the Bootstrap
    - Campbell and Taksler (2003), Equity Volatility and Corporate Bond Yields
sample_floor:
  min_return_days: 2000             # the validation window has about 2,550; CVaR 5% uses about 128
trial_cap: 20                       # 10 configurations, and each once more after a recorded bug fix
stop_conditions:
  - the bench's invariant tests fail
  - the snapshot check is FAIL
  - after reading development results, no parameter changes except recorded bug fixes; each rerun counts as a trial
production_effect: none
broker_action: none
