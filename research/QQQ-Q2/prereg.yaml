schema_version: research_prereg.v1
question_id: QQQ-Q2
question: >-
  Does a fixed classic trend rule give a shallower drawdown and a milder left tail than a constant
  exposure with the same average, at a similar geometric return? Q2a: exposure equals the share of the
  1-, 3-, 6- and 12-month trailing returns that are positive (no leverage, set at month end); the 10-month
  moving-average rule (in or out) is the reference rule of the same family. Q2b: halve exposure while the
  Baa-minus-10-year credit spread is in the top fifth of its own history to date (the one candidate from
  the first four screens).
question_type: qqq_direction
owner_decision: owner_decision:TRADING-2567:2026-10-15:qqq_q2_prereg
data:
  snapshot_id: qlh-20261013-0b0df53cb1a2
  qqq_series: actual                # the real QQQ (FMP adjusted close) from 1999-03-10
  signal_snapshot_id: sig-1e9873757a84   # FRED BAA10Y for Q2b; the trend signals need no outside source
screens: [S0002]                    # credit_spread_level: candidate (eliminated S0001, inconclusive S0003/S0004 are not used)
screen_family_size: 4               # screened signals in the global ledger when this was written
