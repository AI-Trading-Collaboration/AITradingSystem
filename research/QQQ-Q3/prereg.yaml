validation:
  # fast_slow decides Q3. slow_only is run in the same read as the reference rule: its result is shown beside
  # fast_slow (does the fast signal add anything to the slow one?) and never changes fast_slow's verdict.
  # Each is compared with the constant exposure with the same average, rebalanced the same way. Kept when
  # every rule holds; rejected when the point estimate of the left tail (comparison.cvar_5pct_relative_improvement)
  # or of the drawdown (comparison.max_drawdown) is worse than the constant exposure (this construction only);
  # otherwise evidence insufficient. Development results only check the implementation; no parameter
  # changes after reading them except recorded bug fixes. Thresholds are the ones Q1a and Q2 used, so the
  # three questions read the same way. The de-risk event table is printed with every run and is read, not
  # ruled on. trend4 (Q2a) is not run again: the comparison with it uses the numbers already published in
  # research/QQQ-Q2/decision.md.
  strategies: [fast_slow, slow_only]
  rules:
    fast_slow:
      - {metric: comparison.cvar_5pct_relative_improvement, op: ">=", value: 0.10, note: left tail at least 10% milder}
      - {metric: ci_low.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: the interval excludes no improvement}
      - {metric: comparison.max_drawdown, op: ">=", value: 0.05, note: drawdown at least 5 points shallower}
      - {metric: comparison.geometric_annual_return, op: ">=", value: -0.010, note: gives up at most 1.0 point a year}
      - {metric: cost_25.geometric_annual_return, op: ">=", value: -0.010, note: the cost condition holds at 25 bps}
      - {metric: delay_2.cvar_5pct_relative_improvement, op: ">=", value: 0.10, note: the tail condition holds two days late}
      - {metric: leave_year_min.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: no single year carries the tail result}
      - {metric: leave_year_min.max_drawdown, op: ">", value: 0.0, note: no single year carries the drawdown result}
      - {metric: leave_episode_min.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: no single fixed episode carries the tail result}
      - {metric: leave_episode_min.max_drawdown, op: ">", value: 0.0, note: no single fixed episode carries the drawdown result}
      - {metric: placebo_rank.cvar_5pct_relative_improvement, op: ">=", value: 0.95, note: beats 95% of same-exposure random timings}
    slow_only:
      - {metric: comparison.cvar_5pct_relative_improvement, op: ">=", value: 0.10, note: left tail at least 10% milder}
      - {metric: ci_low.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: the interval excludes no improvement}
      - {metric: comparison.max_drawdown, op: ">=", value: 0.05, note: drawdown at least 5 points shallower}
      - {metric: comparison.geometric_annual_return, op: ">=", value: -0.010, note: gives up at most 1.0 point a year}
      - {metric: cost_25.geometric_annual_return, op: ">=", value: -0.010, note: the cost condition holds at 25 bps}
      - {metric: delay_2.cvar_5pct_relative_improvement, op: ">=", value: 0.10, note: the tail condition holds two days late}
      - {metric: leave_year_min.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: no single year carries the tail result}
      - {metric: leave_year_min.max_drawdown, op: ">", value: 0.0, note: no single year carries the drawdown result}
      - {metric: leave_episode_min.cvar_5pct_relative_improvement, op: ">", value: 0.0, note: no single fixed episode carries the tail result}
      - {metric: leave_episode_min.max_drawdown, op: ">", value: 0.0, note: no single fixed episode carries the drawdown result}
      - {metric: placebo_rank.cvar_5pct_relative_improvement, op: ">=", value: 0.95, note: beats 95% of same-exposure random timings}
  confidence: 0.95                  # one hypothesis (fast/slow; the slow-only reference is the same family)
sensitivity:                        # development only, each a trial, none decides anything
  - fast signal alone, one-month sign (fast_only)
  - weekly rebalance (fast_slow_weekly, slow_only_weekly)
  - fast signal on 63 days instead of 21 (fast63_slow252)
  - slow signal on 126 days instead of 252 (fast21_slow126)
prior_expectation:
  effect: >-
    The slow signal keeps the exposure down in slow declines; the fast signal adds a half position
    after a bad month inside an up-trend, which is where the paper finds traditional momentum loses
    most (turning points: a rebound inside a down-trend, a pullback inside an up-trend). A shallower
    drawdown and a milder left tail are expected in the development window (two slow bear markets, 2000-2002
    and 2008). On 2011-2021 (one long rise with short sharp breaks) a small net effect is expected and
    evidence insufficient is the most likely verdict.
  fails_when: >-
    A pullback inside an up-trend is often followed by a rebound (one-month reversal, and V-shaped falls
    in 2015-08, 2018-12 and 2020-03), so halving exposure after a bad month gives up the rebound; with the
    slow signal positive almost all of 2011-2021 the rule behaves as a one-month filter (fast_only in the
    sensitivity list) and the half position is a cost. The paper's gain is for futures across 55 markets
    with estimated weights and gross returns; a single index with a fixed half weight can be much
    weaker. The rule is a subset of Q2's trend4 (it shares the 21-day and 252-day signals), so its
    result is not independent evidence of trend4's. Differs from the falsified scope in
    research/negative_results.md: no leverage, no realized-volatility signal, no credit spread.
  sources:
    - Garg, Goulding, Harvey and Mazzoleni (2021), Momentum Turning Points, Journal of Financial Economics 142(1)
    - Daniel and Moskowitz (2016), Momentum Crashes, Journal of Financial Economics 122(2)
    - Moskowitz, Ooi and Pedersen (2012), Time Series Momentum
    - Levine and Pedersen (2016), Which Trend Is Your Friend?
    - Jegadeesh (1990), Evidence of Predictable Behavior of Security Returns
sample_floor:
  min_return_days: 2000             # the validation window has about 2,550; CVaR 5% uses about 128
trial_cap: 14                       # 7 configurations, and each once more after a recorded bug fix
stop_conditions:
  - the bench's invariant tests fail
  - the snapshot check is FAIL
  - after reading development results, no parameter changes except recorded bug fixes; each rerun counts as a trial
production_effect: none
broker_action: none
