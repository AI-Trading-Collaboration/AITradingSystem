# QQQ-Q3 preregistration (TRADING-2567; format in src/ai_trading_system/research_bench/prereg.py).
#
# Written before any result of this question exists. Approved by Baker with the owner decision below,
# recorded in docs/requirements/TRADING-2567_QQQ_Research_Program_1999_Window.md. The signals are the
# fixed classic trend modules pinned by the SHA-256 of their module and specification (TRADING-2565-11);
# the four time-series momentum modules are one file under four names. Any change to this file, to
# strategy.py or to a pinned signal closes the validation window until a new owner decision approves it.
schema_version: research_prereg.v1
question_id: QQQ-Q3
question: >-
  Does halving exposure when a fast and a slow trend signal disagree give a shallower drawdown and a milder
  left tail than a constant exposure with the same average, at a similar geometric return? Q3: the fast
  signal is the sign of the trailing 21-day (about one month) return, the slow signal the sign of the
  trailing 252-day (about twelve months) return; both positive is fully invested, both negative is out,
  and a disagreement (a pullback in an up-trend, a rebound in a down-trend) is half invested; set at month
  end, no leverage. The twelve-month rule alone (in or out) is the reference rule of the same family.
question_type: qqq_direction
owner_decision: owner_decision:TRADING-2567:2026-10-15:qqq_q3_prereg
data:
  snapshot_id: qlh-20261013-0b0df53cb1a2
  qqq_series: actual                # the real QQQ (FMP adjusted close) from 1999-03-10
  signal_snapshot_id: null          # the trend signals need no outside source
screens: []                         # classic trend signals are fixed baselines, not screened (research_screens/signals/README.md)
screen_family_size: 4               # screened signals in the global ledger when this was written
strategy_module: strategy.py        # imports the bench's signal_exposure; the signals are pinned by hash below
# Score "sign": 1 when the oriented signal is positive, 0 when negative. Equal weights: the mean of the
# scores. Mapping "linear" low 0, high 1: exposure = mean score (0, 0.5 or 1 with two signals).
# Mapping "threshold": high at or above cut, low below it (cut is left out for a pure sign signal).
strategies:
  - id: fast_slow
    function: signal_exposure
    params:
      signals:
        - {id: tsmom_21, module_sha256: c67c764c9befff0a87a5d5e79fbb291dae269de9698c13907567378f3566f1a2, spec_sha256: b3a7d3e36f3a418f614ce08ace10d8e7cbf800ebad026ea9d40249289e757934, score: sign}
        - {id: tsmom_252, module_sha256: c67c764c9befff0a87a5d5e79fbb291dae269de9698c13907567378f3566f1a2, spec_sha256: e1e85a47a3cf93dd72ba8d27232d3d8cc5c0fb53545b667cd577a3751cf4e62a, score: sign}
      mapping: linear
      low: 0
      high: 1
    rebalance: {schedule: month_end, band: 0.0}
    delay_days: 0
  - id: slow_only
