schema_version: research_zh.v1
title: 快慢趋势信号分歧时减半仓位，能改善回撤和左尾吗？
summary: >-
  快信号看 QQQ 最近 21 个交易日（约 1 个月）的收益是正是负，慢信号看最近 252 个交易日（约 12 个月）
  的收益是正是负：两个都为正满仓，两个都为负空仓，一正一负（上升趋势里的回调，或下降趋势里的反弹）
  半仓。每月最后一个交易日调整，不加杠杆。同族参照规则是只看 12 个月趋势（进或出）。
verdict: >-
  保留：所有门槛都成立。拒绝：左尾或最大回撤的点估计比对照更差（只对这种构造成立）。其余是证据不足。参照规则 slow_only 的结果放在旁边，不改变 fast_slow 的结论。
