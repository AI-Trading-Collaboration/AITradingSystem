name: CI

# GOV-008: the gate that guards main is local (`python tools/gov008/ship.py`, Windows, 16 workers).
# GitHub Actions is at most an optional check and Linux is out of scope
# (owner_decision:GOV-008:2026-10-10:research_first_refactor_v1), so CI is a manual lint only.
# Known pre-existing lint findings (QuantConnect algorithm files under inputs/research and two long
# lines in src) are not gate failures; run it on demand.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint
        run: python -m ruff check .
