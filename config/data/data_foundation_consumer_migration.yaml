schema_version: data_foundation_consumer_migration_policy.v1
policy_id: data_foundation_daily_score_consumer_migration
policy_version: 1.0.0
status: REVIEWED
owner: data_platform_owner
rationale: >-
  Establish the first consumer-scoped Data Foundation migration on one isolated
  store identity. The candidate must revalidate immutable publication, strict
  data quality, durable copy activation, ACL enforcement, and the reviewed
  daily_score_daily authorization before any consumer runner is invoked.
review_condition: >-
  Re-review before changing the consumer, execution profile, source acceptance
  evidence, ACL or durability policy, candidate-store boundary, or any
  production/scheduler/broker effect.
