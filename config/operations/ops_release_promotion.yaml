schema_version: ops_release_promotion_policy.v2
policy_id: ops_release_promotion_v2
version: 2.1.0
status: REVIEWED_OWNER_GATED
owner: operations_owner_and_project_owner
reviewed_at: 2026-09-04
rationale: >
  Ops releases must be selected explicitly from validated, pushed remote main
  and promoted through a journaled transaction. The active deployment receipt
  is the only mutable release authority; the external automation must not keep
  a second release SHA. Daily execution must never select latest main, mutate
  release state, or repair a failed promotion.
  The automation carrier is projectless and isolated from the development
  checkout; the same scheduler entry owns both the primary and same-day rescue
  invocation windows. A scheduler-policy migration may replace an older active
  receipt only when its complete immutable file identity is explicitly reviewed.
  Permanent runtime-generated state uses an exact, receipt-bound local Git
  exclusion contract so development checkout dirty semantics remain strict.
repository:
  expected_remote: git@github.com:AI-Trading-Collaboration/AITradingSystem.git
  reviewed_remote_ref: refs/remotes/origin/main
  candidate_must_equal_reviewed_remote_ref: true
  independent_git_common_dir_required: true
receipts:
  release_candidate_schema: ops_release_candidate.v1
  deployment_acceptance_schema: ops_deployment_acceptance.v2
  legacy_deployment_acceptance_schema: ops_deployment_acceptance.v1
  legacy_active_release_commits:
    - 12f1e6458e5af4b7ced444e0f4fdc25365afe965
  # Policy migrations may roll forward only from these exact immutable active
  # receipt bytes. This is not a schema or scheduler-field compatibility bypass.
  prior_active_acceptance_allowlist:
    - deployment_id: ops_deployment_13d42bc41d6fcb3228f8abf28d1717807544b66b
      release_commit: ea8937b2a07f5c4fc52ba1c437566017be137baa
      size_bytes: 10907
      sha256: b2dd9727ec7afdd7792244b3d6b571b907f92ca6a7f58017604add4bab95b94d
  promotion_transaction_schema: ops_release_promotion_transaction.v1
  active_receipt_relative_path: outputs/operations/deployment/active.json
  history_relative_path: outputs/operations/deployment/history
  transaction_relative_path: outputs/operations/deployment/transactions
  evidence_relative_path: outputs/operations/deployment/evidence
  required_validation_tiers:
    - fast-unit
    - architecture-fitness
    - contract-validation
    - integration
    - reproducibility
    - full
  required_critical_paths:
    - config/architecture/arch_005_parallel_control_policy.yaml
    - config/architecture/arch_005_s4d_checkout_guard.yaml
    - config/operations/ops_release_promotion.yaml
    - config/operations/ops_scheduler_checkout.yaml
    - config/operations/aitradingsystem_pit_automation_prompt.md
    - docs/operations/operations_runbook.md
    - pyproject.toml
    - src/ai_trading_system/cli_commands/ops.py
    - src/ai_trading_system/ops_release_promotion.py
    - src/ai_trading_system/ops_scheduler_checkout.py
promotion:
  lock_relative_path: outputs/operations/deployment/promotion.lock
  active_daily_lease_required_count: 0
  pre_switch_checkout_policy_source: coordinator_candidate
  automatic_latest_selection: false
  automatic_stash_clean_reset: false
  previous_release_retained: true
runtime:
  python_relative_path: .venv/Scripts/python.exe
  package_module: ai_trading_system
  distribution_name: ai-trading-system
  installed_distribution_inventory_required: true
  git_exclude_managed: true
  git_exclude_patterns:
    - /outputs/
    - /artifacts/
    - /data/derived/
  executable_must_be_below_checkout: true
  imported_package_must_be_below_checkout: true
scheduler:
  provider: codex_automation
  scheduler_id: aitradingsystem-pit
  scheduler_entry_count: 1
  unified_external_trigger:
    - aits
    - ops
    - daily-run
  windows_task_scheduler_entries_allowed: false
  required_environment_names:
    - AITS_EXTERNAL_SCHEDULER
    - AITS_OPS_CHECKOUT_ROOT
    - AITS_DEVELOPMENT_CHECKOUT_ROOT
    - AITS_OPS_DEPLOYMENT_RECEIPT
    - AITS_OPS_PYTHON
  release_identity_authority: active_deployment_receipt
  legacy_release_assertion_name: AITS_OPS_RELEASE_COMMIT
  legacy_release_assertion_mode: exact_match_if_present
  observation_schema: ops_scheduler_observation.v2
  canonical_prompt_relative_path: config/operations/aitradingsystem_pit_automation_prompt.md
  expected_status: ACTIVE
  expected_rrule: FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR,SA,SU;BYHOUR=9,17;BYMINUTE=30;BYSECOND=0
  expected_model: gpt-5.6-sol
  expected_reasoning_effort: xhigh
  expected_execution_environment: local
  expected_target_type: projectless
  # Codex serializes a projectless local carrier with this neutral home sentinel.
  # Any development, runtime, project, or other cwd remains forbidden.
  expected_cwds:
    - "~"
  carrier_mode: PROJECTLESS_ISOLATED
  local_timezone: Asia/Tokyo
  invocation_windows:
    - role: PRIMARY
      hour: 9
      minute: 30
    - role: SAME_DAY_RESCUE
      hour: 17
      minute: 30
  per_invocation_business_trigger_max: 1
  same_scheduler_entry_for_all_windows: true
  observation_must_not_predate_promotion: true
pre_release_canary:
  schema_version: ops_release_preflight_canary.v1
  runner_schema_version: pytest_incident_regression.v1
  required: true
  provider_request_performed: false
  required_scenarios:
    - risk_event_unknown_id_referential_integrity
    - signed_eps_revision_90d_pct
credentials:
  allowed_secret_names:
    - FMP_API_KEY
    - FINANCIAL_MODELING_PREP_API_KEY
    - FRED_API_KEY
    - SEC_USER_AGENT
  required_credential_groups:
    - [FMP_API_KEY, FINANCIAL_MODELING_PREP_API_KEY]
    - [SEC_USER_AGENT]
  forbidden_name_patterns:
    - BROKER
    - IBKR
    - PRODUCTION_WEIGHT
    - ACTIVE_SHADOW_WEIGHT
  secret_values_must_not_be_recorded: true
safety:
  production_effect: none
  production_weight_write: false
  active_shadow_weight_write: false
  broker_action: false
  trading_action: false
review:
  owner: operations_owner_and_project_owner
  condition: >
    Re-review remote/ref, validation requirements, runtime provenance, scheduler
    identity, credential scope, transaction semantics, or safety boundary changes.
