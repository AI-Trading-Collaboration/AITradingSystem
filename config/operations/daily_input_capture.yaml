schema_version: daily_input_capture_policy.v2
policy_version: daily_input_capture_v6
owner: operations_owner_and_data_platform_owner
status: REVIEWED
reviewed_at: 2026-08-05
calendar_authority: XNYS
decision_session_policy: XNYS_DECISION_SESSION_ALIGNED
tracking_start: 2026-07-24
required_components:
  - market_macro
  - fmp_forward_pit
  - sec_companyfacts
  - fmp_valuation
  - official_policy_sources
paths:
  raw_root: data/raw/daily_input_capture
  processed_root: data/processed/daily_input_capture
  external_root: data/external/daily_input_capture
  report_root: outputs/daily_input_capture
  source_control_root: outputs/daily_input_capture/source_control
source_control:
  blocker_taxonomy_version: daily_input_capture_blockers_v1
  lease_ttl_seconds: 1800
  component_policies:
    market_macro:
      source_revision: market_macro_v4_relocation_recovery
      supersedes_source_revisions:
        - daily_input_capture_v3
      max_attempts: 2
      retry_delay_seconds: 5
      retryable_blocker_codes:
        - PROVIDER_UNAVAILABLE
        - REQUEST_FAILED
      recovery_mode: IMMUTABLE_RAW_BACKFILL
    fmp_forward_pit:
      source_revision: daily_input_capture_v3
      supersedes_source_revisions: []
      max_attempts: 1
      retry_delay_seconds: 0
      retryable_blocker_codes: []
      recovery_mode: HISTORICAL_RECAPTURE_FORBIDDEN
    sec_companyfacts:
      source_revision: daily_input_capture_v3
      supersedes_source_revisions: []
      max_attempts: 1
      retry_delay_seconds: 0
      retryable_blocker_codes: []
      recovery_mode: MANUAL_NON_PIT_RAW_REVIEW
    fmp_valuation:
      source_revision: daily_input_capture_v3
      supersedes_source_revisions: []
      max_attempts: 1
      retry_delay_seconds: 0
      retryable_blocker_codes: []
      recovery_mode: HISTORICAL_RECAPTURE_FORBIDDEN
    official_policy_sources:
      source_revision: daily_input_capture_v3
      supersedes_source_revisions: []
      max_attempts: 1
      retry_delay_seconds: 0
      retryable_blocker_codes: []
      recovery_mode: HISTORICAL_RECAPTURE_FORBIDDEN
  rationale: >
    Component-scoped source_revision keeps unchanged PASS source/session states
    reusable across aggregate policy updates. market_macro_v4_relocation_recovery
    explicitly supersedes only the exhausted daily_input_capture_v3 market/macro
    state after the checkout-relocation publication defect was fixed; the old
    state remains immutable at its original path. The market/macro command retains
    the reviewed two-attempt transient-failure budget established by OPS-069.
    PIT-sensitive and mutable-current endpoints
    receive one contemporaneous attempt; later recovery must not manufacture
    historical strict PIT. The 30-minute lease only serializes one
    source/session capture and stale takeover is audit-recorded. PASS reuse binds
    only component-owned raw/normalized/report artifacts. Consumer-owned aggregate
    manifests may be rebuilt downstream and are excluded with an explicit reuse
    disclosure; they cannot weaken exact source artifact verification.
  validation_evidence: OPS-070 fault injection plus OPS-074 retained-consumer validation
  review_condition: >
    Review and bump the affected component source_revision when provider behavior,
    source eligibility, command, attempt budget, retry delay, recovery semantics,
    supersession lineage, or source/consumer artifact ownership changes. Also
    review lease TTL or blocker taxonomy changes.
failure_policy:
  attempt_all_components: true
  required_component_failure_status: PARTIAL_CAPTURE
  required_component_failure_exit_code: 1
  downstream_consumption_allowed_statuses:
    - CAPTURED
safety:
  production_effect: none
  production_weight_write: false
  active_shadow_weight_write: false
  broker_action: false
  trading_action: false
review_condition: >
  Review when a required source, capture path, XNYS calendar authority, retention
  rule, downstream consumer binding, or safety boundary changes.
rationale: >
  Preserve every independently available daily source before strict downstream
  gates. A partial capture remains non-consumable but prevents one provider or
  data-quality failure from erasing evidence from all other providers. Under
  daily_input_capture_v6, capture-active score-daily consumers must bind the exact
  same-as-of manifest and verified official-policy artifact lineage; they must not
  repeat provider requests after capture has succeeded and must fail closed without
  a live-fetch fallback on missing, tampered, or drifted retained evidence.
