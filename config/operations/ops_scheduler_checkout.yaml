schema_version: ops_scheduler_checkout_policy.v4
policy_id: ops_scheduler_checkout_v4
version: 4.0.0
status: REVIEWED_RECEIPT_GATED_DEPLOYMENT
owner: operations_owner_and_project_owner
reviewed_at: 2026-07-27
rationale: >
  Daily provider capture must run from an owner-accepted exact release in an
  independent Git clone with a runtime-local executable. Release identity comes
  only from the active deployment receipt; a legacy environment SHA is an
  optional exact-match assertion and can never override the receipt. The Codex
  carrier is projectless so a user development checkout cannot block business
  admission; one scheduler entry provides a primary and same-day rescue window.
environment:
  scheduler_marker_name: AITS_EXTERNAL_SCHEDULER
  scheduler_marker_value: "1"
  checkout_root_name: AITS_OPS_CHECKOUT_ROOT
  release_commit_name: AITS_OPS_RELEASE_COMMIT
  development_checkout_root_name: AITS_DEVELOPMENT_CHECKOUT_ROOT
  deployment_receipt_name: AITS_OPS_DEPLOYMENT_RECEIPT
  runtime_python_name: AITS_OPS_PYTHON
  release_identity_authority: active_deployment_receipt
  legacy_release_assertion_mode: exact_match_if_present
repository:
  expected_remote: git@github.com:AI-Trading-Collaboration/AITradingSystem.git
  reviewed_remote_ref: refs/remotes/origin/main
  exact_release_commit_required: true
  clean_checkout_required: true
  independent_from_development_checkout: true
  independent_git_common_dir_required: true
  current_process_must_run_from_ops_checkout: true
trigger:
  unified_external_trigger:
    - aits
    - ops
    - daily-run
  manual_execution_option: --manual-execution
  separate_periodic_scheduler_entries_allowed: false
carrier:
  mode: PROJECTLESS_ISOLATED
  development_project_target_allowed: false
  development_checkout_cwd_allowed: false
  business_runtime_kind: INDEPENDENT_RECEIPT_GATED_CLONE
  post_stage_blocker_must_not_block_daily_trigger: true
invocation_windows:
  schema_version: ops_scheduler_invocation_windows.v1
  local_timezone: Asia/Tokyo
  windows:
    - role: PRIMARY
      hour: 9
      minute: 30
    - role: SAME_DAY_RESCUE
      hour: 17
      minute: 30
  scheduler_entry_count: 1
  per_invocation_business_trigger_max: 1
  same_scheduler_entry_for_all_windows: true
  rescue_is_unconditional_retry: false
  same_as_of_ordinary_allowed: false
gap_visibility:
  schema_version: ops_scheduler_gap_visibility.v1
  statuses:
    - NO_GAP_EVIDENCE
    - GAP_EXPOSURE_PRESENT
    - EXPECTED_AS_OF_NOT_RECORDED
    - INDETERMINATE
  missing_expected_as_of_evidence_means_no_gap: false
  canonical_artifact_identity_required: true
terminal_parent_routing:
  schema_version: ops_scheduler_terminal_disposition_policy.v1
  dispositions:
    - RECOVERABLE_SAME_AS_OF_TAIL
    - WAIT_FOR_NEXT_PROVIDER_READY_AS_OF_ORDINARY
    - READY_FOR_NEW_AS_OF_ORDINARY
    - BLOCKED_EXTERNAL_OR_OWNER
  same_as_of_ordinary_allowed: false
  ordinary_requires_as_of_strictly_after_parent: true
  ordinary_requires_fresh_idempotency_key: true
  ordinary_requires_no_active_lock: true
  nonrecoverable_parent_recovery_allowed: false
  parent_bytes_must_remain_immutable: true
  new_business_scheduler_entry_allowed: false
deployment:
  activation_mode: ACTIVE_OWNER_ACCEPTED_RECEIPT_REQUIRED
  acceptance_schema: ops_deployment_acceptance.v2
  legacy_acceptance_schema: ops_deployment_acceptance.v1
  active_receipt_relative_path: outputs/operations/deployment/active.json
  runtime_python_must_be_below_checkout: true
  imported_package_must_be_below_checkout: true
  scheduler_id: aitradingsystem-pit
  scheduler_entry_count: 1
  scheduler_provider: codex_automation
  windows_task_scheduler_entries_allowed: false
safety:
  production_effect: none
  production_weight_write: false
  active_shadow_weight_write: false
  broker_action: false
  trading_action: false
review_condition: >
  Review when the repository remote/ref, environment contract, checkout or Git
  common-dir identity, executable provenance, release receipt, scheduler trigger,
  terminal-parent disposition, deployment acceptance, credential scope, or safety
  boundary changes.
