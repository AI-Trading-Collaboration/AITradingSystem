schema_version: 1
policy_version: scheduled_tasks_v5
policy_metadata:
  owner: system
  status: active_baseline
  rationale: >
    Keep daily, weekly, biweekly, monthly, and ad hoc operational chains in one
    auditable plan so scheduler changes do not silently omit Reader Brief,
    SEC PIT shadow monitoring, research governance, backtest, parameter, weight,
    documentation, or report registry tasks. TRADING-2443 makes the idempotent
    download-data step attempt budget explicit after a reviewed provider-policy
    correction. OPS-069 adds a capture-first umbrella step that attempts
    market/macro and every other independent daily source before strict consumer
    gates. The umbrella preserves the reviewed two-attempt market/macro budget;
    all other steps retain their existing attempt budgets. OPS-070 adds an
    explicit daily step/component dependency DAG and always-run operator closure
    so a branch failure cannot suppress independent validation evidence.
    Version 5 binds the capture validation artifact to its native versioned
    schema instead of applying the generic report-artifact schema contract.
  intended_effect: >
    Make `aits ops daily-plan` and `aits ops daily-run` enforce the default
    dependency-aware daily trading-day chain while registering non-daily governance chains for
    manual or future scheduler review. Preserve date-scoped market/macro, FMP
    PIT, SEC, valuation, and official-source inputs plus a continuous XNYS gap ledger
    before strict downstream consumption. Permit one bounded rerun of the
    idempotent download-data step without deleting prior state or ledger;
    a second failure under the same workflow spec remains terminal. A missing
    dependency blocks only its consumers while the overall run remains
    non-PASS and always-run health/security closure still executes. A validated
    partial capture is recorded as LIMITED so consumers backed by PASS source
    components may proceed, while missing-component consumers remain blocked.
  validation_evidence: >
    OPS-059 tests cover daily command order, closed-market skips, non-daily task
    registration, and no-production safety invariants for reader/governance/
    shadow monitor tasks. TRADING-2443 tests cover configured step-attempt
    propagation and hard stop after the bounded second download attempt.
    OPS-069 tests cover attempt-all capture, partial retention, checksum tamper,
    XNYS gap visibility, consumer path binding, and no-production boundaries.
    OPS-070 fault-injection tests cover sibling continuation, dependency blocking,
    strict terminal status, runtime-control accounting, always-run closure, and
    the native daily_input_capture_validation.v1 artifact contract.
  review_condition: >
    Review whenever a daily report, governance report, shadow monitor, backtest,
    parameter, documentation, report registry, scheduler command, capture
    component/path, or per-step attempt budget is added or changed.
market_regime:
  default_regime_id: unified_primary_2021
  anchor_event: ChatGPT public launch
  anchor_date: 2022-11-30
  default_backtest_start: 2021-02-22
safety_defaults:
  production_effect: none
  production_weight_write: false
  active_shadow_weight_write: false
  broker_action: false
  trading_action: false
cadences:
  daily_trading_day:
    description: >
      Default production daily chain for completed U.S. equity trading days.
      `daily-plan` lists this order and `daily-run` executes it fail-closed.
    run_by:
      - aits ops daily-plan
      - aits ops daily-run
    tasks:
      - task_id: daily_capture_inputs
        daily_plan_step_id: capture_daily_inputs
        dependencies: []
        title: Capture independently available daily inputs before strict gates
        command: aits ops capture-daily-inputs --as-of {as_of}
        command_contains:
          - aits
          - ops
          - capture-daily-inputs
          - --as-of
        activation_condition: trading_day_only
        closed_market_behavior: skip
        data_quality_gate: "Capture status never authorizes consumption; market/macro download runs inside the umbrella, and any required component failure blocks DQ/PIT/score while successful components remain retained."
        production_effect: local_cache_write
        production_weight_write: false
        active_shadow_weight_write: false
        broker_action: false
        trading_action: false
      - task_id: daily_download_data_closed_market
        daily_plan_step_id: download_data
        dependencies: []
        title: Conditionally refresh market and macro data on closed-market runs
        max_attempts: 2
        command: aits download-data --start {download_start} --end {download_end}
        command_contains:
          - aits
          - download-data
        activation_condition: closed_market_only
        closed_market_behavior: conditional_previous_trading_day_cache
        production_effect: local_cache_write
      - task_id: daily_validate_data
        daily_plan_step_id: validate_data
        dependencies:
          - capture_daily_inputs
          - download_data
        required_capture_components:
          - market_macro
        title: Validate cached market and macro data
        command: aits validate-data --as-of {download_end} --execution-profile daily_default.v1
        command_contains:
          - aits
          - validate-data
        closed_market_behavior: run_with_previous_trading_day
        production_effect: none
      - task_id: daily_official_policy_sources
        daily_plan_step_id: official_policy_sources
        dependencies: []
        title: Fetch official policy and geopolitical sources on closed-market days
        command: aits risk-events fetch-official-sources --as-of {as_of}
        command_contains:
          - risk-events
          - fetch-official-sources
          - --as-of
        activation_condition: closed_market_only
        closed_market_behavior: run
        production_effect: local_cache_write
      - task_id: daily_pit_fetch_fmp_forward_closed_market
