schema_version: risk_tiered_external_action_evidence_admission.v1
policy_id: devx_008_risk_tiered_external_action_evidence_admission_v1
status: REVIEWED_ACTIVE
effective_date: 2026-08-22
owner: project_owner
rationale: >-
  Separate external-action risk permission from empirical evidence validity.
  Technical correctness is established by exact identities, runtime provenance,
  reproducibility, DQ/PIT and independent validation, not by mechanical replay of
  machine-generated hashes by the owner.
principles:
  authorization_and_technical_validity_are_independent_axes: true
  missing_preformatted_token_is_not_a_technical_rejection_reason: true
  historical_exact_token_artifacts_immutable: true
  objective_manifest_replay_required: true
  actual_external_action_counters_required: true
risk_tiers:
  R0_LOCAL_READ_ONLY:
    per_action_owner_confirmation_required: false
    examples:
      - local_read
      - static_analysis
      - offline_validation
      - retained_result_review
  R1_BOUNDED_RESEARCH_SANDBOX:
    preformatted_exact_token_required: false
    standing_owner_scope_allowed: true
    prerequisites:
      - owner_requested_continuation_of_the_research_task
      - reviewed_task_or_manifest_with_exact_target_and_code_identity
      - bounded_action_maxima
      - zero_orders_and_zero_fills
      - automatic_pre_dispatch_manifest_replay
      - post_dispatch_actual_counter_and_terminal_recording
  R2_MATERIAL_EXTERNAL_CHANGE:
    concise_explicit_owner_instruction_required: true
    examples:
      - original_project_write
      - meaningful_paid_resource_use
      - cloud_project_deletion
      - public_share
      - external_message
  R3_PRODUCTION_OR_BROKER:
    separate_exact_scope_authorization_required: true
    examples:
      - paper_or_live_action
      - broker_action
      - order_or_fill
      - capital_or_position_change
      - production_promotion
authorization_states:
  - EXACT_PREAUTHORIZED
  - STANDING_OWNER_SCOPE
  - RETROSPECTIVELY_REVIEWED
  - UNAUTHORIZED_ACTION_INCIDENT
technical_validation_states:
  - PASS
  - FAIL
  - INDETERMINATE
admission:
  authorization_state_recorded_separately: true
  technical_validation_state_recorded_separately: true
  unresolved_scope_or_safety_incident_blocks_downstream_conclusions: true
  non_exact_preauthorization_alone_blocks_technical_admission: false
  required_run_evidence:
    - task_id
    - target_service_and_project
    - exact_repository_commit
    - candidate_lf_byte_count_and_sha256
    - requested_and_evaluated_range
    - provider_and_engine_identity
    - dispatch_and_terminal_timestamp
    - build_or_run_id
    - declared_maxima_and_actual_counters
    - output_schema_and_completeness
    - orders_fills_production_and_broker_effect
current_standing_scopes:
