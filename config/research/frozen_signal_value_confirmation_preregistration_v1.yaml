  package_id: trading_2542i_operational_forecast_real_v3
  package_root: outputs/qqq_options/signal_packages/trading_2542i_operational_forecast_real_v3
  signal_index_sha256: d2af99e55d8f9a69a14d4479eb7ba1fd2aeed323c457ae10705a140c7a62ffda
