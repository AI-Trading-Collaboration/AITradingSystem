  historical_result_can_be_called_pristine_oos: false
  prospective_start_rule: FIRST_XNYS_SESSION_AFTER_FINAL_POLICY_APPROVAL
  prospective_sessions_may_only_confirm_frozen_rules: true
  historical_period_deletion_allowed: false
  post_result_threshold_change_allowed: false
result_admission:
