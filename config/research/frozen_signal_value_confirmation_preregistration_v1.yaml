  target_qqq_weight_formula: LONG_EXPOSURE_RETURN_INTERVAL_COUNT_DIVIDED_BY_1201
  formula_inputs_available_before_price_outcomes: true
  allocation_rule: BUY_ONCE_AT_FIRST_EVALUABLE_CLOSE_HOLD_CONSTANT_SHARES_LIQUIDATE_AT_FINAL_CLOSE
  residual_asset: ZERO_RETURN_CASH
  outcome_dependent_fit_allowed: false
  post_result_comparator_addition_allowed: false
diagnostics:
  - diagnostic_id: QQQ_BUY_AND_HOLD
    verdict_role: CONTEXT_ONLY
  - diagnostic_id: CALENDAR_YEAR_AND_PRE_2023_POST_2022_SLICES
    verdict_role: CONCENTRATION_DISCLOSURE_ONLY
accounting_and_clock:
  initial_capital_usd: 100000
  price_field: ADJUSTED_CLOSE
  return_clock: EFFECTIVE_SESSION_CLOSE_TO_NEXT_XNYS_SESSION_CLOSE
  signal_lag_sessions: 1
  effective_session_rule: NEXT_VALID_US_EQUITY_SESSION
  candidate_rebalances_only_on_target_change: true
  comparator_rebalances_after_initial_allocation: false
  terminal_liquidation_required: true
  fractional_shares_allowed: true
  negative_cash_allowed: false
  missing_price_imputation_allowed: false
  fill_forward_allowed: false
cost_model:
  model_id: FIXED_TRADED_NOTIONAL_BPS
  one_way_cost_bps: 5.0
  applies_to: [INITIAL_ALLOCATION, TARGET_CHANGE, TERMINAL_LIQUIDATION]
  same_formula_for_candidate_and_comparator: true
  financing_cost: ZERO_BECAUSE_BORROWING_PROHIBITED
  idle_cash_return: 0.0
primary_metric:
  metric_id: NET_TOTAL_RETURN_DIFFERENCE_PERCENTAGE_POINTS
  formula: CANDIDATE_NET_TOTAL_RETURN_MINUS_COMPARATOR_NET_TOTAL_RETURN
  retain_threshold_strictly_greater_than: 0.0
  missing_value_status: INSUFFICIENT
falsification_guard:
  guard_id: MAX_DRAWDOWN_MAGNITUDE_NON_REGRESSION
  formula: CANDIDATE_MAX_DRAWDOWN_MAGNITUDE_MINUS_COMPARATOR_MAX_DRAWDOWN_MAGNITUDE
  retain_threshold_less_than_or_equal_to: 0.0
  missing_value_status: INSUFFICIENT
verdict_reducer:
  precedence: [INSUFFICIENT, REJECT, RETAIN]
  insufficient_if_any:
    - POLICY_OR_AUTHORITY_IDENTITY_MISMATCH
    - SIGNAL_PACKAGE_OR_INDEX_IDENTITY_MISMATCH
    - MANIFEST_REPLAY_NOT_PASS
    - CANONICAL_DQ_PIT_NOT_PASS
    - REQUESTED_OR_EVALUATED_RANGE_MISMATCH
    - SIGNAL_SESSION_COUNT_NOT_1202
    - RETURN_INTERVAL_COUNT_NOT_1201
    - MISSING_DUPLICATE_UNKNOWN_OR_IMPUTED_INPUT
    - ACCOUNTING_OR_COST_RECONCILIATION_NOT_PASS
    - PRIMARY_METRIC_OR_DRAWDOWN_GUARD_MISSING
    - INDEPENDENT_REPLAY_NOT_PASS
  retain_if_all:
    - PRIMARY_METRIC_STRICTLY_GREATER_THAN_ZERO
    - MAX_DRAWDOWN_MAGNITUDE_DELTA_LESS_THAN_OR_EQUAL_TO_ZERO
  reject_if_any:
    - PRIMARY_METRIC_LESS_THAN_OR_EQUAL_TO_ZERO
    - MAX_DRAWDOWN_MAGNITUDE_DELTA_GREATER_THAN_ZERO
  stop_actions:
    RETAIN: OPEN_OWNER_REVIEW_FOR_CONDITIONAL_OPTIONS_PAIRED_COMPARISON
    REJECT: CLOSE_OPTIONS_IMPLEMENTATION_P0_ROUTE_NO_PARAMETER_RESCUE
    INSUFFICIENT: COLLECT_ONLY_EXPLICITLY_IDENTIFIED_PROSPECTIVE_EVIDENCE
evidence_role_boundary:
