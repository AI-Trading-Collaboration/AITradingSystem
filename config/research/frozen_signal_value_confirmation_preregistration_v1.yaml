  evaluated_start: '2021-02-22'
  evaluated_end: '2025-12-02'
  expected_signal_sessions: 1202
  expected_return_intervals: 1201
  allowed_states: [constructive, defensive, neutral, risk_off, risk_on]
  expected_actions: [FLAT, LONG_CALL]
candidate_implementation:
  implementation_id: FROZEN_SIGNAL_FULLY_FUNDED_QQQ_ZERO_RETURN_CASH
  state_to_target_qqq_weight:
