owner_decision: owner_decision:TRADING-2490:2026-08-03:build_offline_reconciliation_mechanics_without_unreviewed_platform_mapping_or_tolerance
rationale: Freeze deterministic export-safe QuantConnect ingest and cross-layer reconciliation mechanics while real export mappings, timestamp parsing, rounding and numeric tolerances remain fail closed pending Owner-reviewed platform evidence.
intended_effect: Identical canonical predecessor artifacts and a strictly validated manual evidence bundle produce identical typed reconciliation results without reconstructing raw option rows, activating blocked research policy, or allowing external PASS to override internal failure.
validation_plan: Run policy drift, strict loader invocation, canonical replay, lineage, order, fill, cash, lifecycle, taxonomy, tolerance, permutation, property, golden and predecessor-binding tests before governed final-tree validation.
review_condition: Review before ingesting real QuantConnect exports, accepting any numeric difference, or using a reconciliation result for pilot range expansion.
expiry_condition: Supersede only through an Owner-reviewed tracked policy change with real export samples, mapping and tolerance evidence, review or expiry condition, compatibility coverage and final-tree validation.
