policy_metadata:
  owner: project_owner_and_strategy_research_governance
  rationale: >-
    在任何新 DQ 或 strategy result 可见前，把每轴推荐来源转换为一份完整、可逐项审阅的
    exact value sheet；建议值表达预先声明的经济实质和稳定性要求，不从当前 hypothesis
    结果、holdout 或测试 fixture 反推。
  intended_effect: >-
    让 Project Owner 能一次审阅全部 numeric、categorical、set 和 policy-reference 字段，
    同时阻止草案值在逐项批准前进入 frozen policy、DQ successor 或 empirical evaluation。
  validation_evidence: >-
    要求 strict YAML、decision-pack exact identity、八轴完整性、推荐来源一致性、单位和范围校验、
    canonical JSON seal/replay、duplicate-key rejection、tamper negative tests 与安全边界断言。
  review_condition: >-
    V1 只允许一次 2021-02-22..2025-12-02 primary-window evaluation；任一值、单位、口径、
    slice、DQ policy 或 attribution rule 的修改都必须创建新版本并重新取得 Owner 批准。
