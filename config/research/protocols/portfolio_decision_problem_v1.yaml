schema_version: "1.0"
research_id: portfolio_decision_problem_v1
title: Portfolio Decision Problem v1 Protocol
owner: research_governance
status: baseline_protocol
market_regime:
  regime_id: unified_primary_2021
  requested_date_range: "2021-02-22..present"
  anchor_event: "validated QQQ/SGOV/TQQQ common history start"
problem_statement: >
  Compare candidate portfolio actions by horizon-conditioned expected utility
  using only PIT state, current portfolio, cost, risk constraints, and auditable
  future outcomes marked evaluation-only.
hypotheses:
  - hypothesis_id: horizon_conditioned_action_value_surface
    statement: Horizon-conditioned value surfaces can outperform fixed-window baselines.
    falsification: Fixed-window baselines dominate or negative controls pass.
evidence_requirements:
  - evidence_class: E3
    minimum_role: full_advisory_pit_replay_action_outcome_rows
    required_for_promotion: true
  - evidence_class: E4
    minimum_role: forward_paper_shadow_cohort_review
    required_for_promotion: true
benchmark_requirements:
  - cash
  - buy_and_hold
  - static_allocation
  - simple_trend_following
  - SPY_broad_market_beta_reference
universe_roles:
  reference_and_regime_control:
    - SPY
    - QQQ
  current_primary_action_comparator:
    - SGOV
    - QQQ
    - TQQQ
  role_limited_implementation_instruments:
    - QLD
  qld_role_decision_id: owner_decision:TRADING-2459:2026-07-25:approve_qld_role_limited_2x_implementation_instrument
  qld_direct_action_candidate_eligible: false
  qld_conditional_execution_implementation_eligible: true
  qld_signal_input_eligible: false
  qld_required_upstream_conditions:
    - independent_trend_model_marks_trusted_nasdaq_uptrend
    - portfolio_target_qqq_equivalent_exposure_is_near_2x
    - risk_gate_passes
  qld_automatic_instrument_selection_allowed: false
control_requirements:
  - asset_shuffled_indicator
  - random_signal
  - future_leakage_trap
threshold_dependencies:
  - portfolio_decision.utility_profile_version
promotion_policy:
  policy_ref: research_governance_policy_v1
  human_review_required: true
  bridge_only_promotion_allowed: false
outputs:
  - portfolio_decision_contract
  - pit_action_outcome_dataset
  - strategy_evaluation
  - value_surface_report
safety_boundary:
  validation_only: true
  production_effect: none
  paper_shadow_change_allowed: false
  official_target_weights_allowed: false
  broker_action_allowed: false
  spy_reference_role_changes_action_space: false
  qld_action_universe_change_allowed: false
  qld_primary_action_universe_change_allowed: false
  qld_role_limited_2x_implementation_consideration_allowed: true
  qld_signal_use_allowed: false
  qld_automatic_exposure_increase_allowed: false
