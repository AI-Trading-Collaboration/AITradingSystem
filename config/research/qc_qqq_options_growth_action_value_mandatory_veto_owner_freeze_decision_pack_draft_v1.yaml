        - OPTION_CONTRACT_OR_ACTIVITY
        - RESULT_DERIVED_VALUE
    formula_decision:
      formula_category: BROAD_MARKET_TREND_OR_DRAWDOWN_STATE
      exact_formula: veto = (SPY.adjusted_close < SMA(SPY.adjusted_close, 200 sessions)) OR (SPY.adjusted_close / rolling_max(SPY.adjusted_close, 63 sessions) - 1 <= -0.10)
      window_inventory:
        moving_average_sessions: 200
        drawdown_sessions: 63
      threshold_inventory:
        drawdown_fraction_lte: -0.10
      combination_rule: OR
      entry_confirmation_sessions: 1
      recovery_rule: CLEAR_WHEN_BOTH_COMPONENTS_FALSE
      rationale: Preserves the existing SPY 200-session and 63-session/-10% compatibility anchors while removing QQQ, growth_allowed and option-result dependencies.
    timing_decision:
      decision_as_of: TARGET_QQQ_SESSION_OFFICIAL_CLOSE
      available_at: AFTER_BOUND_SPY_SESSION_CLOSE_AND_DQ_PASS
      effective_session: NEXT_VALID_QQQ_EXCHANGE_SESSION
