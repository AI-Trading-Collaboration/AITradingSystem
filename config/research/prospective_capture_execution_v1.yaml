schema_version: prospective_capture_execution_policy.v1
policy_id: prospective_capture_execution_v1
policy_version: 1.0.0
status: REVIEWED_ENGINEERING_CONTRACT_REAL_SCOPE_REVIEW_REQUIRED
owner: Project Owner / integration-coordinator
requirement_ref: docs/requirements/TRADING-2564_S3b_Prospective_Capture_Execution_V1.md
rationale: >-
  五候选的真实前瞻记录需要将完整源码身份、指定快照的严格 DQ、同进程预览、
  完整输入保存及 witness 写后确认接为一条可重验的执行链。
intended_effect: >-
  单个 bounded manifest 只允许一个 activation 及每个显式 feature session 一次 attempt。
  真实范围另由 owner review 精确绑定；工程验证不签发真实运行或结果访问权限。
validation_plan: >-
  actual fresh-bootstrap 合成链及 profile/lease/DQ/闭包/时钟/崩溃/幂等负例，
  16-worker 聚焦验证、exact final candidate 正式验证和 Full。
review_condition: >-
  首次真实启用前复核 source roots、exact code、时间语义、host trust 与 bounded manifest；
  改变消费者、收益时钟、执行次数、来源角色或结果访问需要新的受审合同。
profile:
  consumer_family: FIVE_CANDIDATE
  source_manifest_path: config/data_governance/named_prospective_five_candidate_sources_v1.json
