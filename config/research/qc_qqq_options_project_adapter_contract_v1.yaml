schema_version: qc_qqq_options_project_adapter_policy.v1
policy_id: qc_qqq_options_project_adapter_contract_v1
policy_version: 1.0.0
status: REVIEWED_OFFLINE_CONTRACT_BASELINE
owner: project_owner_and_external_platform_engineering
owner_instruction: owner_instruction:2026-08-02:proceed_with_offline_qqq_options_engineering
rationale: Freeze a content-bound QuantConnect project adapter descriptor without claiming that a signal package has entered a cloud project or that a cloud run is authorized.
intended_effect: Downstream selection and execution modules can consume one deterministic QQQ subscription, engine-identity, project-file, and result-mapping boundary while external platform facts remain blocked on real evidence.
validation_plan: Strictly replay the signal package and capability receipt, exercise inventory/hash/range/policy/code tamper negatives, enforce the 32KB descriptor limit, and run governed focused and formal validation.
review_condition: Review before changing any predecessor hash, subscription, project-file transport, engine identity, evidence mapping, export classification, external authorization, cloud-run, production, or broker boundary.
expiry_condition: Supersede only through an owner-reviewed versioned contract with downstream compatibility evidence.
