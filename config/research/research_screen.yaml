# Settings of the research bench's S4 layer (TRADING-2565 S4). Zone C: kept apart from
# research_bench.yaml so the settings every question was opened with stay byte for byte the same.
# Values approved by the owner (owner_decision:TRADING-2565:2026-10-13:signal_screen_layer).
schema_version: research_screen.v1
# De-risk events (S4c): a day is de-risked when the exposure held is at most derisk_ratio times the
# strategy's average exposure in the window (the matched benchmark's constant exposure).
derisk_events:
  derisk_ratio: 0.75
  merge_gap_days: 5          # two runs of de-risked days with fewer than this many other days between them form one event
  protective_loss: -0.05     # QQQ's compounded return over the event at or below this: protective
  false_alarm_gain: 0.05     # at or above this: false alarm; otherwise neutral
  short_event_days: 21       # events shorter than this are counted again as short (whipsaws)
# Signal sources (S4a). known_lag_trading_days: a value dated t counts as known at the close this
# many trading days later. FRED daily series are published the next business day; Ken French daily
# returns are the market's own returns of day t.
sources:
  - source_id: baa10y
    provider: fred
    dataset: BAA10Y
    frequency: daily
    known_lag_trading_days: 1
    description: Moody's seasoned Baa corporate bond yield minus the 10-year Treasury yield (credit spread)
  - source_id: t10y3m
    provider: fred
    dataset: T10Y3M
    frequency: daily
    known_lag_trading_days: 1
    description: 10-year minus 3-month Treasury yield (term spread)
  - source_id: ff_factors_daily
    provider: ken_french
    dataset: F-F_Research_Data_Factors_daily
    frequency: daily
    known_lag_trading_days: 0
    description: Ken French US market excess return and risk-free rate, daily from 1926-07
  - source_id: ff_49_industries_daily
    provider: ken_french
    dataset: 49_Industry_Portfolios_daily
    frequency: daily
    known_lag_trading_days: 0
    description: Ken French 49 industry portfolios, value weighted, daily from 1926-07
  # Research loop period 1 whitelist (owner_decision:TRADING-2565:2026-10-15:research_loop_p1): free
  # FRED daily market series, known one trading day later like the FRED series above.
  - source_id: vixcls
    provider: fred
    dataset: VIXCLS
    frequency: daily
    known_lag_trading_days: 1
    description: CBOE S&P 500 implied volatility index VIX, daily close
  - source_id: vxncls
    provider: fred
    dataset: VXNCLS
    frequency: daily
    known_lag_trading_days: 1
    description: CBOE Nasdaq-100 implied volatility index VXN, daily close
  - source_id: dgs10
    provider: fred
    dataset: DGS10
    frequency: daily
    known_lag_trading_days: 1
    description: 10-year Treasury constant maturity yield
  - source_id: dtb3
    provider: fred
    dataset: DTB3
    frequency: daily
    known_lag_trading_days: 1
    description: 3-month Treasury bill secondary market rate
  # Monthly long history (owner_decision:TRADING-2565:2026-10-21:monthly_long_history, TRADING-2565-37):
  # free, no API key. Month M is published on the first day of month M + 1 + release_lag_months and
  # used known_lag_trading_days trading days later. FRED dates a monthly average at the start of its
  # month; five trading days cover the weekly release after the month ends (inferred). Shiller's
  # dividends, earnings, CPI and long rate are interpolated from annual or quarterly figures in early
  # years (inferred), so a value is used fifteen months after its month: January's value from an
  # annual figure is known only when the year's report is out, about fourteen months later.
  - source_id: baa_monthly
    provider: fred
    dataset: BAA
    frequency: monthly
    release_lag_months: 0
    known_lag_trading_days: 5
    description: Moody's seasoned Baa corporate bond yield, monthly average, from 1919
  - source_id: aaa_monthly
    provider: fred
    dataset: AAA
    frequency: monthly
    release_lag_months: 0
    known_lag_trading_days: 5
    description: Moody's seasoned Aaa corporate bond yield, monthly average, from 1919
  - source_id: shiller_price
    provider: shiller
    dataset: P
    frequency: monthly
    release_lag_months: 0
    known_lag_trading_days: 0
    description: Shiller S&P composite price, monthly average of daily closes, from 1871
  - source_id: shiller_dividend
    provider: shiller
    dataset: D
    frequency: monthly
    release_lag_months: 15
    known_lag_trading_days: 0
    description: Shiller S&P composite dividends per share, twelve-month total, from 1871
  - source_id: shiller_earnings
    provider: shiller
    dataset: E
    frequency: monthly
    release_lag_months: 15
    known_lag_trading_days: 0
    description: Shiller S&P composite earnings per share, twelve-month total, from 1871
  - source_id: shiller_cpi
    provider: shiller
    dataset: CPI
    frequency: monthly
    release_lag_months: 15
    known_lag_trading_days: 0
    description: Shiller consumer price index, from 1871
  - source_id: shiller_gs10
    provider: shiller
    dataset: GS10
    frequency: monthly
    release_lag_months: 15
    known_lag_trading_days: 0
    description: Shiller long-term interest rate (GS10, earlier government bond yields), from 1871
  # Unemployment rates, long history (owner_decision:TRADING-2565:2026-10-29:print_only_tables,
  # TRADING-2565-88): free FRED monthly series, seasonally adjusted percent of the labour force,
  # with the lags of baa_monthly. NBER Macrohistory m08292a covers 1929-04 to 1942-06 and m08292b
  # 1940-01 to 1946-12; both were reconstructed later, so what was known then is assumed. 1947 has
  # only the not seasonally adjusted m08292c, which is not taken; BLS UNRATE starts 1948-01.
  - source_id: unrate_nber_a
    provider: fred
    dataset: M0892AUSM156SNBR
    frequency: monthly
    release_lag_months: 0
    known_lag_trading_days: 5
    description: Unemployment rate, seasonally adjusted (NBER m08292a), 1929-04 to 1942-06
  - source_id: unrate_nber_b
    provider: fred
    dataset: M0892BUSM156SNBR
    frequency: monthly
    release_lag_months: 0
    known_lag_trading_days: 5
    description: Unemployment rate, seasonally adjusted (NBER m08292b, Census), 1940-01 to 1946-12
  - source_id: unrate
    provider: fred
    dataset: UNRATE
    frequency: monthly
    release_lag_months: 0
    known_lag_trading_days: 5
    description: Civilian unemployment rate, seasonally adjusted (BLS), from 1948-01
# Signal screening (S4b). Every market is cut at screen_end: the US market and the industries move
# with QQQ after 2010, so reading them later would read QQQ's validation window. The screen has no
# option to read past screen_end; moving it needs a change to this zone C file.
screen:
  screen_end: "2010-12-31"
  qqq_series: actual               # QQQ market: the bench's ndx_return over the actual QQQ series
  qqq_eval_start: "1999-03-10"      # QQQ development window
  long_eval_start: "1927-07-01"     # Ken French markets: one year after the data starts, for lookbacks
  horizons: [21, 63, 126]           # forward horizons in trading days
  groups: 5                         # expanding-quantile groups
  warmup_days: 252                  # first valid signal values that are not grouped
  min_days: 252                     # fewer evaluation days than this: no statistics for the horizon
  drawdown_threshold: -0.10         # group table: share of days whose next h days draw down this far
  bootstrap_markets: [qqq, us_market]
  bootstrap_draws: 2000             # stationary block bootstrap, mean block = horizon
  confidence: 0.95
  seed: 20261013
  lookahead_cut_dates: 20
  # Verdict rules, approved before any screen ran.
  bh_q: 0.10                        # Benjamini-Hochberg over the whole screened family
  primary_market: us_market
  primary_horizon: 21
  candidate_breadth: 0.666667       # compared with a 1e-6 tolerance, so 2 of 3 markets counts
  eliminate_breadth: 0.5
  copy_corr: 0.9                    # |rank correlation| with a baseline signal at or above this
production_effect: none
broker_action: none
