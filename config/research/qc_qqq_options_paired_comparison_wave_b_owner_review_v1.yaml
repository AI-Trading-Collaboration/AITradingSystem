recommended_owner_decision:
  decision_id: SAME_RUN_QQQ_SECURITY_FEE_MODEL_NON_SUBMITTED_PROBE
  rationale:
    - Preserve the frozen fully-funded QQQ/cash estimand without silently assuming zero fees.
    - Reuse the exact QQQ Security fee model and exact LEAN build already bound by the future run manifest.
    - Avoid duplicating a provider formula that can drift from the platform implementation.
    - Keep the comparator virtual; no QQQ order is submitted and no QQQ fill or position is created.
  fee_semantics:
    source: QQQ_SECURITY_FEE_MODEL_GET_ORDER_FEE
    expected_fee_model_type: InteractiveBrokersFeeModel
    brokerage_model: DefaultBrokerageModel
    account_type: CASH
    exact_lean_build_identity_required: true
    fee_probe_order_type: MarketOrder
    fee_probe_order_is_local_object_only: true
    fee_probe_submitted_to_transactions: false
    fee_probe_order_ticket_created: false
    fee_probe_fill_created: false
    fee_probe_position_created: false
    fee_currency: USD
    fee_must_be_finite: true
    fee_must_be_nonnegative: true
  entry_quantity_rule:
    description: >-
      At the same legal event, choose the greatest integer q greater than or equal to zero
      for which q * current_qqq_ask + same_run_buy_fee(q) is less than or equal to current cash.
    initial_upper_bound: FLOOR_CURRENT_CASH_DIVIDED_BY_CURRENT_QQQ_ASK
    solver: MONOTONE_DESCENDING_UNTIL_AFFORDABLE
    zero_share_treatment: RETAIN_CASH_AND_RECORD_ZERO_DEPLOYMENT
    cash_update: CASH_MINUS_Q_TIMES_ASK_MINUS_BUY_FEE
  exit_rule:
    description: >-
      At the same legal event, value the full virtual share inventory at current QQQ bid,
      compute the same-run sell fee for the negative hypothetical quantity, then add
      q * bid - sell_fee to cash and set virtual shares to zero.
    partial_exit_allowed: false
    cash_update: CASH_PLUS_Q_TIMES_BID_MINUS_SELL_FEE
  spread_and_slippage:
    spread_charged_by_quote_sides: true
    additional_underlying_slippage_usd: '0.00'
    additional_underlying_slippage_model_allowed: false
  accounting:
    fee_accrual_field: UNDERLYING_FEES_USD
    spread_slippage_field: UNDERLYING_SPREAD_SLIPPAGE_COST_USD
    negative_cash_tolerance_usd: '0.00'
    fee_or_cash_rounding_override_allowed: false

