review_condition: Review before activating accounting, choosing initial capital or budget, consuming real execution results, or using any portfolio snapshot in an investment-facing backtest.
expiry_condition: Supersede only through an Owner-reviewed tracked policy change with calibration evidence, settlement and rounding authority, review or expiry condition, compatibility coverage and final-tree validation.
