status: REVIEWED_BASELINE_FAIL_CLOSED
owner: project_owner_and_data_governance
owner_decision: owner_decision:TRADING-2482:2026-08-02:freeze_fail_closed_dq_pit_cache_evidence_identity_without_unreviewed_thresholds
rationale: Freeze deterministic option-event DQ, PIT, cache, engine, and evidence identity checks before signal export, selection, execution, or cloud backtests.
intended_effect: Unknown, missing, stale, chronologically invalid, or identity-drifted evidence cannot be interpreted as research-ready PASS.
validation_plan: Run negative, PIT, canonical replay, tamper, and property tests, followed by governed Architecture, Contract, Integration, Reproducibility, and exclusive Full validation.
review_condition: Review before adding a provider adapter, numeric freshness or spread threshold, contract selection, fill model, or externally collected QuantConnect evidence.
expiry_condition: Supersede only through an owner-reviewed serial contract wave with compatibility and migration evidence.
