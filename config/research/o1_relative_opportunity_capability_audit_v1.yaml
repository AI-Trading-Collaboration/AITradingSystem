schema_version: o1_relative_opportunity_capability_audit_policy.v1
policy_id: TRADING_2464_O1_CAPABILITY_AUDIT_V1
version: 1.0.0
status: OWNER_APPROVED_SERIAL_CONTRACT_FROZEN_DATA_GATES_PENDING
owner: project_owner_and_strategy_research_owner
owner_decision: owner_decision:TRADING-2464:2026-07-30:approve_o1_m1_ridge_cross_asset_state_single_family_v1
task_id: TRADING-2464_O1_RELATIVE_OPPORTUNITY_SPREAD_CAPABILITY_AUDIT
rationale: >-
  Freeze one exact historical-seen-only O1 capability attempt before any new
  eligibility count or result is read. Reusing the already reviewed deterministic
  M1 ridge and cumulative CROSS_ASSET_STATE prefix minimizes researcher degrees of
  freedom after the known TRADING-2461 negative evidence.
intended_effect: >-
  Permit synthetic builder/validator development and, only after exact isolated
  strict DQ closure, one coverage-only gate followed by at most one canonical
  capability run. This policy cannot authorize investment action or production.
review_condition: >-
  Re-review before changing target, horizon, source or publication identity,
  split, purge, embargo, coverage floor, regime/event definition, model, feature,
  preprocessing, seed, metric, falsification rule or classification mapping.

