    sha256: 0ac453d0952b9003844278db6412b60db6c6231500edd05ce746e5861fc0a0d8
    status: OWNER_REVIEW_REQUIRED_NOT_ACTIVE
  target_policy:
    policy_id: TRADING_2463_O1_S4_PILOT_V1
    path: docs/requirements/TRADING-2463_S4_O1_Relative_Opportunity_Spread_Preregistration_Freeze.md
    sha256: 3f44a9e0c404661e9abeed20c8141884794f440cc4822beaa2f0a155bd719766
  historical_model_policy:
    policy_id: decision_target_capability_audit_model_ladder_v1
    path: config/research/decision_target_capability_audit_model_ladder_v1.yaml
    sha256: 9b84ac832cced4823367c75e2670e22652c7dbeba8dd0aa5bbc30942287b9b19

execution_binding:
  contract_integration_commit_required_before_real_data_access: true
  exact_execution_commit_recorded_in_run_manifest: true
  exact_execution_commit_must_descend_from_contract_freeze_source_base: true
  exact_policy_path_and_sha_recorded_in_run_manifest: true
  historical_seen_only: true
  prospective_accessed: false
  real_coverage_read_allowed_now: false
  model_training_allowed_now: false
  maximum_canonical_runs: 1
  random_seed: 2464
  random_seed_rationale: >-
    Stable task-derived seed selected before result access; changing it creates a
    new empirical attempt and requires a policy version.
  software_identity_required:
    - python_version
    - package_lock_sha256
    - source_commit_sha
    - cli_argv

synthetic_validation_contract:
  schema_version: o1_relative_opportunity_synthetic_validation.v1
  allowed_data_role: SYNTHETIC_FIXTURE_ONLY
  deterministic_double_build_required: true
  independent_formula_reconstruction_required: true
  negative_input_validation_required: true
  real_data_access_allowed: false
  coverage_classification_allowed: false
  model_training_allowed: false

target_contract:
  target_id: RELATIVE_OPPORTUNITY_SPREAD
  form: CONTINUOUS
  label: QQQ_FORWARD_TOTAL_RETURN - SGOV_FORWARD_TOTAL_RETURN
  unit: decimal_total_return_spread
  primary_horizon_common_sessions: 5
  sensitivity_horizons: []
  decision_cutoff: common_session_close_publication_complete
  label_interval_start: next_common_session
  label_interval_end: fifth_common_session
  label_available_on: fifth_common_session
  source_assets: [QQQ, SGOV]
  reference_only_assets: [SPY]
  qld_allowed: false
  tqqq_allowed: false

