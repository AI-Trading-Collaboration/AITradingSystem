split_contract:
  split_id: expanding_purged_walk_forward_o1_504_126_v1
  initial_train_raw_rows: 504
  outer_test_raw_rows: 126
  final_partial_raw_row_floor: 63
  include_final_partial_fold: true
  embargo_common_sessions: 5
  label_maturity_required: true
  purge_label_test_overlap_required: true
  purge_label_embargo_overlap_required: true
  train_transform_fit_scope: train_only

coverage_contract:
  minimum_completed_outer_folds: 5
  minimum_train_effective_sample_per_fold: 100
  minimum_test_effective_sample_per_full_fold: 24
  minimum_test_effective_sample_final_partial_fold: 12
  minimum_total_oof_effective_sample: 120
  non_overlap_equivalent_formula: floor(eligible_rows / 5)
  autocorrelation_ess:
    formula: n / max(1, 1 + 2 * sum(max(rho_lag, 0), lag=1..5))
    lag_count: 5
    clamp_to: [1, n]
  effective_sample_formula: min(non_overlap_equivalent, autocorrelation_ess)
  mandatory_regime_cell_effective_sample: 15
  mandatory_regime_cell_fold_count: 3
  mandatory_event_family_episode_count: 3
  mandatory_event_family_fold_count: 2
  failure_class: INSUFFICIENT_COVERAGE_OR_DQ

regime_contract:
  status: OWNER_APPROVED_TEMPORARY_PILOT_BASELINE
  rationale: >-
    Train-only tertiles create deterministic fold-local trend, volatility and
    drawdown cells without full-sample thresholds or result-driven cut points.
    Regime diagnostics cannot replace the primary capability gate.
  quantiles: [0.3333333333333333, 0.6666666666666666]
  fit_scope: fold_train_only
  axes:
    trend:
      feature_id: qqq_return_60
      bins: [LOW, MIDDLE, HIGH]
    volatility:
      feature_id: qqq_volatility_60
      bins: [LOW, MIDDLE, HIGH]
    current_drawdown:
      feature_id: qqq_drawdown_120
      bins: [LOW, MIDDLE, HIGH]

event_contract:
  status: FROZEN_PRIMARY_SOURCE_LEDGER_REQUIRED_BEFORE_COVERAGE
  design_authority_path: config/research/event_calendar_feasibility_policy.yaml
  design_authority_sha256: ad2f562575f182678b352ea258bcb3d5f210e754e43f949c0681c39f26552d4e
  mandatory_event_families: [FOMC, CPI, NFP]
  event_window_common_sessions: [-1, 1]
  exact_event_ledger_required_before_real_coverage_read: true
  exact_event_ledger_fields:
    - event_id
    - event_family
    - event_timestamp
    - source_published_time
    - known_at
    - available_at
    - provider_name
    - endpoint_or_file
    - request_parameters
    - download_timestamp
    - checksum
  current_view_or_reconstructed_unknown_known_at_allowed: false

model_feature_contract:
  option_id: ADOPT_M1_RIDGE_CROSS_ASSET_STATE_EXACT_REUSE
  model_id: M1_RIDGE_LINEAR
  model_kind: ridge
  ridge_penalty: 1.0
  fit_intercept_as_train_target_mean: true
  preprocessing: fold_train_only_zscore
  standardization_zero_scale_epsilon: 1.0e-12
  interaction_terms_allowed: false
  automatic_hyperparameter_search_allowed: false
  feature_subset_selection_allowed: false
  family_prefix: CROSS_ASSET_STATE
  family_prefix_is_cumulative: true
  feature_ids:
    - qqq_return_5
    - qqq_return_20
    - qqq_return_60
    - spy_return_5
    - spy_return_20
    - spy_return_60
    - sgov_return_20
    - sgov_return_60
    - qqq_spy_relative_5
    - qqq_spy_relative_20
    - qqq_spy_relative_60
    - qqq_sgov_relative_20
    - qqq_sgov_relative_60
    - spy_sgov_relative_20
    - spy_sgov_relative_60
    - qqq_volatility_20
    - qqq_volatility_60
    - spy_volatility_20
    - spy_volatility_60
    - qqq_drawdown_60
    - qqq_drawdown_120
    - spy_drawdown_60
    - spy_drawdown_120
    - qqq_spy_volatility_gap_20
    - qqq_spy_volatility_gap_60
    - qqq_spy_drawdown_gap_120
    - qqq_sgov_return_gap_60
    - spy_sgov_return_gap_60

metric_contract:
  simple_baseline: fold_train_only_unconditional_target_mean
  primary_metric: OOF_MSE_SKILL
  formula: 1 - OOF_MSE_MODEL / OOF_MSE_TRAIN_MEAN_BASELINE
  point_estimate_floor: 0.02
  moving_block_bootstrap_sessions: 5
  moving_block_bootstrap_replications: 10000
  bootstrap_seed: 2464
  one_sided_confidence_level: 0.95
  lower_bound_strictly_positive: true
  minimum_positive_completed_folds: 4
  worst_completed_fold_skill_floor: -0.10
  spearman_lower_bound_strictly_positive: true
  supporting_metrics:
    - spearman_rank_correlation
    - directional_accuracy
    - quintile_spread
    - tail_association

falsification_contract:
  all_axes_mandatory: true
  unevaluable_axis_class: INSUFFICIENT_ROBUSTNESS_EVIDENCE
  axes:
    exact_reconstruction:
      pass_rule: zero_mismatch_and_independent_validator_zero_errors
    feature_timing_lag:
      lag_common_sessions: 1
      pass_rule: lagged_oof_mse_skill_point_estimate_nonnegative
    purge_embargo_stress:
      embargo_common_sessions: 10
      pass_rule: stressed_oof_mse_skill_point_estimate_nonnegative
    fold_jackknife_influence:
      pass_rule: every_leave_one_fold_out_oof_mse_skill_point_estimate_positive
    regime_concentration:
      pass_rule: every_mandatory_cell_coverage_pass_and_no_single_cell_supplies_over_half_positive_loss_reduction
      maximum_single_cell_positive_loss_reduction_share: 0.50
    event_concentration:
      pass_rule: every_family_coverage_pass_and_no_single_episode_supplies_over_half_positive_loss_reduction
      maximum_single_episode_positive_loss_reduction_share: 0.50
    autocorrelation_preserving_placebo:
      method: circular_moving_block_target_permutation
      block_sessions: 5
      replications: 1000
      seed: 2464
      maximum_one_sided_empirical_p_value: 0.05
    target_boundary_perturbation:
      shifts_common_sessions: [-1, 1]
      pass_rule: both_perturbed_skill_point_estimates_nonnegative
    simple_baseline_increment:
      pass_rule: primary_oof_mse_skill_gate_pass
    multiple_testing:
      pass_rule: exact_attempt_ledger_complete_and_no_post_result_family_change
    dq_lineage_closure:
      pass_rule: exact_candidate_receipt_publication_policy_and_source_hashes_reconstruct

attempt_ledger_contract:
  schema_version: o1_relative_opportunity_attempt_ledger.v1
  append_only: true
  exact_path_recorded_before_real_coverage_read: true
  current_attempt_family_id: O1_M1_RIDGE_CROSS_ASSET_STATE_V1
  historical_contamination:
    task_id: TRADING-2461_DECISION_TARGET_CAPABILITY_AUDIT_MODEL_LADDER
    family_known: true
    o1_results_known: true
    independent_novel_family_claim_allowed: false
  prohibited_same_attempt_additions:
    - M2_RIDGE_INTERACTION
    - feature_subset_selection
    - tree_or_boosting
    - neural_network
    - ensemble
    - automatic_search
    - result_driven_transform

classification_contract:
  allowed_classes:
    - MEASURABLE_RELATIVE_OPPORTUNITY_SKILL
    - NO_MEASURABLE_SKILL
    - INSUFFICIENT_COVERAGE_OR_DQ
    - INSUFFICIENT_ROBUSTNESS_EVIDENCE
  invalid_audit_conditions:
    - leakage
    - attempt_contamination
    - lineage_tamper
    - exact_reconstruction_mismatch
    - independent_validator_error
  positive_class_requires:
    - coverage_pass
    - primary_gate_pass
    - every_falsification_axis_pass
  downstream_authorization_from_positive_class: false

execution_sequence:
  - SERIAL_CONTRACT_INTEGRATED
  - SYNTHETIC_BUILDER_VALIDATOR_PASS
  - ISOLATED_CANDIDATE_MATERIALIZED
  - STRICT_DQ_PASS_0_0
  - EVENT_AND_ATTEMPT_LEDGERS_FROZEN
  - COVERAGE_ONLY_GATE_PASS
  - ONE_CANONICAL_RUN
  - MANDATORY_FALSIFICATION
  - INDEPENDENT_VALIDATION
  - MECHANICAL_CLASSIFICATION

safety:
  new_o1_result_read: false
  coverage_audit_executed: false
  model_training_executed: false
  prospective_accessed: false
  decision_value_audit_started: false
  risk_overlay_created: false
  candidate_family_created: false
  strategy_backtest_executed: false
  target_weights_generated: false
  qld_automatic_selection_enabled: false
  paper_shadow_changed: false
  promotion_allowed: false
  production_effect: none
  broker_action: none
