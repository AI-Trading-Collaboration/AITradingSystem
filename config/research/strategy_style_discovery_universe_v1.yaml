  SPY: 1.0
  QQQ: 1.0
  SGOV: 0.0
  QLD: 2.0
  TQQQ: 3.0
source_commitments:
  existing_prices_path: data/raw/prices_daily.csv
  existing_rates_path: data/raw/rates_daily.csv
  qld_provider: Financial Modeling Prep
  qld_provider_id: fmp_eod_daily_prices
  qld_raw_endpoint: https://financialmodelingprep.com/stable/historical-price-eod/non-split-adjusted
  qld_adjusted_endpoint: https://financialmodelingprep.com/stable/historical-price-eod/dividend-adjusted
  qld_request_symbol: QLD
  isolated_source_required: true
  canonical_cache_mutation_allowed: false
  required_expected_tickers:
    - SPY
    - QQQ
    - SGOV
    - QLD
    - TQQQ
fixed_implementations:
  - implementation_id: qld_100
    weights:
      QLD: 1.0
    target_qqq_equivalent_exposure: 2.0
  - implementation_id: qqq_50_tqqq_50
    weights:
      QQQ: 0.5
      TQQQ: 0.5
    target_qqq_equivalent_exposure: 2.0
  - implementation_id: sgov_33_tqqq_67
    weights:
      SGOV: 0.3333333333333333
      TQQQ: 0.6666666666666666
    target_qqq_equivalent_exposure: 2.0
rebalance_cadences:
  - buy_and_hold
  - weekly
  - monthly
  - daily
turnover_and_cost_mechanics:
  initial_establishment_cost_included: true
  initial_one_way_traded_notional: 1.0
  rebalance_one_way_traded_notional_formula: 0.5 * sum(abs(target_weight - drifted_weight))
  cost_application: >-
    每个交易日收益实现后按cadence在收盘执行target-weight rebalance；成本等于
    one-way traded notional乘transaction-cost policy的总bps，并从当日组合NAV扣除。
  buy_and_hold_rebalance_turnover_after_initial: 0.0
transaction_cost_policy_path: config/research/transaction_cost_model.yaml
required_metrics:
  - total_return
  - cagr
  - annualized_volatility
  - max_drawdown
  - sharpe
  - calmar
  - worst_1d_loss
  - worst_5d_loss
  - worst_20d_loss
  - external_turnover
  - cost_drag
metric_conventions:
  annualization_sessions: 252
  sharpe_risk_free_rate: 0.0
  sharpe_label: annualized_non_excess_return_sharpe
  slice_reinitialization: >-
    每个预注册切片独立从NAV=1和目标权重开始，并计入统一初始建仓成本；切片指标不是
    full-primary NAV路径的简单截取。
tracking_diagnostics:
  - residual_bias
  - residual_mae
  - residual_rmse
  - correlation
  - realized_beta
required_slices:
  - full_primary
  - pre_ai_cycle_comparison
  - ai_cycle_comparison
  - calendar_year
decision_mapping:
  pareto_objectives:
    maximize:
      - terminal_value_net
      - cagr
      - max_drawdown
      - worst_5d_loss
      - worst_20d_loss
    minimize:
      - annualized_volatility
      - external_turnover
      - cost_drag
  floating_point_epsilon: 1.0e-12
  eligible_strict_advantage_rule: >-
    同一cadence下QLD必须处于三种实现的Pareto non-dominated frontier，且在至少一个
    预注册Pareto objective上严格优于两种current-universe comparator。
  no_value_rule: >-
    QLD在四个cadence上均被至少一种current-universe comparator Pareto dominated。
  mixed_rule: 所有不满足eligible或no_value且数据质量通过的结果。
  eligible_status: QLD_ELIGIBLE_FOR_OWNER_ACTION_UNIVERSE_REVIEW
  no_value_status: QLD_NO_INCREMENTAL_IMPLEMENTATION_VALUE
  mixed_status: QLD_MIXED_EVIDENCE_KEEP_RESEARCH_ONLY
  blocked_status: BLOCKED_DATA_QUALITY_OR_COVERAGE
safety:
  research_only: true
  historical_seen_only: true
  prospective_source_rows_observed: true
  prospective_values_used_in_evaluation: false
  candidate_search_executed: false
  strategy_logic_changed: false
  official_action_universe_changed: false
  official_primary_action_universe_changed: false
  role_limited_implementation_universe_changed: true
  qld_role_limited_manual_consideration_approved: true
  qld_automatic_execution_allowed: false
  paper_shadow_changed: false
  promotion_allowed: false
  production_effect: none
  broker_action: none
  scoped_data_quality_exception_active: true
  canonical_full_cache_pass_claimed: false
