  approval_id: owner_decision:TRADING-2459:2026-07-25:approve_qld_role_limited_2x_implementation_instrument
  status: OWNER_APPROVED_ROLE_LIMITED_MANUAL_CONSIDERATION
  instrument: QLD
  instrument_role: execution_implementation_only
  independent_trend_model_required: true
  trusted_nasdaq_uptrend_required: true
