scoped_data_quality_exception:
  approval_id: owner_decision:TRADING-2459:2026-07-25:approve_scoped_five_asset_dq_to_avoid_qld_block
  approved_at: '2026-07-25'
  approved_by: project_owner
  reason: >-
    canonical full-cache DQ当前仅因31条^VIX non-XNYS-session行失败；该ticker不属于
    QLD instrument evaluation的输入，Owner明确要求该无关全局blocker不得阻塞QLD评估。
  behavioral_impact: >-
    评估只消费并校验SPY/QQQ/SGOV/TQQQ/QLD及同期rates的隔离snapshot；结果不得标记为
    canonical full-cache PASS，不得被其他consumer、promotion、paper-shadow或production复用。
  risk: >-
    scoped PASS不能证明全局cache或^VIX质量；若实际五资产panel遗漏了canonical full-universe
    才能发现的cross-source问题，结论可信度低于完整canonical strict PASS。
  validation_coverage: >-
    同一validate_data_cache实现对隔离五资产panel执行schema、coverage、freshness、duplicate、
    session、OHLC、finite/positive、return和rates检查；panel/source/report均绑定SHA-256，
    content-derived validator从source重建指标并执行tamper tests。
  exit_condition: >-
    DATA-GOV-001_D0B2B取得下一合法provider-ready canonical strict PASS后，以同一冻结政策
    重跑QLD评估；新结果验证通过后替代本scoped artifact，或证实结论不变后关闭例外。
  canonical_cache_mutation_allowed: false
  global_canonical_dq_status: FAIL
  global_blocker_code: prices_non_market_session_date
  global_blocker_ticker: ^VIX
scoped_warning_resolution:
  warning_code: prices_adjustment_ratio_jump
  status: OWNER_REVIEWED_KNOWN_CORPORATE_ACTIONS
  interpretation: >-
    scoped DQ的唯一warning对应QLD两次官方2:1 forward split；adjusted-close在split日
    分别为+0.2556%与-4.7097%，没有把约-50%的raw split price change写入收益路径。
  global_data_quality_policy_changed: false
  events:
    - ticker: QLD
      effective_date: '2021-05-25'
      ratio: 2
      source_name: ProShares May 2021 ETF Share Splits
      source_url: https://www.proshares.com/press-releases/proshares-announces-etf-share-splits-51121
    - ticker: QLD
      effective_date: '2025-11-20'
      ratio: 2
      source_name: ProShares November 2025 ETF Share Splits
      source_url: https://www.proshares.com/press-releases/proshares-announces-etf-share-splits5
rationale: >-
  将SPY作为广义市场benchmark和regime control；在固定2x QQQ-equivalent exposure评估
  证明QLD具有增量实现价值后，Owner只批准其作为角色受限的执行实现工具，避免把工具选择
  自由度误写成Alpha或趋势判断。
intended_effect: >-
  区分reference universe、current primary action assets、role-limited implementation
  instrument与signal/candidate universe；独立趋势和风险决策先确定目标暴露，执行层仅在
  目标QQQ-equivalent exposure接近2x时考虑QLD。
review_condition: >-
  D0B2B canonical strict PASS后按冻结政策重跑；自动执行前必须另行治理“可信上升趋势”、
  “接近2x”、风险门、instrument selector、forward shadow与退出规则。任何资产角色、实现
  权重、cadence、窗口、成本、指标或decision mapping变化都必须新版本。
research_context:
  market_regime_id: unified_primary_2021
  research_window_id: exact_three_asset_validated
  requested_start: '2021-02-22'
  historical_seen_end: '2026-07-21'
  prospective_untouched_start: '2026-07-22'
  legacy_ai_cycle_comparison_start: '2022-12-01'
  prospective_access_allowed_for_calculation: false
  prospective_source_rows_observed_during_audit: true
  prospective_observation_note: >-
    2026-07-25审计共享prices_daily.csv文件尾部时，终端输出包含2026-07-22至
    2026-07-24行。本评估必须在加载后立即截断至2026-07-21，且不得将后续值用于
    指标、判断或参数变化；但不能再声称这些日期对本任务保持untouched。
