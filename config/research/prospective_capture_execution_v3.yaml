schema_version: prospective_capture_execution_policy.v3
policy_id: prospective_capture_execution_v3
policy_version: 3.0.0
status: REVIEWED_ENGINEERING_CONTRACT_REAL_SCOPE_REVIEW_REQUIRED
owner: Project Owner / integration-coordinator
scope_ref: owner_decision:GOV-008:2026-10-10:capture_protocol_v3
requirement_ref: docs/requirements/GOV-008_Research_First_Governance_Refactor.md
rationale: >-
  完整前瞻父确认须覆盖 DQ、预览、recorder 原调用返回及 postguard，并保留原始 UTC
  与固定 QPC 外包络。旧微秒表示不证明独立时钟速率，不再用该推论识别 UTC 回拨。
  v3 用本机 capture hold（精确候选 commit、代码未修改、路径单次持有、有界有效期）替换
  S4D lease；hold 是本机自证，不是独立权威。
intended_effect: >-
  子事件与父链的已验证 bound 单调传递，严格约束 D、首次 F、manifest 与 hold。
  最终 result 只在全部决定准入的检查完成后一次提交，不保留未绑定的致命写后时钟门禁。
validation_plan: >-
  固定 provider/anchor/prefix、子 bound/完整源码/DQ/preview 闭包、粗时钟与回拨、
  截止/expiry 相等、纽约午夜、崩溃/幂等及单一 commit；真实时钟 synthetic E2E、
  16-worker focused、exact final candidate 正式验证及绑定失败 parent 的 Full。
review_condition: >-
  首次真实使用前复核 exact source roots、时间信任模型与 bounded manifest。
  改变 consumer、收益时钟、执行次数、来源角色、提交语义或 outcome 访问须重新审查。
