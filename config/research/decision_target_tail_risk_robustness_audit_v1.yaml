variant_policy:
  target_id: QQQ_FUTURE_WORST_1D_RETURN
  all_horizons:
    - 1d
    - 5d
    - 10d
    - 20d
  variants:
    - variant_id: EXACT_PRIMARY
      mandatory: true
      feature_selector: ALL
      feature_lag_sessions: 0
      embargo_sessions: 20
      rationale: exact Batch 2 primary model reconstruction
    - variant_id: FEATURE_LAG_1
      mandatory: true
      feature_selector: ALL
      feature_lag_sessions: 1
      embargo_sessions: 20
      rationale: reject dependence on same-session feature timing
    - variant_id: EMBARGO_40
      mandatory: true
      feature_selector: ALL
      feature_lag_sessions: 0
      embargo_sessions: 40
      rationale: double maximum label horizon and original embargo
    - variant_id: DROP_SPY_DERIVED
      mandatory: true
      feature_selector: EXCLUDE_SOURCE_ROLE
      excluded_source_role: SPY
      feature_lag_sessions: 0
      embargo_sessions: 20
      rationale: reject single dependence on SPY reference features
    - variant_id: DROP_SGOV_DERIVED
      mandatory: true
      feature_selector: EXCLUDE_SOURCE_ROLE
      excluded_source_role: SGOV
      feature_lag_sessions: 0
      embargo_sessions: 20
      rationale: reject single dependence on SGOV defensive reference features
    - variant_id: PRICE_TREND_ONLY
      mandatory: false
      feature_selector: FAMILY_ONLY
      included_family: PRICE_TREND
      feature_lag_sessions: 0
      embargo_sessions: 20
      rationale: diagnostic family concentration
    - variant_id: VOLATILITY_DRAWDOWN_ONLY
      mandatory: false
      feature_selector: FAMILY_ONLY
      included_family: VOLATILITY_DRAWDOWN
      feature_lag_sessions: 0
      embargo_sessions: 20
      rationale: diagnostic family concentration
    - variant_id: CROSS_ASSET_STATE_ONLY
      mandatory: false
      feature_selector: FAMILY_ONLY
      included_family: CROSS_ASSET_STATE
      feature_lag_sessions: 0
      embargo_sessions: 20
      rationale: diagnostic family concentration

capability_gate:
  status: TEMPORARY_PILOT_FALSIFICATION_BASELINE
  owner: project_owner_and_research_governance
  rationale: >-
    保持TRADING-2461的fold/rank/RMSE/quintile门槛，避免在robustness audit中为当前结果重定义
    capability；10d是原通过集合中的最长horizon，mandatory variant必须保留。
  review_condition: >-
    V1完成后不得校准本门槛；只可在新的independent evidence与Owner review下发布v2。
  minimum_valid_folds: 6
  minimum_positive_spearman_folds: 5
  minimum_median_spearman: 0.03
  minimum_pooled_spearman: 0.05
  minimum_median_rmse_improvement_vs_m0_exclusive: 0.0
  minimum_median_quintile_spread_exclusive: 0.0
  minimum_supported_primary_horizons: 2
  required_primary_horizon: 10d
  all_mandatory_variants_must_support_target: true

fold_influence_gate:
  status: TEMPORARY_PILOT_FALSIFICATION_BASELINE
  minimum_leave_one_fold_out_spearman: 0.03
  required_leave_one_fold_out_passes: 7
  minimum_test_rows_per_fold: 20
  required_horizon: 10d
  minimum_passing_primary_horizons: 2

regime_gate:
  status: TEMPORARY_PILOT_FALSIFICATION_BASELINE
  threshold_fit_scope: fold_train_only
  quantiles:
    - 0.3333333333333333
    - 0.6666666666666666
  dimensions:
    - regime_id: TREND
      feature_id: qqq_return_60
    - regime_id: VOLATILITY
      feature_id: qqq_volatility_60
    - regime_id: DRAWDOWN
      feature_id: qqq_drawdown_120
  minimum_rows_per_pooled_stratum: 80
  minimum_positive_strata_per_dimension: 2
  minimum_eligible_strata_per_dimension: 3
  minimum_allowed_stratum_spearman: -0.05
  required_horizon: 10d
  minimum_passing_primary_horizons: 2

event_calibration_gate:
  status: TEMPORARY_PILOT_FALSIFICATION_BASELINE
  event_threshold_fit_scope: fold_train_only
  risk_flag_threshold_fit_scope: fold_train_only
  tail_event_quantiles:
    - 0.10
    - 0.20
  predicted_risk_quantile: 0.20
  minimum_test_events_per_fold: 3
  minimum_flagged_rows_per_fold: 5
  minimum_fold_lift_exclusive: 1.0
  minimum_fold_top_bottom_separation_exclusive: 0.0
  minimum_passing_folds: 5
  minimum_pooled_lift: 1.20
  required_horizon: 10d
  minimum_passing_primary_horizons: 2

placebo_gate:
  status: TEMPORARY_PILOT_FALSIFICATION_BASELINE
  kind: WITHIN_FOLD_BLOCK_PERMUTATION
  block_sessions: 20
  replicate_count: 199
  random_seed: 2462
  alternative: GREATER_ACTUAL_SPEARMAN
  maximum_empirical_p_value: 0.05
  null_percentile: 0.95
  required_horizon: 10d
  minimum_passing_primary_horizons: 2

decision_policy:
  allowed_statuses:
    - TAIL_RISK_CAPABILITY_ROBUST
    - TAIL_RISK_CAPABILITY_FRAGILE
    - TAIL_RISK_CAPABILITY_FALSIFIED
    - INSUFFICIENT_ROBUSTNESS_EVIDENCE
  robust_requires:
    - EXACT_RECONSTRUCTION_PASS
    - ALL_MANDATORY_VARIANTS_PASS
    - FOLD_INFLUENCE_PASS
    - REGIME_CONCENTRATION_PASS
    - EVENT_CALIBRATION_PASS
    - PLACEBO_REJECTION_PASS
  falsified_if_any:
    - EXACT_RECONSTRUCTION_FAIL
    - REQUIRED_10D_PLACEBO_NOT_REJECTED
    - NO_PRIMARY_HORIZON_SURVIVES_BOTH_TIMING_AND_EMBARGO_STRESS
  insufficient_if_any:
    - INPUT_OR_SCHEMA_MISMATCH
    - FOLD_OR_ROW_IDENTITY_MISMATCH
    - MANDATORY_AXIS_NOT_EVALUABLE
  next_route_on_robust: OWNER_MAY_AUTHORIZE_SEPARATE_DECISION_VALUE_AUDIT
  next_route_on_non_robust: CLOSE_TAIL_RISK_PATH_OR_REDESIGN_DECISION_TARGET

safety:
  research_only: true
  historical_seen_only: true
  prospective_accessed: false
  candidate_family_created: false
