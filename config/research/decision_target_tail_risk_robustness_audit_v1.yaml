version: 1.0.0
status: OWNER_APPROVED_HISTORICAL_SEEN_FALSIFICATION_BASELINE
owner: project_owner_and_research_governance
owner_decision: owner_decision:TRADING-2462:2026-07-27:approve_tail_risk_capability_robustness_falsification_audit_v1
protocol_frozen_before_detailed_result_rows: true
rationale: >-
  TRADING-2461只证明QQQ future worst-1d target在historical-seen purged walk-forward中达到pilot
  capability gate。本政策在读取其detailed prediction/metric rows前冻结timing、embargo、
  feature/source ablation、fold influence、train-only regime/event calibration与block-placebo
  证伪轴；任一mandatory axis失败都不得把能力升级为risk overlay。
intended_effect: >-
  区分可跨扰动复现的tail-risk ranking skill、依赖特定输入或样本切片的fragile skill，以及
  无法拒绝placebo或无法重建的falsified/insufficient evidence。
validation_evidence: >-
  exact Batch 2 content reconstruction、variant rebuild、fold-local train threshold、deterministic
  block permutation、double-build byte identity、content-derived validator与tamper tests。
review_condition: >-
  本任务只决定是否允许另立Decision Value Audit。任何threshold、variant、horizon、event
  quantile、regime definition、placebo seed/block/replicate或aggregate mapping变化必须发布新
  policy version并获得Owner review；不得按v1结果修改。

