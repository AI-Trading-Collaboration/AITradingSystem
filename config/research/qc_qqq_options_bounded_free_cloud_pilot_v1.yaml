scope_fields:
  - field_id: CLOUD_COMPUTE_BUDGET
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: project_owner
    exit_condition: Record a reviewed Free Cloud compute budget and stop condition.
  - field_id: FEE_POLICY
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: research_owner
    exit_condition: Record an evidence-backed fee policy; zero fee may only be an isolation sensitivity.
  - field_id: MAXIMUM_CONTRACT_QUANTITY
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: project_owner
    exit_condition: Record an exact reviewed long-only contract cap no greater than the qualitative one-contract boundary.
  - field_id: MAXIMUM_ORDER_COUNT
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: project_owner
    exit_condition: Record an exact reviewed low-order cap for the bounded smoke.
  - field_id: MAXIMUM_RUNTIME
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: project_owner
    exit_condition: Record a reviewed runtime boundary and abort condition.
  - field_id: PARTIAL_FILL_POLICY
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: research_owner
    exit_condition: Record an evidence-backed partial-fill reality policy.
  - field_id: REALITY_LATENCY_POLICY
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: research_owner
    exit_condition: Record an evidence-backed latency policy and isolation sensitivities.
  - field_id: REALITY_SLIPPAGE_POLICY
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: research_owner
    exit_condition: Record an evidence-backed slippage policy; zero slippage is not the reality baseline.
  - field_id: RECONCILIATION_TOLERANCE
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: independent_reviewer
    exit_condition: Record export mapping, rounding and tolerance evidence before accepting numeric differences.
  - field_id: REQUESTED_END
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: project_owner
    exit_condition: Record the exact reviewed requested end date inside the validated primary range.
  - field_id: REQUESTED_START
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: project_owner
    exit_condition: Record the exact reviewed requested start date and smoke-only role; 2022-12-01 is not a default.
  - field_id: RESOURCE_TELEMETRY_LIMIT
    status: UNKNOWN_REQUIRES_OWNER_REVIEW
    owner: independent_reviewer
    exit_condition: Record required telemetry fields and reviewed acceptance or escalation handling.
