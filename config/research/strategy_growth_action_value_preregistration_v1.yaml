policy_metadata:
  owner: project_owner_and_strategy_research_governance
  rationale: >-
    Existing first-layer and defensive research produced no promotable candidate, while
    return-seeking diagnostics were beta/TQQQ and 2023+ dependent. Freeze one non-leveraged
    QQQ/SGOV growth hypothesis before any new empirical work.
  intended_effect: >-
    Make growth action value the next research question, keep defense as an independent hard
    gate, select exactly one non-executable data evidence lane, and fail closed until reviewed
    threshold policy references exist.
  validation_evidence: >-
    Canonical policy loading, exact authority identity and semantic replay, sealed decision
    serialization, mandatory-axis aggregation and negative tests are required before closeout.
  review_condition: >-
    Review before adding or changing threshold references, executing the selected data lane,
    running empirical evaluation, changing the action universe, adding leverage/options, or
    changing any downstream authorization.
