claims:
  - claim_id: FREE_TIER_MINUTE_DAILY_CLOUD_DATA
    classification: DOCUMENTED_FACT
    source_ids: [QC_TIER_FEATURES_DOC]
    summary: 官方 tier 文档描述 Free tier 提供 minute 到 daily 的 cloud dataset class 访问。
    allowed_conclusion: 仅支持受限 cloud capability 的 conditional 判断，不证明 QQQ Options account entitlement。
    owner: project_owner
    exit_condition: 人工复核当前 tier 页面并与账户 Resources/Data 页面逐项对照。
  - claim_id: US_EQUITY_OPTIONS_MINUTE_PROVIDER_COVERAGE
    classification: DOCUMENTED_FACT
    source_ids: [QC_US_EQUITY_OPTIONS_DOC]
    summary: 官方 dataset 文档描述 US Equity Options 具有 minute resolution 与 provider historical coverage。
    allowed_conclusion: 只能描述 provider dataset，不得推出当前账户或 primary-window retention PASS。
    owner: project_owner
    exit_condition: 获取 account-specific QQQ Options entitlement 与 exact requested-window 可用性证据。
  - claim_id: CLOUD_AND_DOWNLOAD_LICENSES_ARE_DISTINCT
    classification: DOCUMENTED_FACT
    source_ids: [QC_DATASET_LICENSING_DOC]
    summary: 官方 licensing 文档把 cloud license 与 download license 作为不同访问权利。
    allowed_conclusion: 当前 cloud evidence 不能授权 local raw download。
    owner: project_owner
    exit_condition: 取得适用于本组织与 US Equity Options 的 exact download license 证明。
  - claim_id: DOWNLOAD_IS_INTERNAL_LEAN_ONLY_NO_REDISTRIBUTION
    classification: DOCUMENTED_FACT
    source_ids: [QC_DATASET_LICENSING_DOC, QC_SITE_TERMS]
    summary: 官方 licensing reference 对下载数据限定组织内部 LEAN 使用并禁止再分发或转换。
    allowed_conclusion: raw options download、转换、重建和 redistribution 保持 NO-GO。
    owner: project_owner
    exit_condition: 人工复核 provider agreement 与 Terms；任何更宽权利必须由书面 license 单独证明。
  - claim_id: DERIVED_BACKTEST_UI_EXPORTS_ARE_DOCUMENTED
    classification: DOCUMENTED_FACT
    source_ids: [QC_BACKTEST_RESULTS_DOC]
    summary: 官方 Results 文档列出 report、orders、trades、logs 与 results 等 UI derived artifacts。
    allowed_conclusion: 只支持 2489 对 export-safe derived artifacts 的 conditional collection，不支持 raw rows。
    owner: TRADING-2489 evidence engineering + project_owner
    exit_condition: 2489 reviewed collection policy、security review 与 complete strict bundle PASS。
  - claim_id: API_CLI_IS_NOT_A_FREE_TIER_CAPABILITY
    classification: CONSERVATIVE_INFERENCE
    source_ids: [QC_TIER_FEATURES_DOC]
    summary: 官方 tier 文档把 API/CLI 描述在 Quant Researcher tier，而非 Free tier capability。
    allowed_conclusion: 当前 Free tier 不调用 API/CLI，也不能据此自动批准付费升级。
    owner: project_owner
    exit_condition: 新的 paid-tier value-of-information proposal 与 exact Owner authorization。
  - claim_id: ACCOUNT_QQQ_OPTIONS_ENTITLEMENT_NOT_PROVEN
    classification: EXPLICIT_UNKNOWN
    source_ids: [QC_DATASET_LICENSING_DOC, QC_TIER_FEATURES_DOC, QC_US_EQUITY_OPTIONS_DOC]
    summary: 公开文档不能证明 project/account 对 QQQ Options 的完整 entitlement。
    allowed_conclusion: QQQ Options account entitlement 保持 UNKNOWN，不能升级为 PASS。
    owner: project_owner
    exit_condition: 人工保存 export-safe account Data/entitlement receipt 或取得 provider 书面确认。
  - claim_id: PRIMARY_WINDOW_RETENTION_NOT_PROVEN
    classification: EXPLICIT_UNKNOWN
    source_ids: [QC_US_EQUITY_OPTIONS_DOC]
    summary: Provider dataset start 不证明账户对 2021-02-22 primary research window 的完整 retention。
    allowed_conclusion: 不得运行、扩窗或宣称 primary-window viability。
    owner: research owner + project_owner
    exit_condition: 新任务 exact-bind account entitlement，并以 2021-02-22 requested/evaluated range 形成 governed evidence。
  - claim_id: AUTOMATED_PAGE_COPY_NOT_ADMITTED
    classification: CONSERVATIVE_INFERENCE
    source_ids: [QC_SITE_TERMS]
    summary: 本任务不使用自动化复制、监控、抓取或挖掘保存 QuantConnect 页面正文。
    allowed_conclusion: source-content checksum 明确保留 unavailable，不能伪造 evidence completeness。
    owner: project_owner
    exit_condition: Owner 人工复核 official pages，并提交不含受限正文的 typed attestation。
assessments:
  - axis_id: FREE_CLOUD_DATA_CLASS_ACCESS
    status: PUBLIC_DOCS_CONDITIONAL_SUPPORT
    supporting_claim_ids: [FREE_TIER_MINUTE_DAILY_CLOUD_DATA, US_EQUITY_OPTIONS_MINUTE_PROVIDER_COVERAGE]
    blocker: Public docs do not prove account-specific QQQ Options entitlement or retention.
  - axis_id: QQQ_OPTIONS_ACCOUNT_ENTITLEMENT
    status: UNKNOWN_ACCOUNT_SPECIFIC_EVIDENCE_REQUIRED
    supporting_claim_ids: [ACCOUNT_QQQ_OPTIONS_ENTITLEMENT_NOT_PROVEN]
    blocker: Export-safe account entitlement receipt or provider confirmation is absent.
  - axis_id: PRIMARY_WINDOW_HISTORICAL_RETENTION
    status: UNKNOWN_ACCOUNT_SPECIFIC_EVIDENCE_REQUIRED
    supporting_claim_ids: [PRIMARY_WINDOW_RETENTION_NOT_PROVEN]
    blocker: Exact 2021-02-22 requested/evaluated account coverage has not been reviewed.
  - axis_id: RAW_OPTIONS_LOCAL_DOWNLOAD
    status: NO_GO_SEPARATE_DOWNLOAD_LICENSE_REQUIRED
    supporting_claim_ids: [CLOUD_AND_DOWNLOAD_LICENSES_ARE_DISTINCT]
    blocker: No separate US Equity Options download license is authorized or evidenced.
  - axis_id: RAW_OPTIONS_REDISTRIBUTION
    status: NO_GO_PROHIBITED
    supporting_claim_ids: [DOWNLOAD_IS_INTERNAL_LEAN_ONLY_NO_REDISTRIBUTION]
    blocker: Raw row download, conversion, reconstruction, and redistribution remain prohibited.
  - axis_id: DERIVED_BACKTEST_RESULT_EXPORT
    status: CONDITIONAL_DOCUMENTED_UI_EXPORT_ONLY
    supporting_claim_ids: [DERIVED_BACKTEST_UI_EXPORTS_ARE_DOCUMENTED, AUTOMATED_PAGE_COPY_NOT_ADMITTED]
    blocker: 2489 reviewed collection policy and complete strict bundle are still absent.
  - axis_id: API_CLI_ACCESS
    status: NO_GO_CURRENT_FREE_TIER
    supporting_claim_ids: [API_CLI_IS_NOT_A_FREE_TIER_CAPABILITY]
    blocker: API/CLI are not authorized and paid-tier value has not been reviewed.
aggregate_decision: LICENSE_EXPORT_NO_GO_OWNER_REVIEW_REQUIRED
