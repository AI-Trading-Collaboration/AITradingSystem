owner_instruction: owner_decision:TRADING-2542I:2026-08-29:authorize_real_materialization_and_conditional_qc_v1
rationale: Preserve the TRADING-2483 immutable normalized daily-signal package mechanics while rebinding new packages to the reviewed XNYS special-closure registry 1.1.0; historical v1 packages retain their archived 1.0.0 calendar authority.
intended_effect: A downstream consumer can verify the exact signal, source, local data-quality, calendar, policy, contract, and code identity without inferring point-in-time facts from filenames or dates.
validation_plan: Run canonical replay, checksum, calendar, exact-coverage, lag, tamper, idempotence, archived-v1 compatibility, and fail-closed mapping tests, followed by governed repository validation tiers.
review_condition: Review before changing the calendar authority, ETF direction mapping, signal lag or coverage, package layout, external evidence admission, or any option selection or execution behavior.
expiry_condition: Supersede only through an owner-reviewed versioned policy and package migration with backward-compatibility evidence.
