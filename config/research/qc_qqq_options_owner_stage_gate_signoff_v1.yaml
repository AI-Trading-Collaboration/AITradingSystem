axis_policies:
  - axis_id: PLATFORM_CAPABILITY
    decision: CONDITIONAL_GO
    reason_code: SINGLE_SESSION_CAPABILITY_OBSERVED_NOT_ENTITLEMENT_PROOF
    summary: A single QQQ minute option-chain session and one simulated fill were observed, but historical entitlement and coverage remain unproven.
    evidence_refs:
      - owner_review.confirmed_one_order_one_fill
      - execution_evidence.account_tier
      - execution_evidence.cloud_compute
  - axis_id: TECHNICAL_CORRECTNESS
    decision: CONDITIONAL_GO
    reason_code: BOUNDED_CHRONOLOGY_OBSERVED_SHARED_VALIDATION_INCOMPLETE
    summary: Independent-minute intent, submit and fill facts replay, but the bounded smoke is not complete strategy or shared reconciliation validation.
    evidence_refs:
      - execution_evidence.intent_time_utc
      - execution_evidence.submit_time_utc
      - execution_evidence.fill_time_utc
  - axis_id: LICENSE_EXPORT
    decision: NO_GO
    reason_code: LICENSE_AND_EXPORT_ENTITLEMENT_NOT_ESTABLISHED
    summary: Absence of raw rows in this artifact does not establish license or export entitlement for a larger research range.
    evidence_refs:
      - execution_evidence.prior_capability_admission
      - owner_review.confirmed_no_raw_option_rows
  - axis_id: DQ_PIT
    decision: NO_GO
    reason_code: PLATFORM_LOG_ONLY_DQ_PIT_CANNOT_COVER_SHARED_LIFECYCLE
    summary: Platform-log-only DQ and PIT observations cannot replace the inherited shared DQ and PIT lifecycle.
    evidence_refs:
      - execution_evidence.option_event_dq_status
      - execution_evidence.option_event_pit_status
  - axis_id: RESOURCE_BUDGET
    decision: NO_GO
    reason_code: PROCESSED_DATA_POINTS_SCOPE_VIOLATION
    summary: Observed processed data points exceeded the reviewed pilot cap.
    evidence_refs:
      - owner_review.confirmed_processed_data_points
      - owner_review.confirmed_reviewed_cap
      - owner_review.failed_scope_check_ids
  - axis_id: SHARED_RECONCILIATION
    decision: NO_GO
    reason_code: SHARED_2489_2490_REMAIN_POLICY_BLOCKED
    summary: The strict manual bundle and local reconciliation authorities remain blocked by their shared policies.
    evidence_refs:
      - execution_evidence.shared_2489_bundle_status
      - execution_evidence.shared_2490_reconciliation_status
  - axis_id: RANGE_EXPANSION
    decision: NO_GO
    reason_code: TERMINAL_PILOT_DISPOSITION_PROHIBITS_RANGE_EXPANSION
    summary: The accepted scope violation and terminal pilot disposition prohibit range or workload expansion.
    evidence_refs:
      - owner_review.disposition
      - owner_review.range_expansion_allowed
      - owner_review.further_cloud_action_authorized
  - axis_id: PAID_TIER_UPGRADE
    decision: NO_GO
    reason_code: PAID_TIER_VALUE_OF_INFORMATION_NOT_ESTABLISHED
    summary: The bounded evidence neither proves Free is sufficient nor justifies a paid-tier upgrade decision.
    evidence_refs:
      - owner_review.disposition
      - execution_evidence.prior_capability_admission
