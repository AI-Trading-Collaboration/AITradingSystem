  prior_day_model_freshness:
    rule: NOT_EVALUATED_WITHOUT_CANONICAL_MATERIAL
    reason_code: PRIOR_DAY_MODEL_AS_OF_SESSION_NOT_COLLECTED
    missing_requirement: Greeks/model as-of session and exact prior exchange session identity
  provider_raw_checksum:
    rule: NOT_EVALUATED_WITHOUT_CANONICAL_MATERIAL
    reason_code: PROVIDER_RAW_CHECKSUM_UNAVAILABLE
