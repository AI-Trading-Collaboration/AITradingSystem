    reason_code: CHAIN_MISSING
    evidence_key: TRADING2531_OPTION_CHAIN_PRESENCE_MISSING_SESSIONS
  engine_identity:
    rule: NOT_EVALUATED_WITHOUT_CANONICAL_MATERIAL
    reason_code: ENGINE_IDENTITY_NOT_COLLECTED
    missing_requirement: platform tier, engine and bundle identity binding
  evidence_identity:
    rule: NOT_EVALUATED_WITHOUT_CANONICAL_MATERIAL
    reason_code: PLATFORM_EVIDENCE_MANIFEST_NOT_COLLECTED
    missing_requirement: 2482 PlatformEvidenceManifestRecord with confirmed tier and engine identity
