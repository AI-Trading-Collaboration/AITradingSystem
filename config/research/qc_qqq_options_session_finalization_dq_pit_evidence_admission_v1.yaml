    reason_code: EXCHANGE_CALENDAR_IDENTITY_NOT_COLLECTED
    missing_requirement: reviewed calendar id, version and hash
  fill_forward_ambiguity:
    rule: NOT_EVALUATED_ZERO_ORDER_RUN
