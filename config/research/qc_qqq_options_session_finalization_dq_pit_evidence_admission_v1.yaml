    reason_code: OPEN_INTEREST_AS_OF_SESSION_NOT_COLLECTED
    missing_requirement: OI as-of session and exact prior exchange session identity
  order_fill_chronology:
    rule: NOT_EVALUATED_ZERO_ORDER_RUN
    reason_code: ORDER_FILL_CHRONOLOGY_NOT_APPLICABLE_TO_ZERO_ORDER_TRANSPORT_RUN
