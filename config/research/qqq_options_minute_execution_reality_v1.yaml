owner_decision: owner_decision:TRADING-2486:2026-08-02:freeze_minute_execution_mechanics_without_unreviewed_numeric_policy
rationale: Freeze deterministic next-independent-minute execution mechanics while keeping every latency, slippage, fee, quote-freshness, limit-buffer, partial-fill and timeout value fail closed until explicit Owner review.
intended_effect: Identical governed inputs produce identical typed cash-preservation or execution replay without daily-close, same-bar, mid-price, last-price or hidden fill assumptions.
validation_plan: Run policy drift, canonical DQ replay, chronology, quote-side, limit-bound, partial, reject, cancel, permutation, property, golden and predecessor-binding tests before governed final-tree validation.
review_condition: Review before activating any execution scenario, consuming real minute option quotes, or using an execution result in an investment-facing backtest.
expiry_condition: Supersede only through an Owner-reviewed tracked policy change with calibration evidence, review or expiry condition, compatibility coverage and final-tree validation.
