# Earnings event intake for reading the earnings-shock print-only table once on QQQ after 2010
# (TRADING-2565-129). Owner decision: owner_decision:TRADING-2565:2026-11-10:earnings_shock_after_2010
# (Baker chose "do both" on 2026-11-10 21:30 JST; the earnings item said the read is queued by the
# research loop and he signs once before it reads this span). Read by
# src/ai_trading_system/research_data/earnings_events.py only; nothing here feeds the daily run or
# production.
#
# Window: the registered one-time window qqq_after_2010_owner_print (2011-01-03 to the QQQ
# long-history snapshot's last close). data_end is that last close of qlh-20261013 (2026-10-12),
# written here so the fetch keeps no filing after the span the table reads; the intake refuses a
# data_end later than the latest checked QQQ snapshot. Filings start 2010-10-01 because the
# 2010-09-30 holdings list applies to events from 2010-10-01; events before 2011-01-03 fall outside
# the read. No stock prices: QQQ signal research uses no other instrument's data (Baker,
# 2026-11-02), so there is no price_start and no issuer has an FMP ticker.
schema_version: research_earnings.v1
filing_start: 2010-10-01
data_end: 2026-10-12
window_id: qqq_after_2010_owner_print
owner_decision: owner_decision:TRADING-2565:2026-11-10:earnings_shock_after_2010

# The US issuers among the ten largest QQQ holdings at any September 30 from 2010 to 2025 (the QQQ
# trust's annual schedules of investments, share classes merged by issuer). entity_pattern must
# match the submissions name or one of its former names, case-insensitive; a mismatch stops the
# fetch before anything is written. Every CIK, name and former name was printed by a read-only
# probe (2026-11-11) before this file was written. Google Inc. filed under 1288776 to 2015 and
# Alphabet Inc. under 1652044 from 2015-10; Broadcom is in the list only from 2022, when only
# Broadcom Inc. (1730168) filed; Mondelez was Kraft Foods Inc. until 2012-10.
issuers:
  - {id: AAPL, ciks: [320193], entity_pattern: "^apple", fmp_ticker: null}
  - {id: MSFT, ciks: [789019], entity_pattern: "^microsoft", fmp_ticker: null}
