schema_version: trading2458_candidate_family_retirement_policy.v1
policy_id: trading2458_candidate_family_retirement
version: 1.0.0
status: OWNER_APPROVED_RETIRED
owner: strategy_research_owner
effective_date: '2026-07-25'
owner_decision: owner_decision:TRADING-2458:2026-07-25:retire_current_saturated_candidate_family
rationale: >-
  TRADING-2458 对冻结的 1,800 行历史证据完成 exact matched contrast；
  七个 candidate axis 在六个 fold 上均表现为 common-mode saturation，
  当前 candidate family 不再提供可辨识的单轴搜索空间。
intended_effect: >-
  保留 TRADING-2452、TRADING-2453 和 TRADING-2458 的 immutable historical
  evidence，同时从所有主动研究、选择、晋级和执行入口移除该 family。
validation_evidence: >-
  TRADING-2458 content-derived diagnostic 重建 7,716 个 exact matched pairs，
  七轴分类均为 COMMON_MODE_SATURATION_NO_AXIS_DISCRIMINATION；owner 随后批准退役。
review_condition: >-
  本 policy 不自动到期。任何重新开放都必须建立新 family/package identity、
  独立预注册、无污染 selection protocol 和新的 owner decision；不得修改本 policy
  或旧 package 以恢复资格。
expiry_condition: >-
  仅当一份新版本 reviewed policy 明确 supersede 本 policy 且满足 reopen requirements
  时才能改变主动消费边界；历史退役事实永久保留。

