status: OWNER_REVIEW_REQUIRED_BASELINE
owner: project_owner_and_options_research_governance
owner_decision: owner_decision:TRADING-2485:2026-08-02:freeze_deterministic_selector_engine_without_unreviewed_numeric_or_rank_policy
rationale: Freeze deterministic long-premium single-contract selection mechanics while keeping every investment-facing selection threshold and rank priority fail closed until explicit Owner review.
intended_effect: Identical governed inputs produce identical candidate-set identity and no-contract or selected-SID records without silently widening eligibility or authorizing external execution.
validation_plan: Run policy drift, canonical DQ replay, permutation, property, golden, tamper, no-contract and predecessor-binding tests before governed final-tree validation.
review_condition: Review before activating any DTE, moneyness, delta, quote-age, spread, open-interest, volume or rank policy, or before consuming real QuantConnect option rows.
expiry_condition: Supersede only through an Owner-reviewed tracked policy change with calibration evidence, review or expiry condition, compatibility coverage and final-tree validation.
