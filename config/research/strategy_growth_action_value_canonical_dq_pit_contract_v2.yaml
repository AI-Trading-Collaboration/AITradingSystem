    review_disposition: INSUFFICIENT_EVIDENCE_TO_APPROVE
  min_volume:
    value: 1
    unit: contracts
    direction: GREATER_THAN_OR_EQUAL
    policy_source: Project Owner pre-empirical DATA_RESEARCH pilot intent restricted to decision-as-of cumulative session volume.
    rationale: At least one reported contract provides a minimal same-session activity-presence signal for research evidence; it does not establish execution liquidity.
    intended_effect: Exclude contributors with no observed decision-as-of session activity.
    known_risk: End-of-day or revised volume would introduce lookahead; field-specific available_at and cumulative-as-of identity are mandatory.
