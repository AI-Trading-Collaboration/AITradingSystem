    review_disposition: INSUFFICIENT_EVIDENCE_TO_APPROVE
  max_relative_spread:
    value: '0.20'
    unit: ratio
    direction: LESS_THAN_OR_EQUAL
    policy_source: Project Owner pre-empirical DATA_RESEARCH pilot intent using midpoint-relative mark uncertainty; independent review remains pending.
    rationale: A 20 percent midpoint-relative spread ceiling excludes observations whose quoted mark uncertainty dominates a research aggregate while remaining deliberately separate from transaction_cost_model_v1 and execution liquidity.
    intended_effect: Limit quote-width contamination in option-derived research evidence.
    known_risk: One ceiling may behave differently across premium, moneyness, and expiry buckets; it cannot be interpreted as tradability or execution quality.
    stage: DATA_RESEARCH
    execution_liquidity_authority: false
    primary_window_result_visible_when_selected: false
    review_condition: REVIEW_AFTER_ONE_PRIMARY_WINDOW_EVALUATION_OR_PROVIDER_SEMANTIC_CHANGE
    expiry_condition: EXPIRES_BEFORE_REUSE_OUTSIDE_BOUND_PRIMARY_WINDOW_OR_STAGE
    review_disposition: INSUFFICIENT_EVIDENCE_TO_APPROVE
  min_open_interest:
    value: 10
    unit: contracts
    direction: GREATER_THAN_OR_EQUAL
    policy_source: Project Owner pre-empirical DATA_RESEARCH pilot intent bound to exact-prior-session open interest and future provider revision policy.
    rationale: Ten contracts is a minimal evidence-presence floor for inclusion in a derived aggregate, not a claim that the contract is executable or liquid.
    intended_effect: Exclude essentially unestablished contracts from research contributors.
    known_risk: Provider backfill or revision behavior can change reported prior-session OI; the run manifest must seal source and revision semantics.
    stage: DATA_RESEARCH
    execution_liquidity_authority: false
    primary_window_result_visible_when_selected: false
    review_condition: REVIEW_AFTER_ONE_PRIMARY_WINDOW_EVALUATION_OR_PROVIDER_SEMANTIC_CHANGE
