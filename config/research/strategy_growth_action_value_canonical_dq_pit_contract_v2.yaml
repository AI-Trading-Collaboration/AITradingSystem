    direction: LESS_THAN_OR_EQUAL
    policy_source: Project Owner pre-empirical DATA_RESEARCH pilot intent; provider cadence and quote_end lineage must be bound by the future run manifest.
    rationale: A two-minute ceiling is a conservative research-freshness pilot that rejects observations materially detached from the decision clock while allowing bounded provider publication latency; it is not execution timing authority.
    intended_effect: Prevent stale option quotes from contributing to derived research aggregates.
    known_risk: Provider cadence or quote_end semantics may make the ceiling too strict or too permissive; results cannot be used to retune it on the same primary window.
