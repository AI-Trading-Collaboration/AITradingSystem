enum_contracts:
  - enum_id: capability_status
    values: [CONFIRMED, CONTRADICTED, UNKNOWN]
  - enum_id: dq_pit_status
    values: [FAIL, NOT_EVALUATED, PASS]
  - enum_id: export_classification
    values: [EXPORT_ALLOWED_DERIVED, EXPORT_PROHIBITED, QC_ONLY_NOT_EXPORTED, UNKNOWN_REQUIRES_LICENSE_REVIEW]
  - enum_id: option_right
    values: [CALL, PUT]
  - enum_id: order_lifecycle
    values: [CANCELED, CREATED, FILLED, PARTIALLY_FILLED, REJECTED, SUBMITTED, UPDATED]
  - enum_id: order_side
    values: [BUY_TO_OPEN, SELL_TO_CLOSE]
  - enum_id: position_lifecycle
    values: [CLOSED, EXIT_BLOCKED, EXIT_PENDING, FLAT, INTENT_PENDING, INVALID_RUN, OPEN, OPEN_PARTIAL, SCOPE_VIOLATION]
  - enum_id: reconciliation_status
    values: [EXPLAINED_DIFFERENCE, FAIL, INCOMPLETE, PASS]
  - enum_id: signal_direction
    values: [FLAT, LONG_CALL, LONG_PUT]

