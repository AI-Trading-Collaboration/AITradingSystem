schema_version: qqq_options_shared_contract_policy.v1
policy_id: qqq_options_shared_contract_v1
policy_version: 1.0.0
status: REVIEWED_ACTIVE_CONTRACT_FREEZE
owner: project_owner
owner_decision: owner_decision:TRADING-2481:2026-08-02:freeze_shared_schema_policy_v1_without_thresholds_or_platform_actions
rationale: Freeze one auditable and fail-closed shared contract before any QuantConnect adapter, replay engine, or investment-facing calibration is implemented.
intended_effect: Keep every later QQQ options module on identical record identity, PIT, DQ, evidence, unit, timezone, lineage, and safety semantics.
validation_plan: Breaking-schema tests, canonical seal and replay tests, policy drift tests, architecture validation, and final repository validation tiers.
review_condition: Review before any schema field, enum, unit, timezone, export class, lifecycle, DQ, PIT, evidence, or safety semantic changes.
expiry_condition: Supersede only through an owner-reviewed versioned contract migration with backward-compatibility evidence.

