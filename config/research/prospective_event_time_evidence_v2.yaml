schema_version: prospective_event_time_evidence_policy.v2
policy_id: prospective_event_time_evidence_v2
policy_version: 2.0.0
status: REVIEWED_ENGINEERING_CONTRACT_ADOPTION_BLOCKED
owner: Project Owner / integration-coordinator
scope_ref: owner_instruction:TRADING-2564:2026-09-07:continue_after_s2c2
requirement_ref: docs/requirements/TRADING-2564_S3b_Clock_Evidence_Correction_V1.md
rationale: >-
  独立 UTC 与 counter 的表示单位不证明二者精度或速率相同。保留原始 UTC 纳秒与完整
  counter 外包络，以共享主机时钟合同计算保守截止准入值，不把正常粗时钟交错误报为回拨。
intended_effect: >-
  区分 payload 持久化观察、witness precommit、原 recorder 返回及完整父 ACK。
  固定 anchor 覆盖锁等待和检查，严格保留下一 XNYS 收盘、lease 到期和原始顺序门禁。
validation_plan: >-
  共享时钟合同、粗时钟交错与真实回拨、严格截止/expiry、前驱 bound、immutable 崩溃
  与只读幂等、v1 retained 兼容；16-worker focused、actual candidate 与绑定失败 parent 的 Full。
review_condition: >-
  首次真实启用、provider/时间合同/日历/首次 F 或 outcome admission 变化须重新审查。
  本政策不授予真实业务、provider PIT、OOS、生产或交易权限。
