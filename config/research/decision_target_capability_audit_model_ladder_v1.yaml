rationale: >-
  先用固定、简单、可解释的模型阶梯判断系统对decision targets的跨fold能力，再由能力约束
  后续策略风格。全部阈值是historical-seen pilot baseline，只用于防止结果驱动解释，不构成
  promotion或收益保证。
intended_effect: >-
  区分broad equity risk premium、Nasdaq leadership、QQQ-defensive allocation与tail-risk
  判断能力；若证据不稳定则保持mixed/no-skill，不创建candidate family。
validation_evidence: >-
  exact input commitment、row-order fail-closed、train-only feature standardization、
  label-maturity/purge/embargo、deterministic ridge、fold metrics、style mapping、tamper与
  double-build测试；真实run必须由content-derived validator重建。
review_condition: >-
  Batch 2完成后由Owner复核。任何label、horizon、feature family、lookback、fold、embargo、
  model、penalty、metric或classification变化必须发布新版本，不得按结果调整v1。
