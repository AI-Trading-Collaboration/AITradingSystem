classification_policy:
  status: TEMPORARY_PILOT_BASELINE
  owner: project_owner_and_research_governance
  rationale: >-
    在historical-seen能力审计中要求多数fold同向、median和pooled rank skill、M0 RMSE增量及正
    quintile spread共同成立；阈值只用于阻止脆弱结果被升级为风格结论。
  review_condition: >-
    Batch 2输出后必须人工复核；任何新family需另立任务，不能直接消费本pilot阈值。
  minimum_valid_folds: 6
  minimum_positive_spearman_folds: 5
  minimum_median_spearman: 0.03
  minimum_pooled_spearman: 0.05
  minimum_median_rmse_improvement_vs_m0: 0.0
  minimum_median_quintile_spread: 0.0
  minimum_median_directional_uplift_vs_m0: 0.0
  minimum_passing_horizons: 2
  required_medium_or_long_horizons:
    - 10d
    - 20d
