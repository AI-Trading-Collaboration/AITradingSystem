rationale: Bind a deterministic synthetic cross-layer scenario corpus to the exact public policy and module authority frozen by TRADING-2481 through TRADING-2490 without presenting synthetic outputs as QuantConnect evidence.
intended_effect: Schema, module, policy, fixture or expected-semantic drift fails closed while the cloud smoke checklist remains blocked until TRADING-2492 receives an independent Owner-reviewed authorization and scope.
validation_plan: Run authority replay, policy and golden tamper, scenario completeness, exact observation, property, canonical replay, checklist authorization and adjacent integration tests before final-tree validation.
review_condition: Review whenever any predecessor public schema/module/policy changes or before TRADING-2492 external pilot preregistration.
expiry_condition: Supersede only through a reviewed tracked policy and golden migration with explicit old-golden retention and final-tree compatibility evidence.
