scenarios:
  - scenario_id: CORPORATE_ACTION_SCOPE_INVALID
    stimulus_class: CORPORATE_ACTION
    terminal_layer: LIFECYCLE
    expected_status: INVALID
    expected_reason_codes: [EXTERNAL_SCOPE_VIOLATION_INVALID_RUN]
    expected_order_count: 0
    expected_fill_count: 0
    cash_preservation_required: true
    run_valid: false
    expected_dq_status: PASS
    expected_pit_status: PASS
    required_artifacts:
      - artifact_role: LIFECYCLE_RESULT
        contract_id: qqq_options_position_lifecycle_result.v1
    evidence_classification: SYNTHETIC_TEST_ONLY_NOT_PLATFORM_EVIDENCE
    caveat: Synthetic corporate-action scope rejection only; no underlying adjustment, option deliverable reconstruction or broker event is executed.
  - scenario_id: CROSSED_QUOTE_INVALID
    stimulus_class: CROSSED_QUOTE
    terminal_layer: INPUT
    expected_status: INVALID
    expected_reason_codes: [CROSSED_QUOTE]
    expected_order_count: 0
    expected_fill_count: 0
    cash_preservation_required: true
    run_valid: false
    expected_dq_status: NOT_EVALUATED
    expected_pit_status: NOT_EVALUATED
    required_artifacts:
      - artifact_role: SELECTION_INPUT_VALIDATION
        contract_id: QQQOptionSelectionCandidateInput.validation.v1
    evidence_classification: SYNTHETIC_TEST_ONLY_NOT_PLATFORM_EVIDENCE
    caveat: Synthetic input validation failure; no quote is repaired and no order is created.
  - scenario_id: INSUFFICIENT_SETTLED_CASH
    stimulus_class: INSUFFICIENT_CASH
    terminal_layer: ACCOUNTING
    expected_status: REJECTED
    expected_reason_codes: [INSUFFICIENT_SETTLED_CASH]
    expected_order_count: 1
    expected_fill_count: 0
    cash_preservation_required: true
    run_valid: false
    expected_dq_status: PASS
    expected_pit_status: PASS
    required_artifacts:
      - artifact_role: ACCOUNTING_RESULT
        contract_id: qqq_options_cash_accounting_result.v1
    evidence_classification: SYNTHETIC_TEST_ONLY_NOT_PLATFORM_EVIDENCE
    caveat: Synthetic settled-cash rejection only; it is not a reviewed position-size or premium-budget policy.
  - scenario_id: ITM_EXPIRY_SCOPE_INVALID
    stimulus_class: ITM_EXPIRY
    terminal_layer: LIFECYCLE
    expected_status: INVALID
    expected_reason_codes: [EXPIRY_SCOPE_VIOLATION_INVALID_RUN]
    expected_order_count: 0
    expected_fill_count: 0
    cash_preservation_required: true
    run_valid: false
    expected_dq_status: PASS
    expected_pit_status: PASS
    required_artifacts:
      - artifact_role: LIFECYCLE_RESULT
        contract_id: qqq_options_position_lifecycle_result.v1
    evidence_classification: SYNTHETIC_TEST_ONLY_NOT_PLATFORM_EVIDENCE
    caveat: Synthetic ITM expiry scope invalidation only; exercise, assignment and underlying delivery remain prohibited.
  - scenario_id: MISSING_QUOTE_INVALID
    stimulus_class: MISSING_QUOTE
    terminal_layer: INPUT
    expected_status: INVALID
    expected_reason_codes: [MISSING_QUOTE_FIELD]
    expected_order_count: 0
    expected_fill_count: 0
    cash_preservation_required: true
    run_valid: false
    expected_dq_status: NOT_EVALUATED
    expected_pit_status: NOT_EVALUATED
    required_artifacts:
      - artifact_role: SELECTION_INPUT_VALIDATION
        contract_id: QQQOptionSelectionCandidateInput.validation.v1
    evidence_classification: SYNTHETIC_TEST_ONLY_NOT_PLATFORM_EVIDENCE
    caveat: Synthetic missing-quote rejection only; no daily close or same-bar fallback is permitted.
  - scenario_id: NO_ELIGIBLE_CONTRACT_CASH
    stimulus_class: NO_CONTRACT
    terminal_layer: SELECTION
    expected_status: BLOCKED
    expected_reason_codes: [NO_ELIGIBLE_CONTRACT_CASH]
    expected_order_count: 0
    expected_fill_count: 0
    cash_preservation_required: true
    run_valid: true
    expected_dq_status: PASS
    expected_pit_status: PASS
    required_artifacts:
      - artifact_role: SELECTION_RESULT
        contract_id: QQQOptionSelectionResult.canonical_bytes.v1
    evidence_classification: SYNTHETIC_TEST_ONLY_NOT_PLATFORM_EVIDENCE
    caveat: Synthetic no-contract cash-preservation disposition; selection bounds are not widened.
  - scenario_id: PARTIAL_FILL_CANCELED
    stimulus_class: PARTIAL_FILL
    terminal_layer: EXECUTION
    expected_status: PARTIAL
    expected_reason_codes: [PARTIAL_CANCELED]
    expected_order_count: 1
    expected_fill_count: 1
    cash_preservation_required: false
    run_valid: true
    expected_dq_status: PASS
    expected_pit_status: PASS
    required_artifacts:
      - artifact_role: EXECUTION_RESULT
        contract_id: qqq_options_minute_execution_result.v1
    evidence_classification: SYNTHETIC_TEST_ONLY_NOT_PLATFORM_EVIDENCE
    caveat: Synthetic partial-fill replay; latency, slippage, fee and partial-fill numeric baselines remain unresolved policy.
  - scenario_id: STALE_QUOTE_REJECTED
    stimulus_class: STALE_QUOTE
    terminal_layer: SELECTION
    expected_status: REJECTED
    expected_reason_codes: [QUOTE_TOO_OLD]
    expected_order_count: 0
    expected_fill_count: 0
    cash_preservation_required: true
    run_valid: true
    expected_dq_status: PASS
    expected_pit_status: PASS
    required_artifacts:
      - artifact_role: SELECTION_RESULT
        contract_id: QQQOptionSelectionResult.canonical_bytes.v1
    evidence_classification: SYNTHETIC_TEST_ONLY_NOT_PLATFORM_EVIDENCE
    caveat: Synthetic stale-quote rejection; quote freshness threshold remains inherited and is not recalibrated here.
  - scenario_id: VALID_CROSS_LAYER_SYNTHETIC
    stimulus_class: VALID
    terminal_layer: RECONCILIATION
    expected_status: READY_FOR_OWNER_REVIEW
    expected_reason_codes: [LOCAL_RECONCILIATION_READY_FOR_OWNER_REVIEW]
    expected_order_count: 1
    expected_fill_count: 1
    cash_preservation_required: false
    run_valid: true
    expected_dq_status: PASS
    expected_pit_status: PASS
    required_artifacts:
      - artifact_role: ACCOUNTING_RESULT
        contract_id: qqq_options_cash_accounting_result.v1
      - artifact_role: EXECUTION_RESULT
        contract_id: qqq_options_minute_execution_result.v1
      - artifact_role: LIFECYCLE_RESULT
        contract_id: qqq_options_position_lifecycle_result.v1
      - artifact_role: RECONCILIATION_RESULT
        contract_id: qc_qqq_options_local_reconciliation_result.v1
      - artifact_role: SELECTION_RESULT
        contract_id: QQQOptionSelectionResult.canonical_bytes.v1
    evidence_classification: SYNTHETIC_TEST_ONLY_NOT_PLATFORM_EVIDENCE
    caveat: Synthetic mechanics-only cross-layer success; it is not QuantConnect evidence, strategy validity or pilot authorization.
  - scenario_id: VENUE_REJECTED_CASH
    stimulus_class: VENUE_REJECT
    terminal_layer: EXECUTION
    expected_status: REJECTED
    expected_reason_codes: [VENUE_REJECTED]
    expected_order_count: 1
    expected_fill_count: 0
    cash_preservation_required: true
    run_valid: true
    expected_dq_status: PASS
    expected_pit_status: PASS
    required_artifacts:
      - artifact_role: EXECUTION_RESULT
        contract_id: qqq_options_minute_execution_result.v1
    evidence_classification: SYNTHETIC_TEST_ONLY_NOT_PLATFORM_EVIDENCE
    caveat: Synthetic venue rejection; it does not assert real engine or broker behavior.
