schema_version: research_window_registry.v1
policy_id: research_window_registry_v1
status: pilot_baseline
owner: research_governance
policy_metadata:
  rationale: >
    Single-window QQQ/SGOV/TQQQ research since 2022-12-01 is too short for
    first-layer and second-layer validation. Multi-window research separates
    exact validated, primary-only sensitivity, legacy comparison and metadata
    ranges so conclusions do not mix incompatible data-quality contracts.
  intended_effect: >
    Make every new research artifact carry a research_window_id, requested start,
    actual portfolio start, window role and data-quality contract.
  validation_evidence: >
    TRADING-1646 to 1665 tests cover exact/proxy separation, SGOV inception start
    adjustment, primary-only extension caveat and required window metadata.
  review_condition: >
    Review before making any non-legacy window the default for promotion-style
    interpretation or before introducing proxy robustness results. The QQQ
    long-history windows (TRADING-2567) are reviewed when the long-history
    snapshot check fails or the first preregistered question reaches a verdict.
windows:
  exact_three_asset_validated:
    start: 2021-02-22
    end: latest
    requested_start: 2021-02-22
    actual_start: 2021-02-22
    actual_portfolio_start: 2021-02-22
    role: primary_validated
    assets: [QQQ, SGOV, TQQQ]
    exact_or_proxy: exact
    data_quality_contract: secondary_cross_checked
    primary_prices: available
    secondary_price_cross_check: substantially_available
    fred_rates: available
    allowed_usage:
      - main_actual_path_ranking
      - dynamic_second_layer_probe_validation
      - first_layer_trend_calibration
      - owner_review_evidence
      - qqq_question_consistency_check
    blocked_usage:
      - production
      - paper_shadow
      - broker_order
    caveats:
      - still_short_sample
      - reused_by_about_860_research_tasks_before_2026_10
      - does_not_cover_2020_covid_crash
  exact_three_asset_primary_only_extension:
    start: 2020-05-28
    end: latest
    requested_start: 2020-05-28
    actual_start: 2020-05-28
    actual_portfolio_start: 2020-05-28
    role: sensitivity
    assets: [QQQ, SGOV, TQQQ]
    exact_or_proxy: exact
    data_quality_contract: primary_only_for_sgov_before_2021_02_22
    primary_prices: available
    secondary_price_cross_check:
      QQQ: available
      TQQQ: mostly_available
      SGOV: unavailable_before_2021_02_22
    fred_rates: available
    allowed_usage:
      - robustness_check
      - sensitivity_analysis
      - longer_exact_primary_three_asset_study
    blocked_usage:
      - primary_leaderboard_without_owner_accepting_caveat
      - production
      - paper_shadow
      - broker_order
    caveats:
      - sgov_secondary_gap_2020_05_28_to_2021_02_19
      - primary_only_extension_not_primary_leaderboard
  legacy_research_window_2022_12:
    start: 2022-12-01
    end: latest
    requested_start: 2022-12-01
    actual_start: 2022-12-01
    actual_portfolio_start: 2022-12-01
    role: legacy_comparison
    assets: [QQQ, SGOV, TQQQ]
    exact_or_proxy: exact
    data_quality_contract: legacy_ai_after_chatgpt_window
    primary_prices: available
    secondary_price_cross_check: available_for_legacy_window
    fred_rates: available
    allowed_usage:
      - legacy_comparison
      - ai_after_chatgpt_comparison
    blocked_usage:
      - sole_basis_for_new_multi_window_conclusion
      - production
      - paper_shadow
      - broker_order
    caveats:
      - short_window
      - may_overweight_2023_ai_tech_strength
  requested_sgov_inception_range:
    requested_start: 2020-05-26
    start: 2020-05-26
    end: latest
    actual_start: 2020-05-26
    actual_portfolio_start: 2020-05-28
    role: metadata_only
    assets: [QQQ, SGOV, TQQQ]
    exact_or_proxy: metadata_only
    data_quality_contract: requested_inception_metadata_only
    allowed_usage:
      - requested_range_metadata
      - data_availability_explanation
    blocked_usage:
      - portfolio_return_before_2020_05_28
      - exact_leaderboard
      - production
      - paper_shadow
      - broker_order
    caveats:
      - sgov_primary_missing_2020_05_26_and_2020_05_27
  qqq_tqqq_sgov_proxy_robustness:
    start: 2010-02-09
    end: latest
    requested_start: 2010-02-09
    actual_start: 2010-02-09
    actual_portfolio_start: 2010-02-09
    role: proxy_robustness
    assets: [QQQ, TQQQ, SGOV_PROXY]
    exact_or_proxy: proxy
    data_quality_contract: proxy_robustness_only
    proxy_options:
      - BIL
      - T-bill cash return
    allowed_usage:
      - robustness_only
      - first_layer_longer_sample_diagnostic
    blocked_usage:
      - exact_sgov_promotion_evidence
      - exact_three_asset_leaderboard
      - production
      - paper_shadow
      - broker_order
    caveats:
      - proxy_not_exact_sgov
      - not_mixed_with_exact_leaderboard
  # QQQ-type questions (TRADING-2567, owner_decision:TRADING-2567:2026-10-12:qqq_direction_1999_window):
  # develop on the first window, read the second once per preregistered question, then check
  # consistency on exact_three_asset_validated and confirm on the forward record. Roles per question
  # type are in primary_research_window_policy.yaml (question_windows).
  qqq_long_history_development:
    start: 1999-03-10
    end: 2010-12-31
    requested_start: 1999-03-10
    actual_start: 1999-03-10
    actual_portfolio_start: 1999-03-10
    role: development
    question_types: [qqq_direction]
    assets: [QQQ_PROXY_NDX_TR, CASH_DTB3, SYNTHETIC_2X, SYNTHETIC_3X]
    exact_or_proxy: proxy
    data_quality_contract: qqq_long_history_snapshot_check
    data_source: fred_qqq_long_history_research
    data_spec: config/research/qqq_long_history.yaml
    lookback_history_from: 1986-01-02
    allowed_usage:
      - signal_development
      - parameter_selection
      - falsification_tests
    blocked_usage:
      - promotion_evidence
      - production
      - paper_shadow
      - broker_order
    caveats:
      - index_total_return_proxy_not_qqq_etf_price
      - synthetic_leveraged_funds_are_hypothetical_before_qld_2006_06_and_tqqq_2010_02
      - vxn_unavailable_before_2001_02_02
      - cash_proxy_dtb3_not_sgov
  qqq_long_history_validation:
    start: 2011-01-03
    end: 2021-02-19
    requested_start: 2011-01-03
    actual_start: 2011-01-03
    actual_portfolio_start: 2011-01-03
    role: validation
    question_types: [qqq_direction]
    assets: [QQQ_PROXY_NDX_TR, CASH_DTB3, SYNTHETIC_2X, SYNTHETIC_3X]
    exact_or_proxy: proxy
    data_quality_contract: qqq_long_history_snapshot_check
    data_source: fred_qqq_long_history_research
    data_spec: config/research/qqq_long_history.yaml
    read_policy: once_per_preregistered_question
    allowed_usage:
      - preregistered_validation_read
    blocked_usage:
      - signal_development
      - parameter_selection
      - repeated_read_after_result_seen
      - promotion_evidence
      - production
      - paper_shadow
      - broker_order
    caveats:
      - index_total_return_proxy_not_qqq_etf_price
      - synthetic_2x_3x_track_real_funds_with_cost_assumptions
      - cash_proxy_dtb3_not_sgov
  # Trial mode of the research loop (TRADING-2565, owner_decision:TRADING-2565:2026-10-15:trial_mode):
  # a screened candidate is tried on the US market before any question is opened. Development only:
  # this type has no validation or consistency window. It ends where the QQQ development window ends,
  # because after 2010 the US market moves with QQQ and reading it would read QQQ's validation window.
  # It starts in 1929 so that a signal scored by its expanding percentile (252 values of warm-up after
  # its own lookback) has a value on the first day; the Ken French data start on 1926-07-01.
  us_market_1929_2010:
    start: 1929-01-02
    end: 2010-12-31
    requested_start: 1929-01-02
    actual_start: 1929-01-02
    actual_portfolio_start: 1929-01-02
    role: development
    question_types: [us_market_trial]
    assets: [US_MARKET_KEN_FRENCH, CASH_KEN_FRENCH_RF]
    exact_or_proxy: proxy
    data_quality_contract: signal_snapshot_check
    data_source: ken_french_ff_factors_daily
    data_spec: config/research/research_screen.yaml
    lookback_history_from: 1926-07-01
    allowed_usage:
      - candidate_trial
      - falsification_tests
    blocked_usage:
      - validation_read
      - promotion_evidence
      - production
      - paper_shadow
      - broker_order
    caveats:
      - ken_french_value_weighted_us_market_not_qqq
      - synthetic_2x_3x_without_fees_never_held_by_a_trial
      - ken_french_daily_data_revised_between_snapshots
  # Stock-bond trial (TRADING-2567 P1, owner_decision:TRADING-2567:2026-10-18:portfolio_p1): the US
  # market with a synthetic ten-year Treasury priced from FRED DGS10 in place of cash. Development
  # only, like us_market_1929_2010, and it ends there too. It starts on DGS10's first day, so it has
  # 49 years, still at least the 40 the two-stage ruler needs.
  us_market_1962_2010:
    start: 1962-01-02
    end: 2010-12-31
    requested_start: 1962-01-02
    actual_start: 1962-01-02
    actual_portfolio_start: 1962-01-02
    role: development
    question_types: [us_market_bond_trial]
    assets: [US_MARKET_KEN_FRENCH, CASH_KEN_FRENCH_RF, TREASURY_10Y_SYNTHETIC_DGS10]
    exact_or_proxy: proxy
    data_quality_contract: signal_snapshot_check
    data_source: ken_french_ff_factors_daily_and_fred_dgs10
    data_spec: config/research/research_screen.yaml
    lookback_history_from: 1962-01-02
    allowed_usage:
      - candidate_trial
      - falsification_tests
    blocked_usage:
      - validation_read
      - promotion_evidence
      - production
      - paper_shadow
      - broker_order
    caveats:
      - ken_french_value_weighted_us_market_not_qqq
      - synthetic_2x_3x_without_fees_never_held_by_a_trial
      - ken_french_daily_data_revised_between_snapshots
      - treasury_synthetic_constant_maturity_par_bond_without_fees
  # Baker's print-only read of the 200-day pullback rule on QQQ's own index before QQQ traded
  # (TRADING-2565-107, owner_decision:TRADING-2565:2026-11-02:ndx_price_1986_1999): the FRED
  # Nasdaq-100 price index from its first date to the day before qqq_long_history_development
  # starts. research_probes/entry_timing_ndx.py reads it; no question type, trial gate or
  # screen uses it. The price index carries no dividends, and the 200-day average warms up inside
  # the window. Once read, the span is no longer unseen history for the entry-timing family
  # (period 7 charter, section 5.2). Baker then chose a second read for the QQQ exit family
  # (TRADING-2565-111, owner_decision:TRADING-2565:2026-11-02:exit_family_ndx_1986_1999):
  # research_probes/exit_rules_ndx.py prints the exit family's price list here with the rules and
  # stop factor frozen on QQQ 2000-2010. Once read, the span is no longer unseen history for the
  # exit family either. Baker then chose a third read for the same family (TRADING-2565-113,
  # owner_decision:TRADING-2565:2026-11-02:exit_family_after_signal):
  # research_probes/exit_rules_after.py prints how far the price falls in the 20 closes after each
  # exit signal, beside every day of the span, with the same entries, rules and stop factor.
  # Baker then chose a fourth read for the same family (TRADING-2565-117,
  # owner_decision:TRADING-2565:2026-11-02:exit_family_big_declines):
  # research_probes/exit_rules_declines.py marks each decline of at least 15% on closes after
  # the fact and prints, for a holder who kept the position through the peak, when the price
  # rules X2 to X5 first fire, how far the price had fallen by then and how much of the rest of
  # the fall the next-close sale avoids. The marking enters no rule. Baker then chose a fifth
  # read, for the entry-timing family and the exit family together (TRADING-2565-122,
  # owner_decision:TRADING-2565:2026-11-03:structure_shift_other_periods):
  # research_probes/structure_shift_periods.py prints TRADING-2565-120's frozen structure-shift
  # entry and strategy here, with the comparison rows Baker added before the run.
  ndx_price_1986_1999:
    start: 1986-01-02
    end: 1999-03-09
    requested_start: 1986-01-02
    actual_start: 1986-01-02
    actual_portfolio_start: 1986-01-02
    role: owner_print_only
    question_types: []
    assets: [NDX_PRICE_INDEX]
    exact_or_proxy: proxy
    data_quality_contract: qqq_long_history_snapshot_check
    data_source: fred_qqq_long_history_research
    data_spec: config/research/qqq_long_history.yaml
    data_column: ndx_price
    read_policy: once_per_owner_decision
    allowed_usage:
      - owner_requested_print_only_read
    blocked_usage:
      - signal_development
      - parameter_selection
      - validation_read
      - trial_or_screen
      - promotion_evidence
      - production
      - paper_shadow
      - broker_order
    caveats:
      - nasdaq_100_price_index_without_dividends
      - qqq_etf_trades_from_1999_03_10
      - fred_carries_the_price_index_over_some_closed_sessions
      - the_200_day_average_warms_up_inside_the_window
  # Baker's one-time print-only read of QQQ after 2010 (TRADING-2565-122,
  # owner_decision:TRADING-2565:2026-11-03:structure_shift_other_periods): the long-history
  # snapshot's actual QQQ series (the one the period 7 probes use) from 2011-01-03 to its last
  # close, with the 1999-2010 closes as lookback only. research_probes/structure_shift_periods.py
  # reads it once to print TRADING-2565-120's frozen structure-shift strategy and the comparison
  # rows Baker added before the run; no question type, trial gate or screen uses it. The span
  # overlaps qqq_long_history_validation and the consistency window, so this read is a one-time
  # exception to the period 7 charter, sections 5.2 and 11, approved by Baker's owner-decision
  # record. Once read, QQQ after 2010 is seen history for the entry-timing family and the exit
  # family (X2, X3 and the rest): no unseen QQQ history is left for them. The forward ledger and
  # the 200-day forward record use closes after their own start dates and are not affected.
  qqq_after_2010_owner_print:
    start: 2011-01-03
    end: latest
    requested_start: 2011-01-03
    actual_start: 2011-01-03
    actual_portfolio_start: 2011-01-03
    role: owner_print_only
    question_types: []
    assets: [QQQ]
    exact_or_proxy: exact
    data_quality_contract: qqq_long_history_snapshot_check
    data_source: fred_qqq_long_history_research
    data_spec: config/research/qqq_long_history.yaml
    data_column: etf_reference_return
    lookback_history_from: 1999-03-10
    read_policy: once_per_owner_decision
    allowed_usage:
      - owner_requested_print_only_read
    blocked_usage:
      - signal_development
      - parameter_selection
      - validation_read
      - trial_or_screen
      - promotion_evidence
      - production
      - paper_shadow
      - broker_order
    caveats:
      - overlaps_qqq_long_history_validation_and_the_consistency_window
      - period_7_charter_one_time_exception
      - after_this_read_2011_onward_is_seen_history_for_the_entry_timing_and_exit_families
      - qqq_adjusted_close_on_the_snapshot_calendar
safety_boundary:
  research_only: true
  actual_path_required: true
  target_path_metrics_role: diagnostic_only
  promotion_allowed: false
  paper_shadow_allowed: false
  production_allowed: false
  broker_action: none
  production_effect: none
  dynamic_promotion_status: BLOCKED
  manual_review_required: true
