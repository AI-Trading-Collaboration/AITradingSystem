schema_version: research_window_registry.v1
policy_id: research_window_registry_v1
status: pilot_baseline
owner: research_governance
policy_metadata:
  rationale: >
    Single-window QQQ/SGOV/TQQQ research since 2022-12-01 is too short for
    first-layer and second-layer validation. Multi-window research separates
    exact validated, primary-only sensitivity, legacy comparison and metadata
    ranges so conclusions do not mix incompatible data-quality contracts.
  intended_effect: >
    Make every new research artifact carry a research_window_id, requested start,
    actual portfolio start, window role and data-quality contract.
  validation_evidence: >
    TRADING-1646 to 1665 tests cover exact/proxy separation, SGOV inception start
    adjustment, primary-only extension caveat and required window metadata.
  review_condition: >
    Review before making any non-legacy window the default for promotion-style
    interpretation or before introducing proxy robustness results. The QQQ
    long-history windows (TRADING-2567) are reviewed when the long-history
    snapshot check fails or the first preregistered question reaches a verdict.
windows:
  exact_three_asset_validated:
    start: 2021-02-22
    end: latest
    requested_start: 2021-02-22
    actual_start: 2021-02-22
    actual_portfolio_start: 2021-02-22
    role: primary_validated
    assets: [QQQ, SGOV, TQQQ]
    exact_or_proxy: exact
    data_quality_contract: secondary_cross_checked
    primary_prices: available
    secondary_price_cross_check: substantially_available
    fred_rates: available
    allowed_usage:
      - main_actual_path_ranking
      - dynamic_second_layer_probe_validation
      - first_layer_trend_calibration
      - owner_review_evidence
      - qqq_question_consistency_check
    blocked_usage:
      - production
      - paper_shadow
      - broker_order
    caveats:
      - still_short_sample
      - reused_by_about_860_research_tasks_before_2026_10
      - does_not_cover_2020_covid_crash
  exact_three_asset_primary_only_extension:
    start: 2020-05-28
    end: latest
    requested_start: 2020-05-28
    actual_start: 2020-05-28
    actual_portfolio_start: 2020-05-28
    role: sensitivity
    assets: [QQQ, SGOV, TQQQ]
    exact_or_proxy: exact
    data_quality_contract: primary_only_for_sgov_before_2021_02_22
    primary_prices: available
    secondary_price_cross_check:
      QQQ: available
      TQQQ: mostly_available
      SGOV: unavailable_before_2021_02_22
    fred_rates: available
    allowed_usage:
      - robustness_check
      - sensitivity_analysis
      - longer_exact_primary_three_asset_study
    blocked_usage:
      - primary_leaderboard_without_owner_accepting_caveat
      - production
      - paper_shadow
      - broker_order
    caveats:
      - sgov_secondary_gap_2020_05_28_to_2021_02_19
      - primary_only_extension_not_primary_leaderboard
  legacy_research_window_2022_12:
    start: 2022-12-01
    end: latest
    requested_start: 2022-12-01
    actual_start: 2022-12-01
    actual_portfolio_start: 2022-12-01
    role: legacy_comparison
    assets: [QQQ, SGOV, TQQQ]
    exact_or_proxy: exact
    data_quality_contract: legacy_ai_after_chatgpt_window
    primary_prices: available
    secondary_price_cross_check: available_for_legacy_window
    fred_rates: available
    allowed_usage:
      - legacy_comparison
      - ai_after_chatgpt_comparison
    blocked_usage:
      - sole_basis_for_new_multi_window_conclusion
      - production
      - paper_shadow
      - broker_order
    caveats:
      - short_window
      - may_overweight_2023_ai_tech_strength
  requested_sgov_inception_range:
    requested_start: 2020-05-26
    start: 2020-05-26
    end: latest
    actual_start: 2020-05-26
    actual_portfolio_start: 2020-05-28
    role: metadata_only
    assets: [QQQ, SGOV, TQQQ]
    exact_or_proxy: metadata_only
    data_quality_contract: requested_inception_metadata_only
    allowed_usage:
      - requested_range_metadata
      - data_availability_explanation
    blocked_usage:
      - portfolio_return_before_2020_05_28
      - exact_leaderboard
      - production
      - paper_shadow
      - broker_order
    caveats:
      - sgov_primary_missing_2020_05_26_and_2020_05_27
  qqq_tqqq_sgov_proxy_robustness:
    start: 2010-02-09
    end: latest
    requested_start: 2010-02-09
    actual_start: 2010-02-09
    actual_portfolio_start: 2010-02-09
    role: proxy_robustness
    assets: [QQQ, TQQQ, SGOV_PROXY]
    exact_or_proxy: proxy
    data_quality_contract: proxy_robustness_only
    proxy_options:
      - BIL
      - T-bill cash return
    allowed_usage:
      - robustness_only
      - first_layer_longer_sample_diagnostic
    blocked_usage:
      - exact_sgov_promotion_evidence
      - exact_three_asset_leaderboard
      - production
      - paper_shadow
      - broker_order
    caveats:
      - proxy_not_exact_sgov
      - not_mixed_with_exact_leaderboard
  # QQQ-type questions (TRADING-2567, owner_decision:TRADING-2567:2026-10-12:qqq_direction_1999_window):
  # develop on the first window, read the second once per preregistered question, then check
  # consistency on exact_three_asset_validated and confirm on the forward record. Roles per question
  # type are in primary_research_window_policy.yaml (question_windows).
  qqq_long_history_development:
    start: 1999-03-10
    end: 2010-12-31
    requested_start: 1999-03-10
    actual_start: 1999-03-10
    actual_portfolio_start: 1999-03-10
    role: development
    question_types: [qqq_direction]
    assets: [QQQ_PROXY_NDX_TR, CASH_DTB3, SYNTHETIC_2X, SYNTHETIC_3X]
    exact_or_proxy: proxy
    data_quality_contract: qqq_long_history_snapshot_check
    data_source: fred_qqq_long_history_research
    data_spec: config/research/qqq_long_history.yaml
    lookback_history_from: 1986-01-02
    allowed_usage:
      - signal_development
      - parameter_selection
      - falsification_tests
    blocked_usage:
      - promotion_evidence
      - production
      - paper_shadow
      - broker_order
    caveats:
      - index_total_return_proxy_not_qqq_etf_price
      - synthetic_leveraged_funds_are_hypothetical_before_qld_2006_06_and_tqqq_2010_02
      - vxn_unavailable_before_2001_02_02
      - cash_proxy_dtb3_not_sgov
  qqq_long_history_validation:
    start: 2011-01-03
    end: 2021-02-19
    requested_start: 2011-01-03
    actual_start: 2011-01-03
    actual_portfolio_start: 2011-01-03
    role: validation
    question_types: [qqq_direction]
    assets: [QQQ_PROXY_NDX_TR, CASH_DTB3, SYNTHETIC_2X, SYNTHETIC_3X]
    exact_or_proxy: proxy
    data_quality_contract: qqq_long_history_snapshot_check
    data_source: fred_qqq_long_history_research
    data_spec: config/research/qqq_long_history.yaml
    read_policy: once_per_preregistered_question
    allowed_usage:
      - preregistered_validation_read
    blocked_usage:
      - signal_development
      - parameter_selection
      - repeated_read_after_result_seen
      - promotion_evidence
      - production
      - paper_shadow
      - broker_order
    caveats:
      - index_total_return_proxy_not_qqq_etf_price
      - synthetic_2x_3x_track_real_funds_with_cost_assumptions
      - cash_proxy_dtb3_not_sgov
  # Trial mode of the research loop (TRADING-2565, owner_decision:TRADING-2565:2026-10-15:trial_mode):
  # a screened candidate is tried on the US market before any question is opened. Development only:
  # this type has no validation or consistency window. It ends where the QQQ development window ends,
  # because after 2010 the US market moves with QQQ and reading it would read QQQ's validation window.
  # It starts in 1929 so that a signal scored by its expanding percentile (252 values of warm-up after
  # its own lookback) has a value on the first day; the Ken French data start on 1926-07-01.
  us_market_1929_2010:
    start: 1929-01-02
    end: 2010-12-31
    requested_start: 1929-01-02
    actual_start: 1929-01-02
    actual_portfolio_start: 1929-01-02
    role: development
    question_types: [us_market_trial]
    assets: [US_MARKET_KEN_FRENCH, CASH_KEN_FRENCH_RF]
    exact_or_proxy: proxy
    data_quality_contract: signal_snapshot_check
    data_source: ken_french_ff_factors_daily
    data_spec: config/research/research_screen.yaml
    lookback_history_from: 1926-07-01
    allowed_usage:
      - candidate_trial
      - falsification_tests
    blocked_usage:
      - validation_read
      - promotion_evidence
      - production
      - paper_shadow
      - broker_order
    caveats:
      - ken_french_value_weighted_us_market_not_qqq
      - synthetic_2x_3x_without_fees_never_held_by_a_trial
      - ken_french_daily_data_revised_between_snapshots
safety_boundary:
  research_only: true
  actual_path_required: true
  target_path_metrics_role: diagnostic_only
  promotion_allowed: false
  paper_shadow_allowed: false
  production_allowed: false
  broker_action: none
  production_effect: none
  dynamic_promotion_status: BLOCKED
  manual_review_required: true
