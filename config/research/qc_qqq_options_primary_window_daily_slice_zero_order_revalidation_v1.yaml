root_cause_hypotheses:
- hypothesis_id: H1_DAILY_SLICE_DELIVERY
  status: UNVERIFIED_PRIMARY_HYPOTHESIS
  finding: The failed run's scheduled 09:31 callback observed no chain; causality relative to DAILY Slice delivery remains unverified.
  successor_test: Read the canonical option-chain key only from on_data Slice delivery.
- hypothesis_id: H2_OPTION_CONTRACT_UNDERLYING_ACCESSOR
  status: CONFIRMED_OFFLINE_CODE_DEFECT
  finding: The 2519 successor reads contract.underlying, but LEAN OptionContract exposes underlying_last_price.
  successor_test: Require finite positive contract.underlying_last_price and reject legacy fixture-only underlying.
- hypothesis_id: H3_DAILY_TIME_FRONTIER_IDENTITY
  status: UNVERIFIED_GUARDED_HYPOTHESIS
  finding: Session identity must be bound to precise daily market-close Slice time, not an assumed scheduled wall-clock.
  successor_test: Explicitly enable daily_precise_end_time and bind session to data.time.date().
- hypothesis_id: H4_TRANSPORT_AND_COVERAGE
  status: UNVERIFIED_RESULT_HYPOTHESIS
  finding: Even with a delivered chain, quote/Greeks/OI/volume or exact 1202-session transport may still fail closed.
  successor_test: Preserve strict candidate checks and emit export-safe diagnostic counts without raw option rows.
