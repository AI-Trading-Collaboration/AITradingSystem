owner_authorization_id: owner_decision:TRADING-2480:2026-08-04:authorize_single_no_order_qc_capability_discovery_run_v1
platform: QuantConnect
run_role: CAPABILITY_DISCOVERY_NO_ORDER_NOT_RESEARCH_CONCLUSION
authorization_effective_date: 2026-08-04
rationale: >-
  The read-only account probe could not close QQQ-specific entitlement, engine,
  runtime or result-artifact facts. One content-bound no-order Free Cloud run is
  the smallest reviewed action that can collect those facts without activating
  selection, execution, accounting, lifecycle or investment interpretation.
intended_effect: >-
  Permit exactly one cash-preserving capability-discovery attempt while retaining
  the prior blocked admission receipt and failing closed on paid resources, raw
  data export, orders, fills, positions, a second run or any broader platform use.
validation_plan: >-
  Strictly replay all bound predecessor bytes and hashes, reviewed calendar and
  historical-window facts, exact scope, actor separation, allowed/prohibited
  actions and safety invariants before the authorization can be used.
review_condition: >-
  Review again before changing the date, runtime, compute budget, project or run
  count, order or contract boundary, actor identities, evidence/export scope or
  any downstream pilot readiness conclusion.
expiry_condition: >-
  Expire at the earliest of the first cloud-run terminal state, completion of the
  first evidence capture, Owner revocation or any boundary violation; do not
  delete the isolated project before independent review completes.
revocation_condition: >-
  The Project Owner may revoke before submission, and the coordinator must stop
  immediately on paid or upgrade prompts, scope drift, identity mismatch, raw-row
  exposure, an order or fill, or unavailable export-safe evidence.
