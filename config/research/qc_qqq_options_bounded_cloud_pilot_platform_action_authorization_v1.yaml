  Require new Owner authorization before changing any date, project/run/order/
  contract/resource bound, selection/execution/accounting/lifecycle value,
  collector/reviewer identity, evidence scope or prohibited action.
expiry_condition: >-
  Expire at the earliest of 2026-08-12T00:00:00Z, first cloud-run terminal,
  completed evidence collection, Owner revocation or any scope violation.
revocation_condition: >-
  Stop before further action on hash or project-source drift, tier/compute
  mismatch, paid prompt, stale/missing/crossed quote, DQ/PIT failure, unexpected
  exercise/assignment/corporate action, raw-row exposure or unexplained
  reconciliation difference.
