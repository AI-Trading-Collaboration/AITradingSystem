owner: project_owner
approval_ref: owner_instruction:TRADING-2555:2026-09-03:continue_foundational_validation
policy_metadata:
  rationale: >-
    TRADING-2550 retained a narrow QQQ/cash timing signal on a reused development
    window, while Web Pro identified unresolved episode concentration, serial
    dependence, cost/carry sensitivity and policy-consumption drift. Freeze those
    diagnostics before any new result is computed so an unfavorable result cannot
    be repaired through post-result selection.
  intended_effect: >-
    Permit one separately registered local foundational falsification run without
    changing the signal, model, threshold, comparator, primary window or decision
    boundary, while keeping QQQ Options Wave B/C and every production path closed.
  validation_plan:
    - strict policy and authority identity replay
    - exact diagnostic inventory and reducer fixture tests
    - negative tests for window, block, cost, axis and safety drift
    - focused parallel pytest and applicable formal validation
  review_condition: >-
    Any change after empirical diagnostics become visible requires a separately
    versioned contract and must disclose the visible result; V1 cannot be edited
    to rescue or promote the signal.

