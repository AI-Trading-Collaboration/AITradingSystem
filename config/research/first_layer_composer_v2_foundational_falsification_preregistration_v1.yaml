    - ANY_BOOTSTRAP_2_5_PERCENTILE_LESS_THAN_OR_EQUAL_TO_ZERO
    - ANY_LEAVE_ONE_CALENDAR_YEAR_OUT_EXCESS_LESS_THAN_OR_EQUAL_TO_ZERO
  pass_if_all:
