    - DQ_OR_PIT_NOT_PASS
    - WINDOW_OR_SESSION_COUNT_MISMATCH
    - SIGNAL_LAG_OR_COMPARATOR_MISMATCH
    - MANIFEST_OR_INDEPENDENT_REPLAY_NOT_PASS
