    - ALL_REQUIRED_DIAGNOSTICS_COMPLETE
    - PRIMARY_5_BPS_PAIRED_EXCESS_STRICTLY_GREATER_THAN_ZERO
    - BOTH_BOOTSTRAP_2_5_PERCENTILES_STRICTLY_GREATER_THAN_ZERO
    - ALL_LEAVE_ONE_CALENDAR_YEAR_OUT_EXCESSES_STRICTLY_GREATER_THAN_ZERO
  conclusion_by_status:
    INVALID: FOUNDATIONAL_EVIDENCE_INVALID
    FAIL: FOUNDATIONAL_NARROW_SIGNAL_VALUE_FAILED_STOP_NO_RESCUE
    INSUFFICIENT: FOUNDATIONAL_NARROW_SIGNAL_VALUE_INSUFFICIENT_HOLD
    PASS: FOUNDATIONAL_NARROW_SIGNAL_VALUE_SUPPORTED
