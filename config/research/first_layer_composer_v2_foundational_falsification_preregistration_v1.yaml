    - PRIMARY_5_BPS_PAIRED_EXCESS_13_745976956735603_PP
    - PRIMARY_DRAWDOWN_DELTA_MINUS_3_4293901783962415_PP
    - ANNUAL_LONG_CALL_FRACTIONS
    - UNIVERSAL_DEFENSIVE_REGRESSION_HISTORY
