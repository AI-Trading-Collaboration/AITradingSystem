    before that decision.
policy_metadata:
  owner: project_owner_and_strategy_research_governance
  prepared_by: codex_research_coordinator
  rationale: >-
    Close the predispatch contributor, options-state, research-weight and provider-time
    gaps without editing frozen DQ/PIT V3 or exact sheet V4 and without inferring minute
    quote time from daily OptionUniverse availability.
  intended_effect: >-
    Make every candidate-forming input visible and deterministic before the only real
    run, while keeping the proposal non-dispatchable and fail closed on missing PIT,
    defensive-veto or exact-session evidence.
  validation_plan: >-
    Validate exact authority hashes, typed schema, threshold inheritance, chronological
    source mapping, deterministic rank, signal/action formulas, single-use action maxima,
    canonical serialization, tamper rejection and all safety flags before Owner review.
  review_condition: >-
    Owner must review and freeze the exact draft version, all values and every named
    formula before a candidate or R1 manifest may become dispatchable.
  expiry_condition: >-
    Draft expires on any bound authority, LEAN engine/tier, primary-window, provider
    timestamp, defensive-veto source or project identity change; a change requires a
    new version and another exact Owner freeze.
