status_object_zh: >-
  当前研究组合维持 evidence-first。TRADING-2558 在 STANDING_OWNER_SCOPE 下完成一次 write-once
  matched-placebo 时点证伪：manifest replay、canonical DQ、本地 10,000-draw run 与 independent replay
  精确执行 1/1/1/1，DQ 为 PASS 且独立重放差异为 0，所有外部或交易动作均为 0。该检验保持 385 个
  LONG interval、41 个 episode、run/gap 长度多重集、边界、82 个交易事件与 5 bps 成本不变；真实
  +13.745976956735628 个百分点 excess 位于 placebo 第 80.0 百分位，但 2,000 个 placebo 不低于真实值，
  单侧 p=0.20007999200079993，冻结 reducer 因此输出 TIMING_NOT_DISTINGUISHED_FROM_MATCHED_PLACEBO。
  真实最大回撤 9.602605144610187% 较好，但在合同中仅是描述性证据，不能覆盖主统计量。TRADING-2557
  继续维持 INSUFFICIENT/HOLD；不得重跑、事后改参数或提高本候选研究优先级，也不支持 QQQ Options
  Wave B/C、paper/live/production/broker 或任何交易动作。未来如继续，只能另行登记新的 prospective OOS。
