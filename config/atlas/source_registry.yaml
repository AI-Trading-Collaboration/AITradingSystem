results:
  - result_id: result-restart-r2
    node_id: result-restart-r2
    title: 历史研究重启：验证通过，但证据仍未闭合
    raw_status: LIMITED
    display_status: LIMITED
    reader_summary: R0～R2 工程和 validator 均完成；真实 OOS、event-risk 与 forward maturity 只支持继续闭合证据，并暂停候选扩展。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [restart-r0-r2-requirement, restart-r0-r2-closeout]
    investment_facing: false
    limitations:
      - 2022-12-01 只承担 legacy comparison，不是当前 primary default。
      - Source top-N 与 locked holdout 重叠，不能声称 unbiased OOS。
      - Validation PASS 只证明证据链可重建，不表示策略 PASS。
  - result_id: result-qld-evaluation
    node_id: evidence-qld-evaluation
    title: QLD：存在增量实现价值，但证据和角色均受限
    raw_status: LIMITED
    display_status: LIMITED
    reader_summary: QLD 提供更直接的 2x tracking 和较低外部 turnover，但高 drawdown、mixed slices 与 global DQ FAIL 阻止把它解释成独立策略或自动选择结论。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [qld-universe-evaluation]
    investment_facing: false
    limitations:
      - Scoped DQ 为 PASS_WITH_WARNINGS，不等于 canonical full-cache PASS。
      - 历史收益排名不得成为未来自动工具选择规则。
      - QLD 不是 alpha、signal、style 或自由 candidate。
  - result_id: result-qld-owner-role
    node_id: decision-qld-role
    title: QLD Owner disposition：role-limited implementation
