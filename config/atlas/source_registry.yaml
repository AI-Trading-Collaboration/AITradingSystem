nodes:
  - node_id: program-strategy-research
    node_kind: PROGRAM
    title: 策略研究主线
    summary: 从历史证据闭合、工具角色、decision target 到 O1 re-entry，所有步骤都保留来源、状态与停止边界。
    assertion_kind: RESEARCHER_INTERPRETATION
    source_ref_ids: [atlas-registry]
    raw_status: RUNNING
  - node_id: campaign-restart-evidence-closure
    node_kind: CAMPAIGN
    title: 主线 A：历史研究重启与证据闭合
    summary: R0～R2 工程链完成，但 OOS、event-risk 与 forward maturity 证据不足，新候选扩展继续暂停。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [restart-r0-r2-requirement, restart-r0-r2-closeout]
    raw_status: LIMITED
  - node_id: stage-restart-r0
    node_kind: STAGE
    title: R0 研究重启合同
    summary: 13/13 hard checks 通过，并冻结窗口角色、DQ/PIT、成本、holdout 与安全边界。
    assertion_kind: DATA_FACT
    source_ref_ids: [restart-r0-r2-requirement, restart-r0-r2-closeout]
    raw_status: PASS
  - node_id: evidence-restart-r1
    node_kind: EVIDENCE
    title: R1 OOS、robustness 与 forward evidence
    summary: 40 个 test folds 为 20 reject + 20 review-required；event_risk_high=15<20，20d/60d outcome 尚未成熟。
    assertion_kind: MODEL_RESULT
    source_ref_ids: [restart-r0-r2-closeout]
    raw_status: LIMITED
  - node_id: result-restart-r2
    node_kind: RESULT
    title: R2：继续闭合证据
    summary: 技术验证 PASS，但业务状态为 CONTINUE_EVIDENCE_CLOSURE，不允许扩展候选或启动参数搜索。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [restart-r0-r2-requirement, restart-r0-r2-closeout]
    raw_status: LIMITED
  - node_id: stop-restart-expansion
    node_kind: STOP
    title: 历史候选扩展暂停
    summary: 旧窗口仅作 legacy comparison；未来比较必须使用无污染 selection protocol 与成熟证据。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [restart-r0-r2-closeout]
    raw_status: BLOCKED
  - node_id: campaign-qld-implementation
    node_kind: CAMPAIGN
    title: 主线 B：QLD 工具角色评估
    summary: QLD 具有可复核的 2x 实现价值，但只获得 role-limited implementation 身份，不是独立策略。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [qld-universe-evaluation]
    raw_status: LIMITED
  - node_id: hypothesis-qld-implementation
    node_kind: HYPOTHESIS
    title: QLD 是否改善 2x 暴露实现
    summary: 在相同 QQQ-equivalent exposure 下比较 turnover、成本、tracking、drawdown 与 worst-window。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [qld-universe-evaluation]
    raw_status: PASS
  - node_id: evidence-qld-evaluation
    node_kind: EVIDENCE
    title: QLD historical-seen instrument evaluation
    summary: QLD 的低外部 turnover 与直接 2x tracking 提供增量实现价值，但 max drawdown 高且不同切片结果混合。
    assertion_kind: DATA_FACT
    source_ref_ids: [qld-universe-evaluation]
    raw_status: LIMITED
  - node_id: decision-qld-role
    node_kind: DECISION
    title: Owner 批准 role-limited implementation
    summary: QLD 只在上游趋势、目标暴露与风险门通过后进入执行层比较，不进入 signal/style/free-candidate universe。
    assertion_kind: OWNER_DECISION
    source_ref_ids: [qld-universe-evaluation]
    raw_status: PASS
  - node_id: blocker-qld-canonical-dq
    node_kind: BLOCKER
    title: QLD automatic selection 等待 canonical DQ strict PASS
    summary: Scoped DQ 例外不能扩展给其他 consumer；automatic selection、权重、shadow、production 与 broker 保持关闭。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [qld-universe-evaluation]
    raw_status: BLOCKED
  - node_id: campaign-decision-target
    node_kind: CAMPAIGN
    title: 主线 C：Decision target 到 O1 capability
    summary: 先建立 label foundation，再由 Owner 冻结 target 与政策，最后才允许独立 capability audit。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [label-foundation, target-redesign, o1-v1-policy, o1-v2-policy]
    raw_status: RUNNING
  - node_id: stage-label-foundation
    node_kind: STAGE
    title: Label foundation：目标合同可重建
    summary: QQQ/SPY/SGOV scoped receipt 支持四个 horizon labels，但 global DQ 仍 FAIL，且没有训练模型。
    assertion_kind: DATA_FACT
    source_ref_ids: [label-foundation]
    raw_status: LIMITED
  - node_id: stage-target-redesign
    node_kind: STAGE
    title: Owner 选择 O1 relative-opportunity single target
    summary: 5-common-session target、split、coverage 与 falsification policy 在结果读取前冻结；capability audit 仍是独立任务。
    assertion_kind: OWNER_DECISION
    source_ref_ids: [target-redesign]
    raw_status: PASS
  - node_id: campaign-o1-current-future
    node_kind: CAMPAIGN
    title: 主线 D：O1 当前结论与未来 re-entry
    summary: V1 因 coverage 不足在模型训练前关闭；V2 只冻结 2027-02-01 之后可重新申请的一次 blind look。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [o1-v1-policy, o1-v2-policy]
    raw_status: NOT_DUE
  - node_id: hypothesis-o1-relative-opportunity
    node_kind: HYPOTHESIS
    title: O1：相对机会差是否具备可研究信号
    summary: 先验证数据质量与覆盖率，再决定是否允许训练模型。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [o1-v1-policy]
    raw_status: BLOCKED
  - node_id: evidence-o1-v1-coverage
    node_kind: EVIDENCE
    title: V1 coverage-only 审计
    summary: DQ 通过，但四个 mandatory coverage floors 未全部满足。
    assertion_kind: DATA_FACT
    source_ref_ids: [o1-v1-policy]
    raw_status: BLOCKED
  - node_id: stop-o1-v1
    node_kind: STOP
    title: V1 在模型训练前停止
    summary: 没有训练模型、没有预测、没有生成投资指标，能力状态保持 NOT_EVALUATED。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [o1-v1-policy]
    raw_status: BLOCKED
  - node_id: decision-o1-route
    node_kind: DECISION
    title: Owner 选择 A+D 路线
    summary: 采用 blind calendar re-entry，并建设通用 evidence infrastructure。
    assertion_kind: OWNER_DECISION
    source_ref_ids: [o1-v2-policy]
    raw_status: PASS
  - node_id: experiment-o1-v2
    node_kind: EXPERIMENT
    title: V2 calendar re-entry（尚未到期且未获运行授权）
    summary: 最早 2027-02-01 才能重新向 Owner 申请一次 coverage look；日期不会自动触发运行。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [o1-v2-policy]
    raw_status: NOT_DUE
  - node_id: product-atlas
    node_kind: ARTIFACT
    title: Atlas 只读研究导航
    summary: 用同一证据合同展示研究路径、结果、归因、局限和下一合法动作。
    assertion_kind: RULE_JUDGMENT
    source_ref_ids: [atlas-registry]
    raw_status: PASS

