glossary:
  - term: DQ
    plain_language: Data Quality；输入数据是否完整、新鲜、无异常的质量门禁。
  - term: PIT
    plain_language: Point-in-Time；只使用当时已经知道、已经可获得的信息。
  - term: coverage
    plain_language: 数据是否足够覆盖必要样本、市场状态与事件，决定能否合法进入模型训练。
  - term: ESS
    plain_language: Effective Sample Size；考虑样本相关性后，真正提供独立信息的等效样本量。
  - term: fold
    plain_language: 按时间切分的一组训练与测试区间，用来避免只在单一时期得出结论。
  - term: purge / embargo
    plain_language: 在训练与测试之间留出隔离区，降低未来信息泄漏风险。
  - term: known_at / available_at
    plain_language: 信息被知道的时间与系统真正可取得它的时间，两者都必须满足 cutoff。
  - term: global DQ / scoped DQ
    plain_language: Global DQ 检查整套 canonical 数据；scoped DQ 只证明某个预先冻结 consumer 的必要子集可用，不能向外复用。
  - term: legacy comparison
    plain_language: 为理解历史而保留的对照窗口；它不能替代当前 2021-02-22 primary research window。
  - term: OOS
    plain_language: Out-of-Sample；在未参与选择或拟合的数据上评估。若 selection 与 holdout 重叠，就不能声称无偏 OOS。
  - term: role-limited implementation
    plain_language: 只允许在上游决策已经形成后比较执行工具，不赋予该工具独立 signal、strategy 或自动配置权。
  - term: NOT_EVALUATED
    plain_language: 研究在进入能力测试前已停止，因此既不能说模型有效，也不能说模型无效。
