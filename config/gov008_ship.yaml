schema_version: gov008_ship_policy.v1
policy_id: GOV-008-SHIP
version: 0.1.0
# PILOT_BASELINE: P2 spike. Becomes OWNER_APPROVED_ENFORCED when the owner approves the P3 cutover.
status: PILOT_BASELINE
owner: Project Owner
rationale: >
  Zone C is the small set of files whose change can alter an investment interpretation (data quality,
  PIT, research window, scoring/thresholds/position caps, production and broker boundaries, and the
  gate itself). The owner accepted this list in the GOV-008 P1 review on 2026-10-10. A zone C change
  must carry an Owner-Decision trailer in at least one commit of the shipped range.
intended_effect: >
  ship runs the gate on the local machine, records the result in a Gate trailer, and refuses a zone C
  change that has no recorded owner decision. It is an agent-run gate, not an independent verifier
  (no branch protection, owner decision 2026-10-10).
review_condition: Review at the P3 cutover and after the first 20 shipped changes.
requirement: docs/requirements/GOV-008_Research_First_Governance_Refactor.md

# Exact repository paths that are dirty for reasons unrelated to any task. They are excluded from the
# clean-tree check by exact literal pathspec and never opened by ship.
tree_clean_exclusions:
  - docs/research/growth_tilt_owner_diagnosis_pack.md

zones:
  # Zone C: semantic-critical. Everything not listed in A or C is zone B (product code and tests).
  C:
    - config/data_quality.yaml
    - config/feature_availability.yaml
    - config/data_sources.yaml
    - src/ai_trading_system/data/quality*.py
    - src/ai_trading_system/backtest/**
    - config/research/primary_research_window_policy.yaml
    - config/research/research_window_registry.yaml
    - config/market_regimes.yaml
    - config/backtest_validation_policy.yaml
    - config/scoring_rules.yaml
    - config/heuristic_governance.yaml
    - config/parameter_governance.yaml
    - config/parameters/production/current.yaml
    - config/parameters/promotion/promotion_rules.yaml
    - config/research/promotion_gate_thresholds.yaml
    - config/portfolio.yaml
    - config/risk_events.yaml
    - src/ai_trading_system/scoring/**
    - src/ai_trading_system/core/production_effect.py
    - config/execution_policy.yaml
    - config/trading_engine.yaml
    - config/ibkr_paper_*.yaml
    - config/production_boundary_static_scan_allowlist.yaml
    - src/ai_trading_system/trading_engine/brokers/**
    - src/ai_trading_system/trading_engine/execution/**
    - tests/invariants/**
    - .github/**
    - AGENTS.md
    - config/gov008_ship.yaml
    - tools/gov008/ship.py
  # Zone A: records. Documentation, task and experiment records, generated lists.
  A:
    - docs/**
    - registry/**
    - inputs/**
    - research/**
    - "*.md"

gates:
  # Commands are argv lists run from the repository root; "python" means the interpreter running
  # ship. Zone A needs no test run. The PR suite is ONE directory argument plus the transition
  # plugin: passing hundreds of file arguments makes pytest 9 collection quadratic on Windows
  # (measured 2026-10-10: tens of minutes vs 7m40s). The invariant suite (tests/invariants) does not
  # exist yet; it joins gate C when it is created in P2, until then zone C runs the PR suite only.
  A: []
  B:
    - [python, -m, pytest, tests, -n, "16", --dist, loadfile, -p, tools.gov008.pr_filter, -q]
  C:
    - [python, -m, pytest, tests, -n, "16", --dist, loadfile, -p, tools.gov008.pr_filter, -q]
