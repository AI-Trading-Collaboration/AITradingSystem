schema_version: gov008_ship_policy.v1
policy_id: GOV-008-SHIP
version: 1.2.0
# In force from the GOV-008 P3 cutover (owner_decision:GOV-008:2026-10-10:bootstrap_route_b_v1).
# 1.1.0: decision_record_excluded (owner_decision:DEVX-029:2026-10-13:decision_scoped_signoff).
# 1.1.1: strategy modules research/*/*.py in zone C (owner_decision:TRADING-2567:2026-10-13:pi_research_runs).
# 1.2.0: research_records and the records gate (owner_decision:TRADING-2565:2026-10-13:research_throughput).
status: OWNER_APPROVED_ENFORCED
owner: Project Owner
rationale: >
  Zone C is the small set of files whose change can alter an investment interpretation (data quality,
  PIT, research window, scoring/thresholds/position caps, production and broker boundaries, and the
  gate itself). The owner accepted this list in the GOV-008 P1 review on 2026-10-10. A zone C change
  must carry an Owner-Decision trailer in at least one commit of the shipped range.
intended_effect: >
  ship runs the gate on the local machine, records the result in a Gate trailer, and refuses a zone C
  change that has no recorded owner decision. It is an agent-run gate, not an independent verifier
  (no branch protection, owner decision 2026-10-10).
review_condition: Review at the P3 cutover and after the first 20 shipped changes.
requirement: docs/requirements/GOV-008_Research_First_Governance_Refactor.md

# Exact repository paths that are dirty for reasons unrelated to any task. They are excluded from the
# clean-tree check by exact literal pathspec and never opened by ship.
tree_clean_exclusions:
  - docs/research/growth_tilt_owner_diagnosis_pack.md

zones:
  # Zone C: semantic-critical. Everything not listed in A or C is zone B (product code and tests).
  C:
    - config/data_quality.yaml
    - config/feature_availability.yaml
    - config/data_sources.yaml
    - src/ai_trading_system/data/quality*.py
    - src/ai_trading_system/backtest/**
    - config/research/primary_research_window_policy.yaml
    - config/research/research_window_registry.yaml
    - src/ai_trading_system/research_bench/**
    - config/research/research_bench.yaml
    - research/*/prereg.yaml
    - research/*/*.py
    - config/market_regimes.yaml
    - config/backtest_validation_policy.yaml
    - config/scoring_rules.yaml
    - config/heuristic_governance.yaml
    - config/parameter_governance.yaml
    - config/parameters/production/current.yaml
    - config/parameters/promotion/promotion_rules.yaml
    - config/research/promotion_gate_thresholds.yaml
    - config/portfolio.yaml
    - config/risk_events.yaml
    - src/ai_trading_system/scoring/**
    - src/ai_trading_system/core/production_effect.py
    - config/execution_policy.yaml
    - config/trading_engine.yaml
    - config/ibkr_paper_*.yaml
    - config/production_boundary_static_scan_allowlist.yaml
    - src/ai_trading_system/trading_engine/brokers/**
    - src/ai_trading_system/trading_engine/execution/**
    - tests/invariants/**
    - .github/**
    - AGENTS.md
    - config/gov008_ship.yaml
    - tools/gov008/ship.py
    - .pi/extensions/aits-guard/**
    - scripts/agent/publish.ps1
    - scripts/agent/approve.ps1
  # Zone A: records. Documentation, task and experiment records, generated lists.
  A:
    - docs/**
    - registry/**
    - inputs/**
    - research/**
    - "*.md"

# Zone C paths that an owner decision record (<review_root>/decisions/, see AGENTS.md) can never
# approve: the rules and gates themselves and the production and broker boundary. A change to any of
# them still needs the owner's acceptance of its exact tree. Every entry is also a zone C entry.
decision_record_excluded:
  - AGENTS.md
  - config/gov008_ship.yaml
  - tools/gov008/ship.py
  - .pi/extensions/aits-guard/**
  - scripts/agent/publish.ps1
  - scripts/agent/approve.ps1
  - .github/**
  - src/ai_trading_system/core/production_effect.py
  - src/ai_trading_system/trading_engine/brokers/**
  - src/ai_trading_system/trading_engine/execution/**
  - config/parameters/production/current.yaml
  - config/parameters/promotion/promotion_rules.yaml
  - config/research/promotion_gate_thresholds.yaml
  - config/execution_policy.yaml
  - config/trading_engine.yaml
  - config/ibkr_paper_*.yaml
  - config/production_boundary_static_scan_allowlist.yaml

# Research records: the bench's own numbered record files and JSON-lines files. A change that touches
# one touches nothing else, and ship.py checks it mechanically instead of a reviewed tree or patch:
# numbered files are only added, numbered on from the base's last record and chained to it by
# prev_sha256; JSON-lines files only gain lines at their end, each chained to the line before it.
# commit_field must name a commit already on the base (modified_field, when given, must be false), and
# every files_at_commit hash must be the hash of that file at that commit ({dir} is the record's
# directory, {field} a value of the record). Every glob here is a zone A path.
research_records:
  numbered:
    - glob: research/*/runs/*.json
      commit_field: provenance.commit
      modified_field: provenance.code_modified
      files_at_commit:
        strategy.module_sha256: "{dir}/../{strategy.module}"
        prereg_sha256: "{dir}/../prereg.yaml"
    - glob: research/_screens/ledger/*.json
      commit_field: code.commit
      modified_field: code.modified
      files_at_commit:
        module_sha256: "src/ai_trading_system/research_screens/signals/{signal_id}.py"
        spec_sha256: "src/ai_trading_system/research_screens/signals/{signal_id}.yaml"
  appended:
    - glob: research/*/window_reads.jsonl
      commit_field: approval_commit
      files_at_commit:
        prereg_sha256: "{dir}/prereg.yaml"

gates:
  # Commands are argv lists run from the repository root; "python" means the interpreter running
  # ship. Zone A needs no test run. The PR suite is ONE directory argument: passing hundreds of
  # file arguments makes pytest 9 collection quadratic on Windows
  # (measured 2026-10-10: tens of minutes vs 7m40s). The invariant suite (tests/invariants) is part of
  # the PR suite. The transitional exclude-list plugin was removed when P4 deleted the excluded tests.
  A: []
  B:
    - [python, -m, pytest, tests, -n, "16", --dist, loadfile, -m, "not slow", -q]
  C:
    - [python, -m, pytest, tests, -n, "16", --dist, loadfile, -m, "not slow", -q]
  # A records-only change: the ledger invariants on the records as they are in the tree.
  records:
    - [python, -m, pytest, tests/invariants, -q, -k, repository_ledgers]
