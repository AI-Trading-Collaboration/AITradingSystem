schema_version: arch_005_s4d_checkout_guard_policy.v2
policy_id: arch_005_s4d_checkout_guard
version: 1.2.0
status: OWNER_APPROVED_S0_S1_S2_READ_ONLY
owner: architecture_control_plane_owner
approved_by: project_owner
approval_ref: owner_decision:ARCH-005S4D:2026-07-24:approve_narrow_s0_s1_v1
rationale: >-
  Wave14 真实暴露研发任务与 daily automation 在同一 checkout 读取半写状态并成为
  第二 writer 的风险。聊天约定和计划内 lane ownership 不能替代 checkout-scoped、
  可重放、fail-closed 的运行前门禁。
intended_effect: >-
  在首次 mutation 与 daily provider/cache/report side effect 前建立同一 ARCH-005
  lease authority；重叠 writer 串行，互不相交 domain writer 保持并行。
validation_plan:
  - workspace identity、operation class和冲突矩阵 characterization
  - overlapping writer exactly-one acquisition
  - daily active-mutation和unattributed-dirty zero-side-effect tests
  - heartbeat、expiry、replay、casefold、ancestor和reparse negative tests
  - focused、architecture、contract、integration、reproducibility和required Full
review:
  owner: architecture_control_plane_owner
  required_before_stage: S5
  condition: >-
    S2只读telemetry完成并观察至少两个独立真实集成批次后，仍须project owner
    单独review才允许评估S5；不得从telemetry PASS自动推导cutover。
authority:
  lease_schema: execution_lease.v1
  lease_event_schema: execution_lease_event.v1
  implementation: arch_005_file_execution_lease_store
  runtime_root: outputs/architecture/arch_005_s4d_checkout_guard
workspace:
  identity_method: resolved_checkout_and_git_common_dir_sha256
  require_exact_head: true
  require_git_checkout: true
protected_branch_mutation:
  approval_ref: owner_decision:ARCH-005S4E:2026-07-25:approve_checkout_handoff_reconciliation_v1
  branches:
    - main
  domain_mutation_allowed: false
  shared_mutation_actors:
    - integration-coordinator
operation_classes:
  domain_mutation:
    workspace_gate_access: READ
    path_mutation_allowed: true
  shared_mutation:
    workspace_gate_access: READ
    path_mutation_allowed: true
  daily_operation:
    workspace_gate_access: WRITE
    path_mutation_allowed: false
  read_only_audit:
    workspace_gate_access: READ
    path_mutation_allowed: false
lease:
  ttl_seconds: 21600
  heartbeat_interval_seconds: 300
  max_reassignments: 1
  arbiter_ttl_seconds: 30
  max_total_active_leases: 8
  authority_task_id: ARCH-005S4D_SHARED_CHECKOUT_WRITE_LEASE_GUARD
  allowlisted_actors:
    - architecture-control-plane
    - operations-automation
    - integration-coordinator
telemetry:
  status: OWNER_APPROVED_READ_ONLY
  owner: architecture_control_plane_owner
  approved_by: project_owner
  approval_ref: owner_decision:ARCH-005S4D-S2:2026-07-26:approve_read_only_telemetry_v1
  snapshot_schema: checkout_guard_telemetry_snapshot.v1
  rollup_schema: checkout_guard_telemetry_rollup.v1
  false_block_review_schema: checkout_guard_false_block_review.v1
  output_root: outputs/architecture/arch_005_s4d_checkout_guard/telemetry
  minimum_observation_batches: 2
  accepted_batch_kinds:
    - supervised_automation
    - s4c_integration
    - manual_control_plane
  rationale: >-
    两个独立真实批次是区分偶发checkout等待与持续控制面瓶颈的最小pilot观察窗；
    该阈值只允许形成S5评估输入，不授权source cutover。
  intended_effect: >-
    从既有immutable intent、lease event、supervised automation和S4C reconciliation
    事实生成可重放的等待、冲突、持有、expiry、unattributed与人工false-block统计。
  validation_plan:
    - raw source checksum与lease causal replay
    - wait/conflict/held/expiry/unattributed deterministic projection
    - false-block review exact observation binding
    - two-batch rollup不自动授权S5
    - focused、architecture、contract、integration、reproducibility与required Full
  review:
    owner: project_owner
    condition: >-
      至少两个unique batch_id的真实snapshot均PASS，且瓶颈归因、false-block人工复核和
      validation evidence完整后，才可另行提出S5 owner decision。
known_unrelated_exclusions:
  - path: docs/research/growth_tilt_owner_diagnosis_pack.md
    rationale: >-
      该既有user-owned research文档不参与daily import、provider、cache、DQ、score或report
      execution；只允许exact pathspec exclusion，guard不得读取、hash或复制其bytes。
    owner_ref: owner_scope_preservation_2026-07-24
safety:
  task_source_cutover: false
  automatic_task_mutation: false
  wave15_assignment: false
  strategy_logic_change: false
  strategy_threshold_change: false
  s5_cutover_authorized: false
  production_effect: none
  broker_action: none
