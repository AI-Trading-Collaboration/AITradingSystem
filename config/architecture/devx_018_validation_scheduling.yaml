    - tests/test_devx015_workflow_execution.py::test_x01_original_source_installation_rejects_stale_output_and_manifest
    - tests/test_devx015_workflow_integration.py::test_public_recovery_restores_file_creation_record_crashes
    - tests/test_devx015_workflow_integration.py::test_source_final_handoff_rejects_actual_later_phase_failure
    - tests/test_governed_development_skill.py::test_completed_admission_full_entry_real_publication_pass
