schema_version: devx_018_validation_scheduling.v1
policy_id: devx_018_governed_split_scope_scheduling
owner: validation_operations
version: 2
status: ACTIVE_PILOT
requirement: docs/requirements/DEVX-018_Validation_Runtime_Throughput_V1.md
rationale: >-
  pytest-xdist loadfile pins every test file to one worker, so the largest file
  (tests/test_arch_005_integration_publication_fence.py, 568 minutes in the v11
  Full) bounds Full wall time at about 10 hours although all nodes need only
  2.7 hours on 16 workers. Files listed below are distributed per node while
  every other file keeps loadfile semantics. Nodes that execute a real inner
  Full, source job or actual runner chain are marked real_full_chain; they are
  capped in concurrency and excluded from pre-Full tiers, where Full remains
  their only formal authority.
intended_effect: >-
  Full wall time about 5 hours (simulated from v11 node durations with cap 6);
  architecture-fitness without real_full_chain nodes and with split files in
  well under one hour. Estimates are not commitments; acceptance uses measured
  runtime profiles.
validation_evidence: >-
  outputs/validation_runtime/gov-007-p1c-devx015-full-20260929-v11/test_runtime_profile.json
  (heavy concurrency mostly 3-4, peak 14, tail 3.69 hours at 1); static review of
  the split files found no module/class/session/package fixtures or autouse
  fixtures.
review_condition: >-
  Recalibrate heavy_concurrency_cap and the lists after the first Full measured
  with this policy, and whenever a real_full_chain function is added, renamed
  or removed (a listed function that is missing from a collected split file
  fails the run closed).
# Pilot baseline. v1 used 6 (owner decision of 2026-09-30). The v13 Full at 6
# finished in 4.95 hours instead of 10.15, but overload tripped fixed
# subprocess/inspector timeouts (360 second profile inspection that takes 59-75
# seconds unloaded, cleanup waits, readiness child). v2 calibrates to 4, the
# steady level the v11 Full ran without such timeouts. Recalibrate with the next
# measured profile.
heavy_concurrency_cap: 4
split_scope_files:
  - tests/test_arch_005_integration_publication_fence.py
  - tests/test_arch_005_source_preservation.py
  - tests/test_arch_005_task_checkpoint.py
  - tests/test_devx015_workflow_acceptance.py
  - tests/test_devx015_workflow_coordination.py
  - tests/test_devx015_workflow_execution.py
  - tests/test_devx015_workflow_integration.py
  - tests/test_governed_development_skill.py
real_full_chain:
  marker: real_full_chain
  functions:
    - tests/test_arch_005_integration_publication_fence.py::test_full_transaction_replays_candidate_publish_and_closeout_receipt
    - tests/test_arch_005_integration_publication_fence.py::test_local_publication_inspection_cli_after_actual_full
    - tests/test_arch_005_integration_publication_fence.py::test_original_publication_cli_ff_only_and_independent_recovery
    - tests/test_arch_005_integration_publication_fence.py::test_original_publication_cli_interrupted_after_main_commit
    - tests/test_arch_005_integration_publication_fence.py::test_original_publication_cli_recovers_independent_main_advance
    - tests/test_arch_005_integration_publication_fence.py::test_p01_public_entries_reject_ref_only_update_before_checkout
    - tests/test_arch_005_integration_publication_fence.py::test_publication_lifecycle_binds_original_actual_full
    - tests/test_arch_005_integration_publication_fence.py::test_terminal_confirmation_cannot_be_fabricated_from_missing_observation
    - tests/test_arch_005_integration_publication_fence.py::test_x02_original_publication_rejects_ref_aba_after_actual_full
    - tests/test_devx015_workflow_acceptance.py::test_public_installation_recovers_created_directory_from_original_job
    - tests/test_devx015_workflow_acceptance.py::test_public_recovery_preserves_unknown_child_before_empty_directory_restore
    - tests/test_devx015_workflow_acceptance.py::test_source_final_handoff_recovers_real_marker_and_retention_crashes_after_heartbeat
    - tests/test_devx015_workflow_coordination.py::test_actual_full_profile_preserves_real_whole_readiness
    - tests/test_devx015_workflow_coordination.py::test_actual_pytest_pass_with_invalid_formal_profile_cannot_publish
    - tests/test_devx015_workflow_coordination.py::test_native_host_actual_full_and_publication
    - tests/test_devx015_workflow_coordination.py::test_native_linked_contender_refused_during_actual_full
    - tests/test_devx015_workflow_coordination.py::test_original_full_cannot_authorize_changed_candidate
    - tests/test_devx015_workflow_coordination.py::test_original_full_rejects_changed_publication_identities
    - tests/test_devx015_workflow_coordination.py::test_public_recovery_restores_directory_creation_record_crashes
    - tests/test_devx015_workflow_coordination.py::test_readiness_input_replaced_after_real_inspection_cannot_publish
    - tests/test_devx015_workflow_coordination.py::test_remote_admission_rechecks_original_full_profile
    - tests/test_devx015_workflow_coordination.py::test_unbound_full_profile_admits_non_devx015_publication
    - tests/test_devx015_workflow_execution.py::test_fixed_candidate_actual_runner_result_survives_main_advance
    - tests/test_devx015_workflow_execution.py::test_mandatory_acceptance_actual_runner_chain
    - tests/test_devx015_workflow_execution.py::test_public_installation_recovers_actual_partial_plan_before_job
    - tests/test_devx015_workflow_execution.py::test_public_installation_recovers_created_file_from_original_job
    - tests/test_devx015_workflow_execution.py::test_public_recovery_preserves_same_bytes_replacement_before_original_restore
    - tests/test_devx015_workflow_execution.py::test_r01_original_source_job_replays_and_rejects_changed_payload
    - tests/test_devx015_workflow_execution.py::test_source_candidate_cli_uses_real_job_and_private_two_parent_commit
    - tests/test_devx015_workflow_execution.py::test_source_final_handoff_rejects_actual_release_race_and_recovers_history
    - tests/test_devx015_workflow_execution.py::test_source_generation_and_commit_crash_recovers_without_installation
    - tests/test_devx015_workflow_execution.py::test_x01_original_source_installation_rejects_self_attested_result
    - tests/test_devx015_workflow_execution.py::test_x01_original_source_installation_rejects_stale_output_and_manifest
    - tests/test_devx015_workflow_integration.py::test_public_recovery_restores_file_creation_record_crashes
    - tests/test_devx015_workflow_integration.py::test_source_final_handoff_rejects_actual_later_phase_failure
    - tests/test_governed_development_skill.py::test_completed_admission_full_entry_real_publication_pass
    - tests/test_governed_development_skill.py::test_completed_admission_full_entry_rejects_real_invalid_context
# Units sharing a host-global resource. Under loadfile these ran serially inside
# their file; v13 split scheduling ran them concurrently and they failed.
exclusive_groups:
  # Fixed Local\AITS-DEVX015-actual-full-publication-binding Job name in both params.
  fixed_publication_binding_job:
    - tests/test_arch_005_integration_publication_fence.py::test_publication_lifecycle_binds_original_actual_full
  # Tests that create HKCU Software\AITS-DEVX015-Test-* roots or open winreg, plus
  # the test that asserts the whole root view is unchanged before/after itself.
  host_registry_view:
    - tests/test_arch_005_integration_publication_fence.py::test_original_publication_cli_ff_only_and_independent_recovery
    - tests/test_devx015_workflow_coordination.py::test_cutover_journal_preparation_binds_live_bytes
    - tests/test_devx015_workflow_coordination.py::test_enrollment_journal_resumes_same_draining_intent_with_isolated_admin_transport
    - tests/test_devx015_workflow_coordination.py::test_enrollment_native_single_value_anchor_write_readback_and_delete
    - tests/test_devx015_workflow_coordination.py::test_m04_native_per_checkout_store_hits_original_shared_store_assertion
    - tests/test_devx015_workflow_coordination.py::test_native_host_actual_full_and_publication
    - tests/test_devx015_workflow_coordination.py::test_native_linked_contender_refused_during_actual_full
    - tests/test_devx015_workflow_coordination.py::test_native_linked_publication_cli_competition
    - tests/test_devx015_workflow_coordination.py::test_native_registered_guard_competition
    - tests/test_devx015_workflow_coordination.py::test_native_registry_fixture_cleanup_inventory_contract
    - tests/test_devx015_workflow_coordination.py::test_native_registry_fixture_preserves_existing_view_and_leaves_no_new_root
    - tests/test_devx015_workflow_coordination.py::test_real_registry_host_rejects_unregistered_checkout
    - tests/test_devx015_workflow_coordination.py::test_recovery_custody_locks_original_roots_across_split_publication
    - tests/test_devx015_workflow_coordination.py::test_registration_bytes_preserve_text_and_fail_closed
    - tests/test_devx015_workflow_coordination.py::test_untrusted_locator_cannot_enrol_host
production_effect: none
