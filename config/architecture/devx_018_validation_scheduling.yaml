schema_version: devx_018_validation_scheduling.v1
policy_id: devx_018_governed_split_scope_scheduling
owner: validation_operations
version: 7
status: ACTIVE_PILOT
requirement: docs/requirements/DEVX-018_Validation_Runtime_Throughput_V1.md
rationale: >-
  pytest-xdist loadfile pins every test file to one worker, so the largest file
  (tests/test_arch_005_integration_publication_fence.py, 568 minutes in the v11
  Full) bounds Full wall time at about 10 hours although all nodes need only
  2.7 hours on 16 workers. Files listed below are distributed per node while
  every other file keeps loadfile semantics. Nodes that execute a real inner
  Full, source job or actual runner chain are marked real_full_chain; they are
  capped in concurrency and excluded from pre-Full tiers, where Full remains
  their only formal authority. Each exclusive group runs as one composite
  sequential unit, the v14 Full showed that cross-worker group blocking can
  deadlock the xdist last-item quirk (19 nodes never ran). Heavy units start at
  a spaced interval so host load ramps up instead of stepping.
intended_effect: >-
  Full wall time about 2.4-3 hours (v5, cap 8: node-level model from the
  v21 profile and the DEVX-020 K experiment; the v21 Full at cap 4 took 7.36
  hours); architecture-fitness without real_full_chain nodes and with split
  files in well under one hour. Estimates are not commitments; acceptance uses
  measured runtime profiles. With cap 4 the heavy nodes after the DEVX-018 O3
  runtime-identity reduction (about 14 node-hours) still bound the wall time at
  about 3.6 hours.
validation_evidence: >-
  outputs/validation_runtime/gov-007-p1c-devx015-full-20260929-v11/test_runtime_profile.json
  (heavy concurrency mostly 3-4, peak 14, tail 3.69 hours at 1); static review of
  the split files found no module/class/session/package fixtures or autouse
  fixtures. v14 stall: outputs/validation_runtime/gov-007-p1c-devx015-full-20260930-v14
  (deadlock reproduced offline with a discrete-event simulator; v3 scheduling is
  covered by fake-node property tests in tests/test_devx018_validation_scheduling.py).
  v5: DEVX-020 section 7 (K experiment, 21 representative heavy nodes at
  concurrency 4/6/8/12, all 21/21 passed; per-node inflation 1.00/1.13/1.23/1.43
  relative to cap 4; memory and disk were not limiting, CPU p95 saturates from 8)
  and the whole-Full wall-clock model: cap 4 about 3.6 hours, cap 6 2.8, cap 8
  2.4, cap 10 2.4, cap 12 2.5. Raw data: D:/Work/devx020-k (retained until DEVX-020
  closes).
# v6: heavy_start_interval_seconds is ramp-only (DEVX-022 S2); caps and lists unchanged.
review_condition: >-
  Recalibrate heavy_concurrency_cap and the lists after the first Full measured
  with this policy, and whenever a real_full_chain function is added, renamed
  or removed (a listed function that is missing from a collected split file
  fails the run closed), and whenever a listed split file gains a pytest fixture,
  module-level mutable state or a fixed output path (tests/test_devx022_split_scope_m6.py
  fails).
# Pilot baseline. v1 used 6 (owner decision of 2026-09-30). The v13 Full at 6
# finished in 4.95 hours instead of 10.15, but overload tripped fixed
# subprocess/inspector timeouts (360 second profile inspection that takes 59-75
# seconds unloaded, cleanup waits, readiness child). v2 calibrated to 4, the
# steady level the v11 Full ran without such timeouts. v5 (owner decision of
# 2026-10-03: choose K by experiment) uses 8: the host-side timeouts are now
# calibrated for a loaded host (1800 second waits) and DEVX-018 O3 removed the
# runtime-identity storm; the DEVX-020 K experiment found the efficiency sweet
# spot at 8 (node inflation x1.23 relative to 4, no failures; beyond 10 the
# work-conservation bound and inflation make the Full slower again). Recalibrate
# with the first measured Full under this policy.
heavy_concurrency_cap: 8
# Pilot baseline, new in v3. v11 ramped heavy units 0 to 5 over about 60 minutes
# and produced few timeouts; v13 and v14 started 4-6 heavy units at t=0 and the
# first-hour inspector, readiness and fence CLI timeouts fired under that step
# load. The spacing only applies while light units remain. v5 uses 120 seconds so
# the cap of 8 is reached after about 16 minutes (600 seconds would take 80
# minutes, about 0.7 hours of extra modelled wall time); the K experiment ran
# starts 60 seconds apart up to 12 concurrent nodes without a failure. 0 disables
# the ramp. Recalibrate with the first measured Full under this policy.
# v6 (DEVX-022 S2): the spacing now applies only to the first heavy_concurrency_cap
# heavy starts (the ramp). Before, it gated every start while light units remained,
# which caps heavy throughput at one start per interval once heavy units get short
# (modelled: the Full stays near 2.8 hours however little work remains).
heavy_start_interval_seconds: 120
# v7 (DEVX-022 M6): adds the three files whose single-worker loadfile chains set the Full's tail
# (DEVX-022 17.14 and 17.15): tests/test_named_data_quality_candidate.py (26 nodes, 10,081 s on
# one worker in the last Full), tests/test_named_simple_baseline_preview_candidate.py (10 nodes,
# 6,173 s) and tests/test_composer_prospective_capture_contract.py (192 nodes, 6,216 s). The
# real scheduler class on the measured node durations of that Full (run p-20261010-v1) gives
# 10,594 s for the v6 manifest (actual window 10,550 s) and 8,323 s for this one. Static review,
# pinned by tests/test_devx022_split_scope_m6.py: no fixtures, no autouse, no module or class
# setup, no shared mutable state; every real write goes through tmp_path or a uuid-named path.
split_scope_files:
  - tests/test_arch_005_integration_publication_fence.py
  - tests/test_arch_005_source_preservation.py
  - tests/test_arch_005_task_checkpoint.py
  - tests/test_composer_prospective_capture_contract.py
  - tests/test_devx015_workflow_acceptance.py
  - tests/test_devx015_workflow_coordination.py
  - tests/test_devx015_workflow_execution.py
  - tests/test_devx015_workflow_integration.py
  - tests/test_governed_development_skill.py
  - tests/test_named_data_quality_candidate.py
  - tests/test_named_simple_baseline_preview_candidate.py
