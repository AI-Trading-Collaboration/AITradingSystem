schema_version: devx_016_compat_ledger_policy.v1
policy_id: DEVX-016-COMPAT-LEDGER-POLICY
version: 1.0.0
status: PROPOSED_PENDING_OWNER_REVIEW
owner: Project Owner / architecture-control-plane
approval_ref: null
rationale: >-
  The compatibility authority records, section by section, the hash of every pinned source file. The
  question "which record is the current authority of a path and does the checkout still match it" is
  answered today by about 100 hand-written per-wave tests plus a nested resolver and hand-maintained
  path sets in tests/test_arch_004_refactor_policy.py. Measured on 2026-10-08 (DEVX-016 section 9):
  replaying the sections in order (removals pop, last writer wins) gives 1,992 active records, of
  which 383 differ from the checkout; 375 belong to the retired task shadow registry, 2 are volatile
  generated views and 6 are code files that changed after their last record and are excused only by
  the retroactive rules of the legacy tests. This policy names those exceptions as reviewed data so
  that every OTHER difference is a violation, and so that the exceptions can only shrink.
intended_effect: >-
  A pinned file that changes without a ledger update fails one generic test instead of depending on
  per-wave constants; the exceptions below stay exactly as wide as today and become visible; an entry
  that is no longer true (its section does not retire anything, its path left the ledger, its stale
  record matches again) is itself a violation, so the list is a ratchet that only tightens. Nothing
  here changes any investment interpretation, scoring rule, backtest or report.
validation_evidence: >-
  tests/test_arch_005_compat_ledger.py: the real ledger has zero unexplained differences and zero
  stale policy entries under this policy; 20+ mutation classes on a synthetic authority each produce
  the expected violation code. Differential check against the legacy resolver
  (DEVX-016 section 9, P4-1 record). Mutation-equivalence against the per-wave tests is P4-2.
review_condition: >-
  Owner review is required before any per-wave test is deleted (P4-3/P4-4). Re-review whenever a
  section retires paths, a volatile generated view is added, or an acknowledged stale record is
  adopted; in any case before 2027-01-08 (90 days). The acknowledged list may only shrink.

# Sections after this one are the generated ones (V3 and its predecessors regenerated by code) and
# must also satisfy the strict structure checks; older sections are immutable history.
strict_structure_after_section: phase_arch_005_s5_canonical_task_source_cutover

# A mismatching path is RETIRED when one of these sections lists it in superseded_live_source_paths
# without re-listing it in its own sources, and the section comes after the path's last record.
retiring_sections:
  - section_id: phase_arch_005_s5_canonical_task_source_cutover
    reason: >-
      ARCH-005 S5 (commit 78487d609, 2026-08-10) cut the task source over to the canonical registry
      and rewrote the retired task shadow registry files (shadow_only, source_of_truth
      LEGACY_MARKDOWN); it supersedes all 375 of them without re-listing any.

# Generated views whose content changes with every task update. They stay pinned to the generator
# chain, not to a hash frozen in a ledger section.
volatile_generated_paths:
  - path: docs/task_register.md
    reason: generated compatibility view of the canonical task registry; changes with every task update
  - path: inputs/architecture/arch_005_task_registry_index.yaml
    reason: canonical task registry index; changes with every task update

# Pinned code files that changed AFTER their last record and were never re-listed. Today only the
# retroactive rules of the legacy tests excuse them. P4-3 adopts each one (a ledger section re-lists
# it with its current hash) and removes the entry; an entry whose record matches again fails.
acknowledged_stale_records:
  - path: scripts/architecture_compatibility_authority.py
    recorded_by: phase_arch_005_s5_canonical_task_source_cutover
    reason: changed by 44b0497ba (2026-08-24, atlas reconcile) after the S5 record; not re-listed since
  - path: scripts/architecture_report_catalog_flow_authority.py
    recorded_by: phase_arch_005_s5_canonical_task_source_cutover
    reason: changed by 496665608 (2026-10-07, DEVX-016 C1 reseal command); not re-listed
  - path: src/ai_trading_system/atlas/__init__.py
    recorded_by: phase_trading_2503_atlas_qqq_options_projection_renderer_v1
    reason: changed by 6fddf0ddb (2026-08-23, TRADING-2542B reconcile) after the 2503 record; not re-listed
  - path: src/ai_trading_system/atlas/cited_query_renderer.py
    recorded_by: phase_trading_2503_atlas_qqq_options_projection_renderer_v1
    reason: changed by e2011691b (2026-09-02, TRADING-2550 reader entry) after the 2503 record; not re-listed
  - path: src/ai_trading_system/contracts/__init__.py
    recorded_by: phase_trading_2503_atlas_qqq_options_projection_renderer_v1
    reason: changed by 02200cb4d (2026-08-16, TRADING-2524) after the 2503 record; not re-listed
  - path: src/ai_trading_system/platform/architecture/report_catalog_flow_authority.py
    recorded_by: phase_arch_005_s5_canonical_task_source_cutover
    reason: changed by e6f2ef2c8 (2026-10-07, DEVX-016 C1 reseal writer); not re-listed
