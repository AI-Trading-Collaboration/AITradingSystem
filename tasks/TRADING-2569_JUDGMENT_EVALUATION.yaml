acceptance: 见 docs/requirements/TRADING-2569_Judgment_Evaluation_Module.md 第 7 节。J1：导入检查全部有反向测试（改 prob/createdAt/statement 被拒，createdAt 不早于事件被拒，重复 id 被拒，标签不在登记表被拒，learning 条目不进分母）；导入记录哈希链可验。J2：已知序列手算结算用例，anchor 两种取值，未到期不结算，同一输入同一输出，已结算的价格结果冻结（再算不一致整次拒绝），结算阈值只在受审配置里。J3a：Wilson、Brier（记分/原始/基准率）、事件合并、聚类稳健标准误、校准翻向、BH 有手算数值用例，报告每组含 MDE，状态由配置门槛机械得出，门槛不写死；补记里的 `prob` 必须与 `probRevisions` 一致。J3b：收益口径，等有价格类判断。J4：快筛规格先固定再跑，每次都入账，抢跑快筛的盘前盘后判定有用例。全套 PR 测试通过
