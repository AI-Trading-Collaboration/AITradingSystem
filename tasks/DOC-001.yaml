next_step: 已完成第一阶段 recommendation status taxonomy：日报和回测报告输出结论使用等级、适用范围、降级原因、解除条件、证据引用，并与日报投资姿态标签分开；剩余缺口是 taxonomy 配置化、未来事件窗口和更完整 owner review policy；详细拆解见 `docs/requirements/feedback_loop_governance_2026-05-04.md#doc-001`
acceptance: 每份日报和回测报告都有结论使用等级：`trend_only`、`actionable`、`review_required`、`research_only`、`data_limited`、`backtest_limited` 或等价分类；当前 `score-daily` 和回测以 `trend_judgment` 范围运行，干净通过时也只能显示趋势判断、不触发交易；同时引入独立投资姿态标签，如积极进攻、中高配、中高配但受限、中性观察、防守降仓、人工复核；低置信度、数据不足、来源不足、回测覆盖不足和事件前状态自动降级，并说明原因、解除条件和证据引用；实现时同步更新 `docs/system_flow.md` 并补充报告测试
notes: '与 `SCORE-002` 置信度拆分、`REPORT-002` 解释输出和 `REPORT-003` 决策链呈现协同；减少用户把市场状态、分数、仓位和结论可靠性混为同一个答案的风险。2026-05-04: 从 PROPOSED 改为 IN_PROGRESS，原因：开始实现日报和回测报告的结论使用等级、投资姿态标签、降级原因和解除条件。2026-05-04: 从 IN_PROGRESS 改为 BASELINE_DONE，原因：新增 `conclusion_boundary` taxonomy，日报与回测报告均输出“结论使用等级”，覆盖 `review_required`、`data_limited` 和 `backtest_limited` 降级；报告明确结论等级与投资姿态标签不能互相替代。2026-05-04: 补充 `trend_only` 和 `trend_judgment` 适用范围，原因：owner 明确当前系统只做趋势判断，不需要实际触发交易。'
