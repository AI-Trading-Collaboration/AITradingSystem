lines:
  - id: qqq_research
    kind: research
    title: QQQ 研究计划
    goal: 在 QQQ 上找到同等平均敞口下回撤更小、复利更好的做法，站住以后用期权表达
    # 三层按顺序做（2026-10-12 的方向决定）；第三层到时另立阶段。
    layers:
      - title: 方向信号
        state: now
      - title: 期权实现
        state: later
      - title: 期权市场本身的信号
        state: later
    stages:
      - id: S0
        title: 清点和定方向
        state: done
        done_on: "2026-10-12"
        milestones:
          - text: 5–9 月约 860 个研究任务重新评级，没有站得住的正面结论；方向定为 QQQ 期权路径
            state: done
            date: "2026-10-12"
            cards: [GOV-009, TRADING-2567]
      - id: S1
        title: 长历史数据
        state: done
        done_on: "2026-10-13"
        milestones:
