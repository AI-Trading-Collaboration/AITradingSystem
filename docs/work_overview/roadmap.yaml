            state: done
            date: "2026-10-13"
            cards: [TRADING-2567]
          - text: 美股大盘月度数据，给慢熊段核对用
            state: done
            date: "2026-10-21"
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
      - id: S2
        title: 研究窗口
        state: done
        done_on: "2026-10-12"
        milestones:
          - text: 开发 1999–2010，验证 2011–2021 每题只读一次，2021 起只做一致性检查
            state: done
            date: "2026-10-12"
            cards: [TRADING-2567]
      - id: S3
        title: 评估台
        state: done
        done_on: "2026-10-13"
        milestones:
          - text: 共享模拟器、试验自动登记和多重检验、标准证伪、预注册格式
            state: done
            date: "2026-10-13"
            cards:
              - TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING
              - TRADING-2566_RESEARCH_AGENT_LOOP_GUARDRAILS
      - id: S4
        title: 找方向信号
        state: now
        milestones:
          - text: 正式题五道都没在验证窗口站住
            state: done
            date: "2026-10-21"
            note: QQQ-Q1 到 Q5，10-14 到 10-21
            cards: [TRADING-2567]
          - text: 研究自动循环第 1–5 期，没有候选站住
            state: done
            date: "2026-10-23"
            note: 筛信号、试跑门、股债组合、慢熊判据、不对称再入、条件化国债；失败都打了标签
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 日报仓位方案进前瞻记录
            state: done
            date: "2026-10-22"
            note: 固定敞口 0.8 加 F0001，只记不进生产
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 第 6 期第 15 节长牛代价重测停在第 1 步
            state: done
            date: "2026-10-25"
            note: 美股大盘上两条腿的埋规则噪声 2.17–2.44，对不上 F0001 的 1.24，第 2 步没跑
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 第 6 期第 16 节埋的规则放到真实美股大盘路径上，判埋的规则太吵
            state: done
            date: "2026-10-26"
            note: R = 3 的中位 2.27 对 F0001 的 1.24；换算出科技行业的检出率（推断）
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 第 6 期第 17 节在科技行业上读一次长牛代价，判不定
            state: done
            date: "2026-10-26"
            note: 三个行业合起来每年 −0.18 对数点，区间 −3.49 到 +3.14；长牛代价只剩前瞻账本 F0008
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 第 6 期第 18 节读 QQQ 2022 慢熊段，F0001 第 1 条核对为对
            state: done
            date: "2026-10-26"
            note: D +5.15 点，在 +2.6 到 +12.0 里；旧任务用过这段，分量比新数据轻；还要再对一次
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 第四次横读：长牛代价按现有证据收题
            state: done
            date: "2026-10-27"
            note: F0001 在 QQQ 上约等于同平均敞口的固定仓位，每年少 0 到 1.5 点，回撤小；第 6 期回到只记账
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 第 6 期可行目标清单：一个都不过第一道线
            state: done
            date: "2026-10-27"
            note: 择时族没有文献锚，锚和门槛同值，按定义过不了；换锚留到续期卡；不买数据
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 第 6 期第 21 节日报仓位成绩单：两边差不多
            state: done
            date: "2026-10-28"
            note: 日报多在 0.40，是估值闸门的设定值；对同平均敞口的固定仓位 +1.3 点，多半是数据开关；落后固定 0.8 约 1 点，主要是 9 月停跑；只有约 5 个月
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 第 6 期第 22 节量试跑门的线：0.09 压在上限上，保守读法不降
            state: done
            date: "2026-10-28"
            note: 0.09 漏过 4/450，正好压在上限上；效果 10% 的检出率多约 9 个点（路径口径）、14 个点（种子口径）；门不动，进 11-20 续期卡，保守的读法是不降
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 第 6 期第 23 节：四张只印的表
            state: now
            date: "2026-11-09"
            note: 一张一张做：行业暴涨状态印完（not_holds：暴涨以后真跌多，可快腿一个月就回来，没留住；families.md 新开价格路径一行），宏观回补印完（利差 too_few：33 次退出只早到 5 次；估值 not_holds：早回来扣基准后是负的，收回 6%；families.md 利差、估值两行各记一句），下一张失业率过滤，再新闻波动 NVIX；只印，不测新规则，判定只进 11-20 续期卡或 families.md；花费超过每周上限是 Baker 选的
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 第 6 期自选目标，带每月数据预算
            state: now
            date: "2026-11-20"
            note: 清单一个都不过，回到只记账；规则照旧，菜单内有方向过两道线还按第 20 节开；前瞻账本每周五照记
            cards:
              - TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING
              - TRADING-2567
          - text: 11-20 续期卡：照旧再四周，或者换方向
            state: todo
            date: "2026-11-20"
            cards: [TRADING-2567]
          - text: 下一次慢熊段核对：下一个完整慢熊段
            state: waiting
            date: "2026-10-22"
            note: 10-22 起在等：时间看市场；F0001 再对这一次，才能拿它开题或改日报
            cards: [TRADING-2565_RESEARCH_TRIAL_LEDGER_MULTIPLE_TESTING]
          - text: 第一次前向复查
            state: todo
            note: 前瞻样本满 250 个交易日，2027-10 前后
            cards: [TRADING-2570_RESEARCH_FORWARD_RECHECK]
      - id: S5
        title: 期权实现
        state: later
        note: 方向信号在历史上过了预注册检验以后，用 QuantConnect 回测期权表达；到时另立任务
